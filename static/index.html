<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>StepCards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230064e0'/%3E%3Cpath d='m7 12.5 3 3 7-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#f1f4f7; --paper:#fff; --raised:#f7f9fb; --ink:#1c2b33; --ink2:#344854; --muted:#65788a; --line:#dde3e9; --line2:#cbd2d9;
    --accent:#0064e0; --accent-h:#0052ba; --accent-soft:#e7f0fd; --accent-ink:#0050b5;
    --bad:#c4122f; --bad-soft:#fdecef; --ok:#0a7a35; --ok-soft:#e6f4eb; --warn:#8a5600; --warn-soft:#fff3d9;
    --dark:#0b1015; --dark2:#1a222a; --dark3:#2a343e;
    --r-s:10px; --r:16px; --r-l:24px;
    --sh-1:0 1px 2px rgba(28,43,51,.06), 0 1px 3px rgba(28,43,51,.05);
    --sh-2:0 4px 12px rgba(28,43,51,.08), 0 1px 3px rgba(28,43,51,.06);
    --sh-3:0 12px 32px rgba(28,43,51,.14);
    --focus:0 0 0 3px rgba(0,100,224,.35);
    --hh:64px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); word-break:keep-all; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.005em; }
  button { font:inherit; cursor:pointer; color:inherit; }
  :focus-visible { outline:none; box-shadow:var(--focus); }
  a { color:var(--accent); text-decoration:none; font-weight:600; } a:hover { text-decoration:underline; }
  .ico { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-4px; }

  /* 위쪽 막대 */
  header { display:flex; align-items:center; gap:20px; padding:0 24px; height:var(--hh); background:rgba(255,255,255,.92); backdrop-filter:saturate(1.8) blur(16px);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; cursor:pointer; letter-spacing:-.02em; flex:none; }
  .logo .mark { width:32px; height:32px; border-radius:9px; background:var(--accent); display:grid; place-items:center; }
  .logo .mark svg { width:20px; height:20px; }
  .steps { display:flex; align-items:center; gap:2px; margin:0 auto; background:var(--bg); padding:4px; border-radius:999px; }
  .step { display:flex; align-items:center; gap:8px; padding:7px 14px 7px 8px; border-radius:999px; border:none; background:none; color:var(--muted); font-size:14px; font-weight:600; transition:background .15s, color .15s; }
  .step .dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--ink2); font-size:12px; font-weight:700; }
  .step:hover:not(:disabled):not(.on) { color:var(--ink); }
  .step.on { background:var(--paper); color:var(--ink); box-shadow:var(--sh-1); } .step.on .dot { background:var(--accent); color:#fff; }
  .step.done .dot { background:var(--ok); color:#fff; }
  .step:disabled { opacity:.45; cursor:default; }
  .arrow { display:none; }
  main { max-width:1120px; margin:0 auto; padding:32px 24px 64px; }
  h2 { margin:0 0 6px; font-size:28px; line-height:1.25; font-weight:700; letter-spacing:-.025em; } h3 { margin:40px 0 14px; font-size:18px; font-weight:700; letter-spacing:-.015em; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:16px; max-width:680px; }
  .muted { color:var(--muted); font-size:14px; } .red { color:var(--bad); font-weight:600; }
  .eyebrow { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:4px 10px; border-radius:999px; margin-bottom:14px; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2); background:var(--paper); padding:8px 16px; border-radius:999px; font-size:14px; font-weight:600; color:var(--ink); transition:background .15s, border-color .15s; }
  .btn:hover:not(:disabled) { background:var(--raised); border-color:var(--muted); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover:not(:disabled) { background:var(--accent-h); border-color:var(--accent-h); }
  .btn.big { padding:14px 26px; font-size:16px; }
  .btn:disabled { opacity:.4; cursor:default; }
  .issue { display:flex; gap:8px; align-items:flex-start; padding:10px 14px; border-radius:var(--r-s); background:var(--bad-soft); color:var(--bad); font-size:14px; font-weight:500; margin:8px 0; }
  .issue::before { content:"!"; flex:none; width:18px; height:18px; border-radius:50%; background:var(--bad); color:#fff; font-size:12px; font-weight:800; display:grid; place-items:center; margin-top:1px; }

  /* 처음 화면 */
  .hero > div { min-width:0; }
  .hero { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:32px; align-items:center; margin-bottom:8px; }
  .hero h2 { font-size:40px; letter-spacing:-.035em; }
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--line2); border-radius:var(--r-l); background:var(--paper); padding:48px 24px; text-align:center; cursor:pointer; transition:.15s; box-shadow:var(--sh-1); min-height:280px; }
  .drop:hover, .drop.over { border-color:var(--accent); background:var(--accent-soft); }
  .drop .big { font-size:18px; font-weight:700; }
  .drop .plus { width:64px; height:64px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; margin-bottom:8px; box-shadow:0 6px 16px rgba(0,100,224,.3); }
  .drop .plus svg { width:28px; height:28px; stroke-width:2.2; }
  .drop .btn { margin-top:10px; pointer-events:none; }
  .drop .makewhere { margin-top:6px; } .drop #mkwhered { max-width:360px; font-size:13px; }
  .flow { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:40px 0 8px; }
  .flow div { background:var(--paper); border-radius:var(--r); padding:20px; box-shadow:var(--sh-1); }
  .flow .fi { width:40px; height:40px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin-bottom:12px; }
  .flow .fi .ico { width:22px; height:22px; }
  .flow strong { display:block; font-size:16px; margin-bottom:2px; }
  .uses { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .uses div { background:var(--paper); border-radius:var(--r); padding:16px; box-shadow:var(--sh-1); display:flex; flex-direction:column; gap:4px; }
 
  .uses .fi { width:36px; height:36px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin-bottom:6px; }
  .uses strong { font-size:15px; }
  .uses .exs { margin-top:auto; padding-top:10px; display:flex; flex-direction:column; gap:6px; } .uses .ex { font-size:13px; } .uses .muted { font-size:13px; }
  @media (max-width:1000px) { .uses { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) { .uses { grid-template-columns:1fr; } }
  .heroex { margin:4px 0 14px; } .heroex > div { display:flex; flex-wrap:wrap; gap:8px; padding:6px 0 4px; }
  @media (max-width:720px) { .heroex > div { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; } }
  .heroex a { flex:none; display:flex; align-items:center; gap:8px; background:var(--paper); border-radius:999px; padding:4px 14px 4px 4px; box-shadow:var(--sh-1); color:var(--ink); font-size:13px; font-weight:600; max-width:240px; }
  .heroex a:hover { text-decoration:none; box-shadow:var(--sh-2); } .heroex img { width:44px; height:32px; object-fit:cover; border-radius:999px; } .heroex span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .models { font-size:13px; color:var(--muted); margin:0; line-height:1.7; } .models b { color:var(--ink2); font-weight:700; }
  .past { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .pastcard { background:var(--paper); border-radius:var(--r); overflow:hidden; color:inherit; font-weight:400; box-shadow:var(--sh-1); transition:box-shadow .15s, transform .15s; }
  .keyask { position:fixed; inset:0; z-index:50; background:rgba(11,16,21,.55); display:grid; place-items:center; padding:16px; }
  .keyask form { background:var(--paper); color:var(--ink); border-radius:var(--r-l); padding:24px; width:min(380px,100%); display:grid; gap:10px; box-shadow:var(--sh-3); }
  .keyask input { font:inherit; padding:12px; border:1px solid var(--line2); border-radius:12px; } .keyask input:focus { outline:none; border-color:var(--accent); box-shadow:var(--focus); }
  .pastcard { position:relative; }
  .adminlink { margin-top:28px; } .adminlink a { color:var(--muted); font-weight:500; }
  .adminrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 14px; }
  .admintable { width:100%; border-collapse:collapse; background:var(--paper); border-radius:var(--r); overflow:hidden; box-shadow:var(--sh-1); font-size:13px; }
  .admintable th, .admintable td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; } .admintable td:first-child { white-space:normal; }
  .admintable .btn { padding:4px 10px; font-size:12px; margin-right:4px; }
  .ask { display:flex; align-items:center; gap:10px; background:var(--paper); border-radius:999px; padding:6px 6px 6px 14px; box-shadow:var(--sh-1); margin:0 0 10px; }
  .ask .ci { color:var(--accent); display:grid; } .ask input { flex:1; min-width:0; border:none; font:inherit; font-size:15px; background:transparent; color:var(--ink); } .ask input:focus { outline:none; }
  .askbox { background:var(--paper); border-radius:var(--r); padding:14px 18px; box-shadow:var(--sh-1); margin:0 0 12px; display:grid; gap:8px; }
  .askrow { display:flex; gap:10px; align-items:flex-start; } .askrow .n { width:26px; height:26px; font-size:12px; flex:none; } .askrow s { color:var(--muted); }
  .askbtns { display:flex; gap:8px; }
  .caught { background:var(--ok-soft); color:var(--ok); border-radius:var(--r); padding:10px 14px; margin:0 0 12px; font-size:14px; }
  .caught summary { cursor:pointer; font-weight:700; } .caught summary .ico { width:18px; height:18px; } .caught ul { margin:6px 0 0; padding-left:20px; color:var(--ink2); }
  .jump { display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
  .jump button { flex:none; min-width:34px; height:34px; border-radius:99px; border:1px solid var(--line2); background:var(--paper); font-weight:700; font-size:13px; color:var(--ink2); }
  .jump button.bad { border-color:var(--bad); color:var(--bad); background:var(--bad-soft); }
  .tab .txt { cursor:pointer; } .tab .hear .ico { width:.6em; height:.6em; opacity:.5; vertical-align:middle; }
  @media (max-width:720px) { .toolbar { position:static; } .jump { position:sticky; top:var(--hh); z-index:5; background:rgba(241,244,247,.95); backdrop-filter:blur(12px); padding-top:8px; margin:0 -16px; padding-left:16px; padding-right:16px; } }
  @media (pointer:coarse) { .seg.mini button, .linkbtn, .actions .btn, .between .btn { min-height:40px; } }
  .pastcard .del { position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%; border:none; background:rgba(11,16,21,.6); color:#fff; display:grid; place-items:center; opacity:0; transition:opacity .15s; }
  .pastcard:hover .del, .pastcard .del:focus-visible { opacity:1; } .pastcard .del .ico { width:16px; height:16px; }
  @media (hover:none) { .pastcard .del { opacity:1; } }
  .titlein { font:inherit; font-size:20px; font-weight:700; border:1.5px solid transparent; border-radius:var(--r-s); padding:4px 10px; background:transparent; color:var(--ink); min-width:0; width:min(320px,100%); }
  .titlein:hover { background:var(--paper); } .titlein:focus { outline:none; border-color:var(--accent); background:#fff; box-shadow:var(--focus); }
  .pastcard:hover { box-shadow:var(--sh-2); transform:translateY(-2px); text-decoration:none; }
  .pastcard img, .pastcard .ph { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--line); }
  .pt { padding:12px 16px 14px; display:flex; flex-direction:column; gap:2px; } .pt strong { font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 만드는 중 */
  .stages { display:grid; gap:0; margin:8px 0 24px; background:var(--paper); border-radius:var(--r); box-shadow:var(--sh-1); overflow:hidden; }
  .stage { display:flex; gap:16px; align-items:flex-start; padding:18px 20px; border-bottom:1px solid var(--line); }
  .stage:last-child { border-bottom:none; }
  .stage .ic { width:28px; height:28px; border-radius:50%; flex:none; border:2.5px solid var(--line); display:grid; place-items:center; font-size:14px; font-weight:700; }
  .stage.done .ic { background:var(--ok); border-color:var(--ok); color:#fff; } .stage.done .ic::after { content:"✓"; }
  .stage.now { background:var(--accent-soft); } .stage.now .ic { border-color:var(--accent); border-top-color:transparent; animation:spin .9s linear infinite; }
  .stage.wait { opacity:.5; }
  .stage strong { font-size:15px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .prog { height:6px; background:rgba(0,100,224,.15); border-radius:99px; overflow:hidden; margin:10px 0 4px; width:min(420px,100%); }
  .prog i { display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s; }
  .detail { font-size:14px; margin-top:8px; color:var(--warn); background:var(--warn-soft); padding:10px 12px; border-radius:var(--r-s); } .detail ul { margin:4px 0 0; padding-left:18px; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px; margin-bottom:24px; }
  .thumbs img { width:100%; border-radius:var(--r-s); aspect-ratio:16/9; object-fit:cover; box-shadow:var(--sh-1); }
  .log { margin-top:32px; font-size:13px; color:var(--muted); } .log summary { cursor:pointer; font-weight:600; }

  /* 확인·고치기 */
  .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:var(--hh); background:rgba(241,244,247,.92); backdrop-filter:blur(12px); padding:14px 0; z-index:5; margin-top:-14px; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:700; border:none; }
  .chip.ok { background:var(--ok-soft); color:var(--ok); } .chip.bad { background:var(--bad-soft); color:var(--bad); }
  .saved { color:var(--muted); font-size:13px; }
  .hint { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .list { display:flex; flex-direction:column; }
  .row { position:relative; display:grid; grid-template-columns:36px minmax(220px,340px) 1fr; gap:20px; background:var(--paper); border-radius:var(--r-l); padding:18px; align-items:start; box-shadow:var(--sh-1); transition:box-shadow .15s; }
  .row:hover { box-shadow:var(--sh-2); }
  .row.has-bad { box-shadow:0 0 0 2px var(--bad), var(--sh-1); }
  .n { width:32px; height:32px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px; }
  .pic { position:relative; border-radius:var(--r); overflow:hidden; background:var(--line); aspect-ratio:16/9; }
  .pic img, .pic video { width:100%; height:100%; object-fit:cover; display:block; }
  .pic .busy { position:absolute; inset:0; background:rgba(255,255,255,.8); backdrop-filter:blur(2px); display:grid; place-items:center; font-weight:600; color:var(--accent-ink); }
  .picbar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .seg.mini button { padding:4px 12px; font-size:13px; }
  .linkbtn { display:inline-flex; align-items:center; gap:4px; background:none; border:none; color:var(--accent); padding:6px 2px; font-size:14px; font-weight:600; border-radius:8px; }
  .linkbtn:hover:not(:disabled) { color:var(--accent-h); }
  .linkbtn .ico { width:18px; height:18px; }
  textarea.say { width:100%; border:1.5px solid transparent; border-radius:var(--r-s); padding:6px 10px; font:inherit; font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.35; resize:none; background:transparent; color:var(--ink); overflow:hidden; transition:background .15s, border-color .15s; }
  textarea.say:hover { background:var(--raised); }
  textarea.say:focus { outline:none; border-color:var(--accent); background:#fff; box-shadow:var(--focus); }
  textarea.say.en { font-size:15px; font-weight:500; color:var(--muted); letter-spacing:0; }
  textarea.say::placeholder { color:#a9b5c0; }
  .meta { color:var(--muted); font-size:13px; padding:4px 10px; }
  .row .issue { margin:8px 10px 0; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; padding:0 10px; }
  .actions .btn { padding:6px 12px; font-size:13px; }
  .more { margin:12px 10px 0; padding:14px 16px; border-radius:var(--r); background:var(--raised); border:1px solid var(--line); display:grid; gap:12px; font-size:14px; }
  .more label { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .more input { padding:7px 10px; border:1px solid var(--line2); border-radius:var(--r-s); font:inherit; background:#fff; color:var(--ink); }
  .more input:focus { outline:none; border-color:var(--accent); box-shadow:var(--focus); }
  .more input[type=number] { width:80px; } .more input[type=checkbox] { accent-color:var(--accent); width:18px; height:18px; }
  .strip { grid-column:1/-1; display:flex; gap:8px; overflow-x:auto; padding:6px 0 8px; scrollbar-width:thin; }
  .strip button { flex:none; border:3px solid transparent; border-radius:12px; padding:0; background:none; position:relative; transition:border-color .15s; }
  .strip button:hover { border-color:var(--line2); }
  .strip button.cur { border-color:var(--accent); }
  .strip img { width:132px; display:block; border-radius:9px; }
  .strip span { position:absolute; bottom:5px; right:6px; background:rgba(11,16,21,.7); color:#fff; font-size:11px; font-weight:600; padding:1px 6px; border-radius:6px; }
  .between { display:flex; justify-content:center; align-items:center; gap:8px; padding:8px 0; flex-wrap:wrap; opacity:0; transition:opacity .15s; }
  .between:hover, .between:focus-within, .between.gap { opacity:1; }
  .between .btn { padding:5px 14px; font-size:13px; background:var(--paper); border-color:var(--line); color:var(--ink2); }
  .between.gap .note { color:var(--warn); background:var(--warn-soft); padding:4px 12px; border-radius:999px; font-size:13px; font-weight:600; }
  .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; display:flex; gap:16px; align-items:center; z-index:30; font-size:14px; box-shadow:var(--sh-3); animation:up .2s ease-out; }
  .toast button { background:none; border:none; color:#7fb6ff; font-weight:700; }
  @keyframes up { from { opacity:0; transform:translate(-50%,8px); } }

  /* 인쇄·태블릿 */
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:16px 0 24px; }
  .choice { display:flex; flex-direction:column; align-items:flex-start; gap:4px; background:var(--paper); border:none; border-radius:var(--r-l); padding:22px; text-align:left; color:var(--ink); box-shadow:var(--sh-1); transition:box-shadow .15s, transform .15s; }
  .choice:hover { box-shadow:var(--sh-2); transform:translateY(-2px); }
  .choice .ci { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); margin-bottom:10px; }
  .choice .ci .ico { width:24px; height:24px; }
  .choice.feat { background:var(--dark); color:#fff; } .choice.feat .ci { background:var(--accent); color:#fff; } .choice.feat .d { color:#a9b8c6; }
  .choice .t { font-size:18px; font-weight:700; letter-spacing:-.015em; } .choice .d { color:var(--muted); font-size:14px; }
  .glassrow { display:flex; align-items:center; gap:14px; background:var(--paper); border-radius:var(--r); padding:14px 18px; box-shadow:var(--sh-1); margin:-8px 0 20px; }
  .qrrow { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:-6px 0 20px; }
  .qrrow > div { background:var(--paper); border-radius:var(--r); padding:14px; box-shadow:var(--sh-1); display:flex; flex-direction:column; align-items:center; text-align:center; gap:2px; }
  .qrrow img { border-radius:8px; margin-bottom:6px; } .qrrow .btn { margin-top:8px; }
  @media (max-width:720px) { .qrrow img { display:none; } } .qrrow p { grid-column:1/-1; margin:0; }
  .glassrow .ci { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--dark); color:#fff; flex:none; }
  .glassrow > div { flex:1; display:flex; flex-direction:column; } .glassrow a:hover { text-decoration:none; }
  .langrow { flex-wrap:wrap; }

<body>
<header>
  <span class="logo" onclick="go({})"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="13" height="15" rx="2.5"/><path d="M4 7v11a3 3 0 0 0 3 3h9"/><path d="m10.5 10.5 2 2 4-4"/></svg></span><span>StepCards</span></span>
  <nav class="steps" id="steps"></nav>
  <span style="flex:1"></span>
  <span class="seg" id="uiseg"></span>
</header>
<main id="main"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
// 보기는 누구나. 돈이 들거나 카드를 바꾸는 요청이 401(접속 키 필요)이면 키를 한 번 묻고 같은 요청을 다시 보낸다
const rawFetch = window.fetch.bind(window);
let keyAsk = null;
window.fetch = async (u, o = {}) => {
  const r = await rawFetch(u, o);
  if (r.status === 429) toast(T("심사용 키의 오늘 한도를 다 썼어요. 보기는 계속 돼요.", "The judge key has reached today's limit. Viewing still works."));
  if (r.status !== 401 || !o.method || o.method === "GET" || String(u) === "/login") return r;
  if (Date.now() - keyDeclined < 60000) return r;  // 방금 '취소'했으면 1분 동안은 다시 묻지 않는다(자동 저장·따라 하기가 창을 계속 띄우지 않게)
  return (await askKey()) ? rawFetch(u, o) : r;
};
let keyDeclined = 0;
function askKey() {
  return keyAsk ??= new Promise(done => {
    const box = document.createElement("div");
    box.className = "keyask";
    box.innerHTML = `<form><b>${T("접속 키가 필요해요", "Access key needed")}</b>
      <span class="muted">${T("보기는 누구나 할 수 있어요. 영상 넣기, 그림 만들기, 따라 하기처럼 비용이 들거나 카드를 바꾸는 일에만 키가 필요해요.", "Anyone can view. Adding videos, drawings, Coach mode and edits need the key, because they cost credits or change cards.")}</span>
      <input type="password" autocomplete="current-password" aria-label="${T("접속 키", "Access key")}" placeholder="${T("접속 키", "Access key")}">
      <span class="red" hidden></span>
      <div><button class="btn primary">${T("확인", "OK")}</button> <button type="button" class="btn">${T("취소", "Cancel")}</button></div></form>`;
    const end = ok => { box.remove(); keyAsk = null; if (!ok) keyDeclined = Date.now(); done(ok); };
    box.querySelector("button[type=button]").onclick = () => end(false);
    box.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      const r = await rawFetch("/login", { method: "POST", body: new URLSearchParams({ k: box.querySelector("input").value }) });
      if (r.ok) return end(true);
      const m = box.querySelector(".red"); m.hidden = false; m.textContent = T("키가 맞지 않아요.", "That key is not right.");
    };
    document.body.append(box); box.querySelector("input").focus();
  });
}
// 선 아이콘(24px 격자). 이모지는 기기마다 모양이 달라서 쓰지 않는다
const IC = { plus:'<path d="M12 5v14M5 12h14"/>', video:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10 5-3v10l-5-3"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/>', print:'<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6H7z"/>',
  tablet:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M11 18h2"/>', glasses:'<rect x="2.5" y="9.5" width="8" height="6.5" rx="3"/><rect x="13.5" y="9.5" width="8" height="6.5" rx="3"/><path d="M10.5 12c1-.9 2-.9 3 0M2.5 11 1.8 8.5M21.5 11l.7-2.5"/>',
  draw:'<path d="M12 3 13.6 8.4 19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6z"/><path d="M19 16v4M17 18h4"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  share:'<path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>',
  sound:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>', mute:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/>' };
const icon = n => `<svg class="ico" viewBox="0 0 24 24">${IC[n]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => `${Math.floor(t / 60)}:${String(Math.round(t) % 60).padStart(2, "0")}`;
const pad = (n, w = 2) => String(n).padStart(w, "0");
const S = { run: null, view: "home", data: null, idx: 0, poll: null, busy: new Map(), open: new Set(), strip: new Set(),
            saveTimer: null, saving: Promise.resolve(), saveState: "saved" };
let lang = (() => { try { return localStorage.getItem("lang"); } catch { return null; } })();  // 카드 글자(고른 적 없으면 화면 언어)
const langChosen = !!lang;
let ui = (() => {  // 화면 글자: 주소의 ?ui= → 저장된 값 → 브라우저 언어
  const q = new URLSearchParams(location.search).get("ui");
  if (q === "ko" || q === "en") return q;
  try { return localStorage.getItem("ui") || (navigator.language.startsWith("ko") ? "ko" : "en"); } catch { return "ko"; }
})();
const T = (ko, en) => ui === "en" ? en : ko;
lang ??= ui === "en" ? "en" : "ko";
const runTitle = r => (ui === "en" && r.title_en) || r.title || r.video;  // 견본은 영어 제목도 있다
function setUi(v) { ui = v; if (!langChosen) lang = v; try { localStorage.setItem("ui", v); } catch {} document.documentElement.lang = v; route(); }

function go(p) { location.hash = p.run ? new URLSearchParams(p).toString() : ""; }
window.addEventListener("hashchange", route);

async function route() {
  clearInterval(S.poll);
  stopCoach();
  const p = new URLSearchParams(location.hash.slice(1));
  const run = p.get("run");
  if (run !== S.run) { S.run = run; S.data = null; S.undo = null; S.framesOk = false; S.idx = 0; S.open.clear(); S.strip.clear(); }
  S.view = run ? (p.get("view") || "making") : p.get("view") === "admin" ? "admin" : "home";
  if (run && !S.data) { const r = await fetch(`/api/runs/${run}/cards`); if (r.ok) S.data = await r.json(); else if (r.status === 404 && (await fetch(`/api/runs/${run}/progress`)).status === 404) S.view = "missing"; }
  if (["edit", "use", "tablet", "coach"].includes(S.view) && !S.data) S.view = "making";
  document.body.classList.toggle("tabmode", S.view === "tablet" || S.view === "coach");
  document.documentElement.lang = ui;
  $("#uiseg").innerHTML = [["ko", "한국어"], ["en", "English"]].map(([v, l]) => `<button class="${ui === v ? "on" : ""}" onclick="setUi('${v}')">${l}</button>`).join("");
  header();
  ({ home, making, edit, use, tablet, coach, missing, admin })[S.view]();
}

/* 위쪽 1·2·3 단계 표시 */
function header() {
  const done = !!S.data, cur = ["tablet", "coach"].includes(S.view) ? "use" : S.view === "home" ? "making" : S.view;
  const items = [["making", T("영상 넣기", "Add video")], ["edit", T("카드 확인·고치기", "Check & edit")], ["use", T("인쇄·태블릿", "Print · Tablet · Coach")]];
  $("#steps").innerHTML = items.map(([v, l], i) => {
    const ok = (v === "making" && done) || (v === "edit" && done && cur === "use" && !(S.data.problems || []).length);
    const off = !S.run || (v !== "making" && !done);
    return `${i ? '<span class="arrow">›</span>' : ""}<button class="step ${cur === v ? "on" : ""} ${ok ? "done" : ""}" ${off && cur !== v ? "disabled" : ""}
      onclick="${S.run ? `go({run:S.run,view:'${v}'})` : ""}"><span class="dot">${ok ? "✓" : i + 1}</span>${l}</button>`;
  }).join("");
}

function imgSrc(c) {
  if (c.view === "ill" && c.ill) return `/runs/${S.run}/${c.ill}?v=${c.v || 0}`;
  const f = c.box && !c.hl_off ? c.image.replace(".jpg", "_hl.jpg") : c.image;
  return `/runs/${S.run}/${f}?v=${c.v || 0}`;
}
// 움직임 보기: 그 단계 영상 몇 초를 소리 없이 반복. 인쇄·미리 불러오기는 사진(imgSrc)을 쓴다
function media(c, attrs = "") {
  return c.view === "clip" ? `<video src="/api/runs/${S.run}/clip/${c.n}.mp4?t=${c.frame_t ?? c.rep}" poster="${imgSrc(c)}" autoplay muted loop playsinline ${attrs}></video>`
                           : `<img src="${imgSrc(c)}" alt="${esc(c.ko)}" ${attrs}>`;  // 사진 설명 = 카드 문장(화면 낭독기)
}
function text(c) {
  if (lang === "en") return esc(c.en);
  if (lang === "both") return `${esc(c.ko)}<span class="en">${esc(c.en)}</span>`;
  return esc(c.ko);
}
function setLang(v) { lang = v; try { localStorage.setItem("lang", v); } catch {} ({ use, tablet })[S.view]?.(); }
function toast(msg, label, act) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span>${esc(msg)}</span>${label ? `<button>${esc(label)}</button>` : ""}`;
  if (label) t.querySelector("button").onclick = () => { t.remove(); act(); };
  document.body.append(t);
  setTimeout(() => t.remove(), 6000);
}

/* 관리자 화면: 저장 공간을 카드 묶음·교사별로 보고 정리·보관·백업 */
const mb = b => b >= 1073741824 ? `${(b / 1073741824).toFixed(1)}GB` : `${(b / 1048576).toFixed(b < 10485760 ? 1 : 0)}MB`;
async function admin() {
  const r = await fetch("/api/admin/storage");
  if (!r.ok) { $("#main").innerHTML = `<h2>${T("관리자 화면", "Admin")}</h2><p class="sub">${T("관리자 키로 들어와야 볼 수 있어요.", "Sign in with the admin key to see this page.")}</p><button class="btn primary" onclick="askKey().then(ok => ok && admin())">${T("관리자 키 넣기", "Enter admin key")}</button>`; return; }
  const d = await r.json(), used = d.total - d.free, stageName = s => ({ making: T("만드는 중", "making"), done: T("완성", "done"), compact: T("정리됨", "compacted"), archived: T("보관됨", "archived"), error: T("멈춤", "stopped") })[s] || s;

async function upload(f) {
  if (!f.type.startsWith("video/")) return toast(T("영상 파일만 넣을 수 있어요.", "Only video files can be added."));
  const dur = await new Promise(res => { const v = document.createElement("video"); v.preload = "metadata"; v.onloadedmetadata = () => res(v.duration); v.onerror = () => res(0); v.src = URL.createObjectURL(f); });
  if (dur > 600) return toast(T(`영상이 ${Math.round(dur / 60)}분이에요. 10분 안으로 잘라서 넣어 주세요(1~5분이 가장 좋아요).`, `This video is ${Math.round(dur / 60)} min. Please trim it to under 10 minutes (1–5 is best).`));
  $("#drop").innerHTML = `<div class="big">${T("영상을 올리는 중…", "Uploading…")}</div>`;
  const fd = new FormData(); fd.append("file", f); if (S.makeLocal) fd.append("local", "true");
  const r = await fetch("/api/upload", { method: "POST", body: fd });
  if (!r.ok) {  // 서버가 알려 준 이유(크기·길이·저장 공간·키 없음)를 그대로
    const why = { 413: T("영상이 너무 커요(500MB 이하).", "The video is too large (max 500 MB)."), 400: T("영상 길이는 10분 이하여야 해요. 영상 파일이 맞는지도 확인해 주세요.", "Videos must be 10 minutes or shorter, and a real video file."),
                  503: T("Meta API 키가 없어서, '이 맥에서'로만 만들 수 있어요.", "No Meta API key: only 'On this Mac' can make cards."), 507: T("서버 저장 공간이 부족해요. 안 쓰는 카드 묶음을 지워 주세요.", "The server is out of space. Delete card sets you no longer need."),
                  409: T("이 맥의 Muse Glimmer 서버가 꺼져 있어요.", "The Muse Glimmer server on this Mac is not running.") }[r.status];
    toast(why || T("올리지 못했어요. 다시 해 주세요.", "Upload failed. Please try again.")); return home();
  }
  go({ run: (await r.json()).id, view: "making" });
}

/* ① 만드는 중 */
async function making() {
  const draw = async () => {
    const wasOpen = $("details.log")?.open;
    const p = await (await fetch(`/api/runs/${S.run}/progress`)).json();
    const ev = p.events || [];
    const has = s => ev.some(e => e.stage === s);
    const splits = ev.filter(e => e.stage === "split" && e.n !== undefined);
    const hl = ev.filter(e => e.stage === "highlight" && e.i);
    const total = hl.at(-1)?.total || splits.at(-1)?.n || 0;
    const err = ev.find(e => e.stage === "error"), done = has("done");
    const st = (ok, now) => ok ? "done" : now ? "now" : "wait";
    const s1 = st(has("extract"), !err && !has("extract"));
    const listenEv = ev.find(e => e.stage === "listen");
    const local = ev.some(e => e.stage === "start" && e.local);  // 이 맥에서(Glimmer) 만드는 중
    const sL = st(!!listenEv, !err && has("extract") && !listenEv);
    const s2 = st(has("highlight") || done, !err && !!listenEv && !has("highlight"));
    const s3 = st(done, !err && has("highlight") && !done);
    const retried = splits.slice(0, -1);
    const last = splits.at(-1);
    $("#main").innerHTML = `
      <h2>${done ? T("카드가 다 만들어졌어요", "Your cards are ready") : err ? T("만들다가 멈췄어요", "Stopped with an error") : T("카드를 만들고 있어요", "Making your cards")}</h2>
      <p class="sub">${esc(p.title || p.video || "")}${done || err ? "" : T(" · 몇 분 걸려요. 이 창을 닫아도 계속 만들어져요.", " · This takes a few minutes. It keeps going if you close this window.")}</p>
      ${err ? `<div class="issue">${esc(errText(err.msg))}</div><p><button class="btn primary" onclick="retryRun()">${T("다시 만들기", "Try again")}</button> <span class="muted">${T("자세한 내용은 아래 '자세한 기록'에 있어요.", "Details are in the log below.")}</span></p>` : ""}
      ${done ? `<p><button class="btn primary big" onclick="openEdit()">${T("카드 확인하러 가기 →", "Check the cards →")}</button></p>` : ""}
      <div class="stages">
        <div class="stage ${s1}"><span class="ic"></span><div><strong>${T("영상에서 1초마다 사진 뽑기", "Take a frame every second")}</strong></div></div>
        <div class="stage ${sL}"><span class="ic"></span><div><strong>${T("영상 속 말 받아쓰기 (Muse Voice Transcribe)", "Transcribe what was said (Muse Voice Transcribe)")}</strong>
          ${listenEv ? `<div class="muted">${listenEv.local ? T("이 맥에서 만들기라 건너뛰었어요(소리가 밖으로 나가지 않게)", "Skipped: making on this Mac, so audio stays here") : listenEv.n ? T(`말 ${listenEv.n}구간 받아씀 · 양과 재료 이름을 문장에 넣을 때 써요`, `${listenEv.n} speech turns · used for amounts and names in the sentences`) : T("영상에 말소리가 없음", "No speech in this video")}</div>` : ""}</div></div>
        <div class="stage ${s2}"><span class="ic"></span><div><strong>${local ? T("동작마다 단계를 나누고 문장 쓰기 (Muse Glimmer · 이 맥)", "Split into one-action steps and write sentences (Muse Glimmer · this Mac)") : T("동작마다 단계를 나누고 문장 쓰기 (Muse Spark)", "Split into one-action steps and write sentences (Muse Spark)")}</strong>
          ${last ? `<div class="muted">${T(`단계 ${last.n}개`, `${last.n} steps`)} · ${last.problems.length ? T("고칠 곳이 남아 확인이 필요해요", "some issues remain for a person to check") : T("규칙 검사 통과", "passed the rule check")}</div>` : ""}
          ${retried.length ? `<div class="detail">${T("규칙 검사에서 걸린 곳이 있어서, 이유를 알려 주고 다시 만들게 했어요.", "The rule check found a problem, so the model was told why and asked to try again.")}<ul>${retried.flatMap(s => s.problems).map(x => `<li>${esc(problemText(x, true))}</li>`).join("")}</ul></div>` : ""}</div></div>
        <div class="stage ${s3}"><span class="ic"></span><div><strong>${local ? T("카드마다 사진 고르기 (물건 테두리는 건너뜀)", "Pick a photo per card (object outlines skipped)") : T("카드마다 사진을 고르고, 손에 든 물건에 테두리 그리기 (SAM 3.1)", "Pick a photo per card and outline the object in hand (SAM 3.1)")}</strong>
          ${total && !done ? `<div class="prog"><i style="width:${hl.length / total * 100}%"></i></div><div class="muted">${hl.length} / ${total}</div>` : ""}</div></div>
      </div>
      ${hl.length ? `<div class="thumbs">${hl.map(e => `<img src="/runs/${S.run}/cards/${pad(e.i)}.jpg" alt="">`).join("")}</div>` : ""}
      <details class="log" ${wasOpen ? "open" : ""}><summary>${T("자세한 기록", "Detailed log")}</summary>${ev.map(e => `<div>${esc(e.msg)}</div>`).join("")}
        <div>${T("모델 비용 합계 약", "Model cost, about")} $${ev.reduce((s, e) => s + (e.cost || 0), 0).toFixed(3)}</div></details>`;
    if (done || err) clearInterval(S.poll);
  };
  await draw();
  S.poll = setInterval(draw, 1200);
}
// 프로그램 오류문 대신 할 일을 쉬운 말로
function errText(m) {
  if (/401|403|unauthori|api.?key|MODEL_API_KEY/i.test(m)) return T("Meta API 키가 맞지 않아요. 서버의 MODEL_API_KEY를 확인해 주세요.", "The Meta API key was refused. Check MODEL_API_KEY on the server.");
  if (/다시 시작돼서/.test(m)) return T("서버가 다시 시작돼서 만들던 작업이 끊겼어요. '다시 만들기'를 눌러 주세요.", "The server restarted while making these cards. Press Try again.");
  if (/429|rate/i.test(m)) return T("Meta API 사용량이 잠시 넘쳤어요. 1분쯤 뒤에 다시 해 주세요.", "Too many requests to the Meta API. Try again in a minute.");
  if (/timeout|timed out|connect|network/i.test(m)) return T("Meta API에 연결하지 못했어요. 인터넷을 확인하고 다시 해 주세요.", "Could not reach the Meta API. Check the connection and try again.");
  if (/ffmpeg|ffprobe|invalid data|moov/i.test(m)) return T("영상을 읽지 못했어요. 다른 형식(mp4)으로 다시 넣어 주세요.", "The video could not be read. Try an mp4 file.");
  return T("만들다가 멈췄어요. 다시 해 주세요.", "Making stopped. Please try again.");
}

/* ② 확인·고치기 */
// 검사기 문장(한국어)을 쉬운 말로. [모양, 한국어, 영어]
const FRIENDLY = [
  [/JSON 형식/, "모델 답을 읽지 못했어요. 처음 화면에서 영상을 다시 넣거나 '다시 만들기'를 눌러 주세요.", "The model's answer could not be read. Try making the cards again."],
  [/겹칩니다/, "앞 카드와 시간이 겹쳐요. '시간·물건 고치기'에서 시작이나 끝을 바꿔 주세요.", "Overlaps another card in time. Change the start or end under 'Edit time & object'."],
  [/문장이 비어/, "문장을 써 주세요.", "Write a sentence."],
  [/한국어 문장이 깁니다/, "문장이 길어요. 25자 안으로 줄여 주세요.", "The Korean sentence is too long. Keep it within 25 characters."],
  [/세요'로 끝나야/, "문장 끝을 '~세요'로 맞춰 주세요.", "End the Korean sentence with '~세요' (a polite instruction)."],
  [/동작이 둘/, "한 카드에는 동작 하나만 넣어요. 아래 '+ 여기에 카드 넣기'로 나눠 주세요.", "One action per card. Split it with '+ Add a card here' below."],
  [/대표 시각/, "고른 장면이 이 카드 시간 밖에 있어요. '다른 장면 고르기'로 다시 골라 주세요.", "The chosen photo is outside this card's time. Use 'Choose another frame'."],
  [/영상\(/, "시간이 영상 길이를 벗어났거나 끝이 시작보다 빨라요.", "The time is outside the video, or the end comes before the start."],
  [/영어 문장이 깁니다/, "영어 문장이 길어요.", "The English sentence is too long."],
  [/항목이 없습니다/, "빠진 내용이 있어요.", "Something is missing."],
  [/맞춤법/, m => `맞춤법: ${m.match(/\('(.+)' → '(.+)'\)/).slice(1).join(" → ")} 로 고쳐 주세요.`,
             m => `Korean spelling: change ${m.match(/\('(.+)' → '(.+)'\)/).slice(1).join(" → ")}.`],
];
function problemText(m, withStep) {
  const hit = FRIENDLY.find(([re]) => re.test(m));
  if (!hit) return m;
  const f = ui === "en" ? hit[2] : hit[1], txt = typeof f === "function" ? f(m) : f;
  const k = m.match(/^(\d+)(?:·(\d+))?단계/);
  return withStep && k ? `${T(`${k[2] ? k[1] + "·" + k[2] : k[1]}단계: `, `Step ${k[2] ? k[1] + "–" + k[2] : k[1]}: `)}${txt}` : txt;
}
function issues() {
  const per = {}, global = [], gaps = {};
  for (const m of S.data.problems || []) {
    const k = m.match(/^(\d+)(?:·(\d+))?단계/);
    const f = problemText(m);
    if (!k) { global.push(f); continue; }
    const i = +(k[2] || k[1]) - 1;
    (per[i] = per[i] || []).push(f);
  }
  for (const w of S.data.warnings || []) {
    const k = w.match(/^(\d+)·\d+단계 사이 (\d+)~(\d+)초/);
    if (k) gaps[+k[1] - 1] = [+k[2], +k[3]];
  }
  return { per, global, gaps };
}

}

function stripHtml(c, i) {
  const cur = c.frame_t ?? c.rep, step = Math.max(1, Math.ceil((c.end - c.start + 1) / 40));

  return `<div class="strip">${h}</div>`;
}
function between(i, gaps) {

    ${g ? `<span class="note">${T(`영상 ${fmt(g[0])}~${fmt(g[1])}, ${g[1] - g[0]}초에는 카드가 없어요`, `No card for ${fmt(g[0])}–${fmt(g[1])} (${g[1] - g[0]} s)`)}</span>` : ""}
    <button class="btn" onclick="addCard(${i})">${T("+ 여기에 카드 넣기", "+ Add a card here")}</button>

function autosize(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
async function toggle(which, n) {
  const s = S[which]; s.has(n) ? s.delete(n) : s.add(n);
  if (which === "strip" && s.has(n) && S.data.stage === "compact" && !S.framesOk) {  // 정리된 묶음은 1초 사진을 사본에서 다시 뽑는다
    S.busy.set(n, T("장면을 준비하는 중…", "Preparing frames…")); edit();

/* 고친 내용은 저절로 저장하고, 저장할 때마다 서버가 규칙 검사를 다시 한다 */
function setSave(s) { S.saveState = s; const el = $("#saved"); if (el) el.textContent = saveText(); }
function scheduleSave(ms = 700) { clearTimeout(S.saveTimer); setSave("dirty"); S.saveTimer = setTimeout(saveNow, ms); }
function saveNow() {
  clearTimeout(S.saveTimer);
  const cards = JSON.parse(JSON.stringify(S.data.cards)), title = S.data.title ?? "";
  S.saving = S.saving.then(async () => {
    setSave("saving");
    const r = await fetch(`/api/runs/${S.run}/cards`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cards, title }) });
    if (r.status === 401) return setSave("readonly");
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    Object.assign(S.data, { problems: d.problems, warnings: d.warnings, status: d.status });
    setSave("saved");
    if (S.view === "edit") updateIssues();
  }).catch(() => setSave("error"));
  return S.saving;
}
// 교사 부탁 → 고칠 안(바뀌는 문장만) → '적용'을 눌러야 바뀐다(되돌리기 가능)
async function askAgent(e) {
  e.preventDefault();
  const q = $("#askin").value.trim(), box = $("#askres");
  if (!q) return;
  await saveNow();
  box.innerHTML = `<div class="askbox muted">${T("Muse Spark가 고치고, 검사기로 확인하는 중…", "Muse Spark is revising and running the checker…")}</div>`;
  let d = null;
  try { const r = await fetch(`/api/runs/${S.run}/agent`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ instruction: q }) }); if (r.ok) d = await r.json(); } catch {}
  if (!d) { box.innerHTML = ""; return toast(T("답을 받지 못했어요. 다시 해 주세요.", "No answer. Please try again.")); }
  S.ask = d;
  box.innerHTML = `<div class="askbox"><b>${esc(d.note || T("고칠 안", "Proposed changes"))}</b>
    <span class="muted">${T(`바뀌는 카드 ${d.changes.length}장 · 검사 ${d.checks}번 · $${d.cost}`, `${d.changes.length} cards change · checker run ${d.checks}× · $${d.cost}`)}</span>
    ${d.changes.map(c => `<div class="askrow"><span class="n">${S.data.cards.findIndex(x => x.n === c.n) + 1}</span><div><s>${esc(c.ko_before)}</s><br><b>${esc(c.ko)}</b><span class="muted"> · ${esc(c.en)}</span></div></div>`).join("")}
    ${d.problems.length ? `<div class="issue">${T("적용하면 검사에 걸리는 곳이 있어요:", "Applying this leaves issues:")} ${esc(d.problems.map(m => problemText(m, true)).join(" / "))}</div>` : ""}
    <div class="askbtns">${d.changes.length ? `<button class="btn primary" onclick="applyAgent()">${T("적용", "Apply")}</button>` : ""}<button class="btn" onclick="$('#askres').innerHTML=''">${T("닫기", "Close")}</button></div></div>`;
}
function applyAgent() {
  const before = snapshot(), by = Object.fromEntries(S.ask.changes.map(c => [c.n, c]));
  S.data.cards.forEach(c => { if (by[c.n]) { c.ko = by[c.n].ko; c.en = by[c.n].en; } });
  $("#askres").innerHTML = ""; changed();
  undoable(T(`카드 ${S.ask.changes.length}장의 문장을 바꿨어요.`, `Changed ${S.ask.changes.length} cards.`), before);
}
function jumpHtml(per) {
  return S.data.cards.map((_, i) => `<button class="${per[i]?.length ? "bad" : ""}" onclick="document.getElementById('row${i}').scrollIntoView({behavior:'smooth',block:'center'})">${i + 1}</button>`).join("");
}
function updateIssues() {
  const { per, global, gaps } = issues();
  const j = $("#jump"); if (j) j.innerHTML = jumpHtml(per);
  $("#chip").innerHTML = chipHtml(Object.keys(per).length + global.length);
  $("#global").innerHTML = global.map(g => `<div class="issue">${esc(g)}</div>`).join("");
  S.data.cards.forEach((c, i) => {
    const iss = per[i] || [];
    $("#row" + i)?.classList.toggle("has-bad", iss.length > 0);
    const box = $("#iss" + i); if (box) box.innerHTML = iss.map(x => `<div class="issue">${esc(x)}</div>`).join("");
    const bar = $("#gap" + i); if (bar) bar.outerHTML = between(i, gaps);
  });
  header();
}
window.addEventListener("beforeunload", e => { if (!["saved", "readonly"].includes(S.saveState)) e.preventDefault(); });

function changed() { edit(); saveNow(); }
function typed(i, k, el) { S.data.cards[i][k] = el.value; autosize(el); scheduleSave(); }
function snapshot() { return JSON.parse(JSON.stringify(S.data.cards)); }
function undoable(msg, before) {
  S.undo = before; if (S.view === "edit") edit();
  toast(msg, T("되돌리기", "Undo"), undoLast);
}
function undoLast() { if (!S.undo) return; S.data.cards = S.undo; S.undo = null; document.querySelector(".toast")?.remove(); changed(); }
function move(i, d) { const before = snapshot(), cs = S.data.cards; [cs[i], cs[i + d]] = [cs[i + d], cs[i]]; changed(); undoable(T("순서를 바꿨어요.", "Order changed."), before); }
function del(i) { const before = snapshot(); S.data.cards.splice(i, 1); changed(); undoable(T("카드를 뺐어요.", "Card removed."), before); }
function merge(i) {
  const before = snapshot(), cs = S.data.cards, a = cs[i], b = cs[i + 1];
  a.start = Math.min(a.start, b.start); a.end = Math.max(a.end, b.end);
  if (!a.ko.trim()) a.ko = b.ko;
  cs.splice(i + 1, 1); changed(); undoable(T("두 카드를 하나로 합쳤어요.", "Cards merged."), before);
}
function setTime(i, k, v) {
  const c = S.data.cards[i];

async function reframe(i, t) {
  const c = S.data.cards[i];
  S.busy.set(c.n, T("장면을 바꾸는 중…", "Changing the frame…")); edit();
  await saveNow();
  const r = await fetch(`/api/runs/${S.run}/cards/${c.n}/frame?t=${t}`, { method: "POST" });
  S.busy.delete(c.n);
  if (r.ok) {
    const f = await r.json();
    Object.assign(c, { frame_t: f.frame_t, rep: f.rep, box: f.box, box_prompt: f.box_prompt, box_touches_hand: f.box_touches_hand, ill: f.ill, view: f.view, v: Date.now() });

async function illustrateCard(i, quiet) {

async function illustrateMissing() {
  const todo = S.data.cards.map((c, i) => [c, i]).filter(([c]) => !c.ill && !S.busy.has(c.n)).map(([, i]) => i);
  let done = 0, fail = 0;
  const worker = async () => { while (todo.length) { const i = todo.shift(); (await illustrateCard(i, true)) ? done++ : fail++; } };
  await Promise.all([worker(), worker(), worker()]);  // 3장씩 동시에
  await saveNow();
  toast(T(`그림 ${done}장을 만들었어요${fail ? ` (${fail}장 실패)` : ""}.`, `Made ${done} drawings${fail ? ` (${fail} failed)` : ""}.`));
}

async function addCard(i) {
  const cs = S.data.cards, prev = cs[i], next = cs[i + 1], dur = S.data.duration || Infinity;
  const start = prev.end + 1;
  const end = Math.max(start, next ? next.start - 1 : Math.min(dur - 1, start + 3));
  const n = Math.max(...cs.map(c => c.n)) + 1;
  cs.splice(i + 1, 0, { n, start, end, rep: start, ko: "", en: "", object: "", look: "", image: `cards/${pad(n)}.jpg`, box: null });
  S.strip.add(n);
  await reframe(i + 1, start + Math.floor((end - start) / 2));
  $(`#row${i + 1} textarea.say`)?.focus();
}

/* 카드를 이미지로: 휴대폰은 공유창(메신저·문자 등)으로 카드마다 한 장씩, 그 밖에는 모든 카드를 한 장에 모아 내려받기 */
function cardCanvas(c, n, img) {
  const W = 1080, IH = 608, cv = document.createElement("canvas"), g = cv.getContext("2d");
  const font = "-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
  const lines = [[lang === "en" ? c.en : c.ko, 64, 700, "#1c2b33"], ...(lang === "both" ? [[c.en, 40, 400, "#65788a"]] : [])];
  const wrap = (t, size, weight) => {  // 띄어쓰기 단위로 줄바꿈(한국어 낱말이 끊기지 않게)
    g.font = `${weight} ${size}px ${font}`; const out = [];
    for (const w of String(t || "").split(" ")) { const l = out.at(-1); if (l !== undefined && g.measureText(l + " " + w).width < W - 120) out[out.length - 1] = l + " " + w; else out.push(w); }
    return out;
  };
  const rows = lines.flatMap(([t, size, weight, color]) => wrap(t, size, weight).map(x => [x, size, weight, color]));
  cv.width = W; cv.height = IH + 80 + rows.reduce((h, [, size]) => h + size * 1.3, 0) + 50;
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, cv.height);
  const r = Math.max(W / img.naturalWidth, IH / img.naturalHeight);  // 16:9 칸을 가득(가운데 기준)
  g.drawImage(img, (W - img.naturalWidth * r) / 2, (IH - img.naturalHeight * r) / 2, img.naturalWidth * r, img.naturalHeight * r);
  g.fillStyle = "#1c2b33"; g.beginPath(); g.arc(70, 70, 42, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.font = `700 40px ${font}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(n, 70, 72);
  g.textAlign = "left"; g.textBaseline = "alphabetic"; let y = IH + 80;
  for (const [t, size, weight, color] of rows) { g.font = `${weight} ${size}px ${font}`; g.fillStyle = color; g.fillText(t, 60, y + size * 0.9); y += size * 1.3; }
  return cv;
}
async function shareLink(to) {  // QR을 찍을 수 없는 같은 기기(휴대폰)에서는 링크로
  const url = to === "glasses" ? `${location.origin}/glasses?run=${S.run}&lang=${lang}` : `${location.origin}/?ui=${ui}#run=${S.run}&view=tablet`;
  try { if (navigator.share) return await navigator.share({ url, title: S.data.title || "StepCards" }); } catch (e) { if (e?.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast(T("링크를 복사했어요.", "Link copied.")); } catch { toast(url); }
}
async function shareCards(btn) {
  btn.disabled = true;
  try {
    const cs = S.data.cards, name = (S.data.title || "StepCards").replace(/[\\/:*?"<>|]/g, "");
    const imgs = await Promise.all(cs.map(c => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = imgSrc(c); })));
    const cvs = cs.map((c, i) => cardCanvas(c, i + 1, imgs[i]));
    const blob = cv => new Promise(r => cv.toBlob(r, "image/jpeg", 0.88));
    const files = await Promise.all(cvs.map(async (cv, i) => new File([await blob(cv)], `${name}_${pad(i + 1)}.jpg`, { type: "image/jpeg" })));
    if (navigator.canShare?.({ files })) {
      try { return await navigator.share({ files, title: name }); }
      catch (e) { if (e?.name === "AbortError") return; }  // 공유창이 안 열리면(권한 등) 아래 내려받기로
    }
    const cols = 3, w = cvs[0].width, h = Math.max(...cvs.map(cv => cv.height)), gap = 40, all = document.createElement("canvas");
    all.width = cols * w + (cols + 1) * gap; all.height = Math.ceil(cvs.length / cols) * (h + gap) + gap;
    const g = all.getContext("2d"); g.fillStyle = "#f1f4f7"; g.fillRect(0, 0, all.width, all.height);
    cvs.forEach((cv, i) => g.drawImage(cv, gap + (i % cols) * (w + gap), gap + Math.floor(i / cols) * (h + gap)));
    const a = document.createElement("a"); a.href = URL.createObjectURL(await blob(all)); a.download = `${name}.jpg`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (e) { if (e?.name !== "AbortError") toast(T("이미지를 만들지 못했어요.", "Could not make the images.")); }
  finally { btn.disabled = false; }
}

      <div class="d" id="chelpd"></div>
      <button class="navb next" onclick="coachCamera()">${T("카메라 켜기", "Turn on camera")}</button>
      <label class="linkbtn" style="cursor:pointer">${T("영상 파일로 시험하기", "Try with a video file")}<input type="file" accept="video/*" hidden onchange="coachFile(this.files[0])"></label>
    </div>
  </div>`;
  C.started = false; C.shown = -1; C.max = {}; C.manual = false; C.againSaid = -1; setVoice(C.voice); setHelp(C.help);
  coachCard();
  clearInterval(C.sync);
  C.sync = setInterval(async () => {
    if (S.view !== "coach") return clearInterval(C.sync);
    const d = await fetch(`/api/runs/${S.run}/now?s=${C.pair}`).then(r => r.json()).catch(() => null);
    if (d && d.by === "glasses" && d.v > (C.v || 0) && d.fin) { C.v = d.v; coachEnd(true); }  // 안경에서 '다 했어요'
    else if (d && d.by === "glasses" && d.v > (C.v || 0) && d.i !== S.idx) { C.v = d.v; S.idx = d.i; C.buf = []; C.prev = 0; $("#cagain").hidden = true; coachCard(); }
    else if (d && d.by === "glasses" && d.v > (C.v || 0) && C.help && d.lv > C.lv) { C.v = d.v; helpUp(); }  // 안경에서 '도움'을 눌렀다
  }, 1000);
  C.local = false;
  fetch("/api/local").then(r => r.json()).then(d => { if (d.ready && $("#cwhere")) { $("#cwhere").hidden = false; coachWhere(false); } }).catch(() => {});
}
function coachWhere(local) {
  C.local = local;
  $("#cwhere").querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === +local));
  $("#cwhered").hidden = false;
  $("#cwhered").innerHTML = local
    ? T("공개 가중치 모델이 이 맥에서 판단해요. 카메라 사진이 맥 밖으로 나가지 않아요. 물건 확인(SAM)은 건너뛰어요.", "An open-weight model decides on this Mac. Camera frames never leave it. The object check (SAM) is skipped.")
    : T("Muse Spark가 단계를 보고, SAM 3.1이 손에 든 물건을 한 번 더 확인해요.", "Muse Spark reads the step and SAM 3.1 double-checks the object in hand.");
}
// 카드 문장 소리로 읽기: 휴대폰 스피커나 블루투스로 이어진 안경 스피커로 나온다. 시작 단추를 누르기 전엔 읽지 않는다(브라우저가 막음)
C.voice = (() => { try { return localStorage.getItem("voice") !== "off"; } catch { return true; } })();
function setVoice(on) {
  C.voice = on; try { localStorage.setItem("voice", on ? "on" : "off"); } catch {}
  const b = $("#cvoice"); if (b) b.innerHTML = `${icon(on ? "sound" : "mute")}${on ? T("소리 켬", "Sound on") : T("소리 끔", "Sound off")}`;
  if (!on) speechSynthesis.cancel(); else if (C.started) speak(true);
}
function speak(force, again, only) {
  if (!window.speechSynthesis || !(C.voice || force) || !C.started) return;
  const c = S.data.cards[S.idx], parts = only ? [[only, ui === "en" ? "en-US" : "ko-KR"]] : [];
  if (again) parts.push([T("이 카드부터 해요.", "Start with this card."), ui === "en" ? "en-US" : "ko-KR"]);
  if (!only && lang !== "en") parts.push([c.ko, "ko-KR"]);
  if (!only && lang !== "ko") parts.push([c.en, "en-US"]);
  speechSynthesis.cancel();
  for (const [t, l] of parts) { const u = new SpeechSynthesisUtterance(t); u.lang = l; u.rate = 0.9; speechSynthesis.speak(u); }
}
function sayCard(c) {  // 태블릿: 문장을 누르면 읽어 준다(누를 때만)
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  for (const [t, l] of [[lang !== "en" && c.ko, "ko-KR"], [lang !== "ko" && c.en, "en-US"]]) if (t) { const u = new SpeechSynthesisUtterance(t); u.lang = l; u.rate = 0.9; speechSynthesis.speak(u); }
}
// 안경 화면(/glasses)에 지금 카드를 알린다
function glassesSync(again) {
  fetch(`/api/runs/${S.run}/now`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ i: S.idx, again: !!again, by: "coach", lv: C.help ? C.lv : 0, s: C.pair }) })
    .then(r => r.json()).then(d => { C.v = d.v; }).catch(() => {});
}
/* 필요할 때만 도움(촉구 위계): 1 글 → 2 그림·사진 → 3 소리 → 4 움직임.
   카드가 바뀌면 1부터, 10초 동안 넘어가지 않으면 한 칸 올린다. 학생·교사가 '도움'을 눌러도 올라간다.
   카드마다 몇 단계까지 갔는지는 화면에만 보여 주고 저장하지 않는다 */
C.help = (() => { try { return localStorage.getItem("help") === "on"; } catch { return false; } })();
const HELP_SEC = 10;  // 가장 짧은 기다림
const helpWait = c => Math.min(60, Math.max(HELP_SEC, 2 * (c.end - c.start)));  // 시범보다 두 배는 기다린다
const lvName = n => [T("글", "Text"), T("그림", "Picture"), T("소리", "Sound"), T("움직임", "Motion")][n - 1];
function setHelp(on) {
  C.help = on; try { localStorage.setItem("help", on ? "on" : "off"); } catch {}
  $("#chelpseg")?.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === +on));
  const d = $("#chelpd");
  if (d) d.innerHTML = on ? T("처음엔 글만 보여요. 시범 영상에서 그 단계가 걸린 시간의 두 배(10~60초) 동안 넘어가지 않으면 그림 → 소리 → 움직임 순으로 도움이 늘어요.", "Starts with text only. If a step takes more than twice as long as in the demonstration (10–60 s), help grows: picture → sound → motion.")
                     : T("카드의 글과 사진을 처음부터 다 보여 줘요.", "Shows the full card from the start.");
}
function helpMedia(c) {
  if (!C.help || C.lv >= 4) return media(C.help ? { ...c, view: "clip" } : c);
  if (C.lv < 2) return `<button class="helpbtn" onclick="helpUp()">${icon("plus")}${T("도움이 필요하면 눌러요", "Tap if you need help")}</button>`;
  return media(c.view === "clip" ? { ...c, view: c.ill ? "ill" : "photo" } : c);
}
function helpUp() {
  if (C.lv >= 4) return;
  C.lv += C.lv === 2 && !C.voice ? 2 : 1;  // 교사가 소리를 꺼 두었으면 소리 단계는 건너뛴다
  C.since = Date.now(); coachCard();
}
function coachExit() {
  if ($("#csum") || !(C.help && Object.keys(C.max || {}).length)) return go({ run: S.run, view: "use" });
  coachEnd(false);
}
// 끝 화면: 칭찬·점수 없이 '다 했어요'만. 도움 모드였으면 카드마다 몇 단계까지 갔는지(저장 안 함)
function coachEnd(finished) {
  if ($("#csum")) return;
  const rec = Object.entries(C.max || {});
  const by = [1, 2, 3, 4].map(l => rec.filter(([, m]) => m === l).map(([i]) => +i + 1));
  if (finished) fetch(`/api/runs/${S.run}/now`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ i: S.idx, by: "coach", fin: true, s: C.pair }) }).catch(() => {});
  if (finished) speak(false, false, T("다 했어요.", "All steps done."));
  $(".coachv").insertAdjacentHTML("beforeend", `<div class="cstart" id="csum"><div class="glyph">${icon("check")}</div><div class="t">${finished ? T("다 했어요", "All steps done") : T("오늘 따라 하기", "Today's run")}</div>
    ${C.help && rec.length ? `<div class="sumgrid">${by.map((ns, j) => `<div><b>${j ? T(`${lvName(j + 1)}까지`, `Up to ${lvName(j + 1).toLowerCase()}`) : T("글만 보고", "Text only")}</b><span>${ns.length ? T(`카드 ${ns.join(", ")}`, `Cards ${ns.join(", ")}`) : "–"}</span></div>`).join("")}</div>
    <div class="d">${T("이 기록은 저장하지 않아요. 필요하면 지금 적어 두세요.", "This is not saved. Write it down now if you need it.")}</div>` : ""}
    <button class="navb next" onclick="go({run:S.run,view:'use'})">${T("나가기", "Exit")}</button></div>`);
  stopCoach();
}
function coachCard() {
  const cs = S.data.cards, c = cs[S.idx];
  if (C.shown !== S.idx) { C.shown = S.idx; C.lv = 1; C.since = Date.now(); C.lastMove = Date.now(); }
  if (C.started && C.help) C.max[S.idx] = Math.max(C.max[S.idx] || 0, C.lv);
  glassesSync(false);
  if (!C.help || C.lv >= 3) speak();
  $("#cwrap").innerHTML = helpMedia(c);
  $("#clv").hidden = !C.help;
  $("#clv").innerHTML = `${[1, 2, 3, 4].map(l => `<i class="${l <= C.lv ? "on" : ""}"></i>`).join("")}<span>${T("도움", "Help")}: ${lvName(C.lv)}</span>${C.lv < 4 ? `<button onclick="helpUp()">${T("더 보기", "More")}</button>` : ""}`;
  $("#ctxt").innerHTML = text(c);
  $("#cmid").innerHTML = `${dotsHtml(cs.length, S.idx)}${S.idx + 1} / ${cs.length}`;
  $("#cprev").disabled = !S.idx;
  const last = S.idx === cs.length - 1;
  $("#cnext").innerHTML = last ? T("다 했어요 ✓", "Done ✓") : T("다음 ▶", "Next ▶");
  $("#cnext").onclick = last ? () => coachEnd(true) : () => coachFlip(1);
}
function coachFlip(d) { S.idx = Math.max(0, Math.min(S.data.cards.length - 1, S.idx + d)); C.buf = []; C.prev = 0; $("#cagain").hidden = true; coachCard(); }
function watching(d) {  // 학생 화면에는 '지켜보는 중'만. 판단 시간은 교사용으로 마우스를 올리면 보인다
  pill(T(`지켜보는 중${C.local ? " · 이 맥" : ""}`, `Watching${C.local ? " · this Mac" : ""}`));
  const el = $("#cpill"); if (el) el.title = `${d.latency} s`;
}
function pill(t) { const el = $("#cpill"); if (el) el.textContent = t; }
async function coachCamera() {
  try {
    C.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 1280 }, audio: false });
    $("#cvid").srcObject = C.stream; await $("#cvid").play(); coachStart();
  } catch { pill(T("카메라를 켤 수 없어요", "Camera unavailable")); toast(T("카메라 사용을 허락해 주세요.", "Please allow camera access.")); }
}
function coachFile(f) {
  if (!f) return;
  const v = $("#cvid"); v.src = URL.createObjectURL(f); v.play(); coachStart();
  v.onended = () => { C.running = false; pill(T("영상이 끝났어요", "Video ended")); };
}
function coachStart() {
  $("#cstart").hidden = true; C.buf = []; C.running = true; pill(T("지켜보는 중", "Watching"));
  C.started = true; C.since = Date.now(); coachCard();
  clearInterval(C.helpTimer);
  C.helpTimer = setInterval(() => {
    if (C.help && C.running && C.lv < 4 && Date.now() - C.since > helpWait(S.data.cards[S.idx]) * 1000) helpUp();
    if (C.running && Date.now() - C.lastMove > IDLE_MIN * 60000) coachPause();  // 켜 둔 채 잊어도 비용이 계속 나가지 않게
  }, 1000);
  C.lastMove = Date.now();
  navigator.wakeLock?.request("screen").then(l => { C.lock = l; }).catch(() => {});  // 휴대폰 화면이 꺼지지 않게
  const v = $("#cvid"), cv = document.createElement("canvas");
  C.timer = setInterval(() => {  // 1초에 한 장, 최근 4장만 둔다
    if (v.readyState < 2) return;
    cv.width = 480; cv.height = Math.round(480 * v.videoHeight / v.videoWidth);
    cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
    C.buf.push(cv.toDataURL("image/jpeg", 0.7)); if (C.buf.length > 4) C.buf.shift();
  }, 1000);
  coachLoop();
}
async function coachLoop() {
  while (C.running && S.view === "coach") {
    const cs = S.data.cards, cur = S.idx + 1;
    if (!C.manual && C.buf.length >= 2 && cur <= cs.length) {
      let d = null;  // 네트워크 오류도 '판단 못 함'으로 보고 계속 본다
      try { const r = await fetch(`/api/runs/${S.run}/coach`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cur, frames: C.buf.slice(), prev_seen: C.prev, local: C.local }) }); if (r.ok) d = await r.json();
        if (r.status === 401 || r.status === 429) { C.manual = true; pill(T("자동 넘김은 접속 키가 필요해요 · 이전·다음으로 넘겨요", "Auto-advance needs the access key · use Back and Next")); continue; } } catch { d = null; }
      if (!C.running || S.idx + 1 !== cur) continue;  // 그 사이 사람이 직접 넘겼으면 결과는 버린다
      if (!d) { pill(T("판단하지 못했어요 · 다시 보는 중", "No answer · watching again")); }
      else {
        C.prev = d.seen;
        C.fin = d.decision === "finished" ? (C.fin || 0) + 1 : 0;
        if (C.fin >= 2) { coachEnd(true); break; }  // 마지막 단계를 마쳤다는 판단이 두 번 연속
        const to = d.decision === "next" ? cur + 1 : d.decision === "jump" ? d.target : 0;
        if (Number.isInteger(to) && to >= 1 && to <= cs.length) {  // 없는 카드 번호는 무시
          S.idx = to - 1;
          C.buf = []; C.prev = 0; $("#cagain").hidden = true; coachCard(); pill(T(`${S.idx + 1}번 카드로 넘겼어요`, `Moved to card ${S.idx + 1}`));
        }
        else if (d.decision === "again") {
          $("#cagain").hidden = false; glassesSync(true); if (C.againSaid !== S.idx) { C.againSaid = S.idx; speak(false, true); } C.buf = []; clearTimeout(C.againTimer); C.againTimer = setTimeout(() => { const a = $("#cagain"); if (a) a.hidden = true; }, 4000);
          watching(d);
        } else watching(d);
      }
    }
    await new Promise(r => setTimeout(r, 1500));
  }
}
const IDLE_MIN = 5;
function coachPause() {  // 카메라와 판단만 멈춘다(카드·안경 맞추기는 그대로). '다시 시작'으로 이어서
  C.running = false; clearInterval(C.timer); clearInterval(C.helpTimer);
  C.stream?.getTracks().forEach(t => t.stop()); C.stream = null; C.lock?.release().catch(() => {}); C.lock = null;
  $(".coachv")?.insertAdjacentHTML("beforeend", `<div class="cstart" id="cpause"><div class="glyph">${icon("glasses")}</div>
    <div class="t">${T("잠시 멈췄어요", "Paused")}</div>
    <div class="d">${T(`${IDLE_MIN}분 동안 다음 카드로 넘어가지 않아서 카메라를 껐어요. 카메라가 꺼진 동안은 비용이 들지 않아요.`, `No step change for ${IDLE_MIN} minutes, so the camera is off and nothing is being spent.`)}</div>
    <button class="navb next" onclick="document.getElementById('cpause').remove();coachCamera()">${T("다시 시작", "Resume")}</button></div>`);
  pill(T("멈춤", "Paused"));
}
function stopCoach() {
  C.running = false; clearInterval(C.timer); clearInterval(C.sync); clearInterval(C.helpTimer); C.started = false;
  window.speechSynthesis?.cancel(); C.lock?.release().catch(() => {}); C.lock = null; clearTimeout(C.againTimer);
  C.stream?.getTracks().forEach(t => t.stop()); C.stream = null;
}

function dotsHtml(n, idx) {  // 카드가 많으면 점이 넘쳐서 숫자만
  return n > 15 ? "" : `<div class="dots">${Array.from({ length: n }, (_, j) => `<i class="${j === idx ? "on" : ""}"></i>`).join("")}</div>`;
}
function flip(d) { S.idx = Math.max(0, Math.min(S.data.cards.length - 1, S.idx + d)); tablet(); }
document.addEventListener("keydown", e => {
  if (S.view === "coach") { if (e.key === "ArrowRight") coachFlip(1); if (e.key === "ArrowLeft") coachFlip(-1); if (e.key === "Escape") go({ run: S.run, view: "use" }); return; }
  if (S.view !== "tablet") return;
  if (e.key === "ArrowRight" || e.key === " ") flip(1);
  if (e.key === "ArrowLeft") flip(-1);
  if (e.key === "Escape") go({ run: S.run, view: "use" });
});
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; });
document.addEventListener("touchend", e => {
  if (S.view === "tablet" && touchX !== null) { const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 60) flip(dx < 0 ? 1 : -1); }
  touchX = null;
});

route();
</script>
</body>
</html>
