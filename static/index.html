<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>StepCards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230064e0'/%3E%3Cpath d='m7 12.5 3 3 7-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    /* 로직크래프트 색(logiccraft.co.kr global.css): 남색 글자, 브랜드 파랑, 흙색 강조, 종이색 바탕 */
    --bg:#f7f6f2; --paper:#fff; --raised:#f1efe8; --ink:#11183a; --ink2:#34406b; --muted:#5f6888; --line:#e7e6df; --line2:#d9d8cf; --field:#7d849c;
    --accent:#2f63f4; --accent-h:#1f49c4; --accent-soft:#eef2ff; --accent-ink:#1f49c4; --clay:#cf8350; --clay-soft:#f3e6da; --clay-ink:#8f5226;
    --bad:#c4122f; --bad-soft:#fdecef; --ok:#0a7a35; --ok-soft:#e6f4eb; --warn:#8a5600; --warn-soft:#fff3d9;
    --dark:#0b1015; --dark2:#1a222a; --dark3:#2a343e;
    --r-s:10px; --r:16px; --r-l:24px;
    --sh-1:0 1px 2px rgba(17,24,58,.06), 0 1px 3px rgba(17,24,58,.05);
    --sh-2:0 4px 12px rgba(17,24,58,.08), 0 1px 3px rgba(17,24,58,.06);
    --sh-3:0 12px 32px rgba(17,24,58,.14);
    --focus:0 0 0 3px rgba(47,99,244,.35);
    --hh:64px;
  }
  * { box-sizing:border-box; }
  body { overflow-wrap:break-word; }  /* 긴 영어 단어·주소가 칸을 뚫지 않게 */
  body { margin:0; font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); word-break:keep-all; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.005em; }
  button { font:inherit; cursor:pointer; color:inherit; }
  :focus-visible { outline:none; box-shadow:var(--focus); }
  a { color:var(--accent); text-decoration:none; font-weight:600; } a:hover { text-decoration:underline; }
  .ico { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-4px; }

  /* 위쪽 막대 */
  header { display:flex; align-items:center; gap:20px; padding:0 24px; height:var(--hh); background:rgba(255,255,255,.92); backdrop-filter:saturate(1.8) blur(16px);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; cursor:pointer; letter-spacing:-.02em; flex:none; }
  .logo .mark { width:32px; height:32px; border-radius:9px; background:var(--accent); display:grid; place-items:center; }
  .logo .mark svg { width:20px; height:20px; }
  .steps { display:flex; align-items:center; gap:2px; margin:0 auto; background:var(--bg); padding:4px; border-radius:999px; }
  #uiseg .short, .step .short { display:none; } #uiseg .long, #uiseg .short { pointer-events:none; }
  @media (max-width:720px) { body.home #steps { display:none; } }
  @media (max-width:720px) { #uiseg .short, .step .short { display:inline; } .step .long { display:none; } #uiseg button, .step { min-width:44px; min-height:44px; } }
  .f3speed, .fh-rec input[type=checkbox] { min-height:44px; } .tab .exit, #chelpseg button { min-height:44px; } .livetoggle input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); } .fh-rec input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); }
  .step { display:flex; align-items:center; gap:8px; padding:7px 14px 7px 8px; border-radius:999px; border:none; background:none; color:var(--muted); font-size:14px; font-weight:600; transition:background .15s, color .15s; }
  .step .dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--ink2); font-size:12px; font-weight:700; }
  .step:hover:not(:disabled):not(.on) { color:var(--ink); }
  .step.on { background:var(--paper); color:var(--ink); box-shadow:var(--sh-1); } .step.on .dot { background:var(--accent); color:#fff; }
  .step.done .dot { background:var(--ok); color:#fff; }
  .step:disabled { opacity:.45; cursor:default; }
  .arrow { display:none; }
  main { max-width:1120px; margin:0 auto; padding:32px 24px 64px; }
  h2 { margin:0 0 6px; font-size:28px; line-height:1.25; font-weight:700; letter-spacing:-.025em; } h3 { margin:40px 0 14px; font-size:18px; font-weight:700; letter-spacing:-.015em; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:16px; max-width:680px; }
  .muted { color:var(--muted); font-size:14px; } .red { color:var(--bad); font-weight:600; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2); background:var(--paper); padding:8px 16px; border-radius:999px; font-size:14px; font-weight:600; color:var(--ink); transition:background .15s, border-color .15s; }
  .btn:hover:not(:disabled) { background:var(--raised); border-color:var(--muted); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover:not(:disabled) { background:var(--accent-h); border-color:var(--accent-h); }
  .btn.big { padding:14px 26px; font-size:16px; }
  .btn:disabled { opacity:.4; cursor:default; }
  .issue { display:flex; gap:8px; align-items:flex-start; padding:10px 14px; border-radius:var(--r-s); background:var(--bad-soft); color:var(--bad); font-size:14px; font-weight:500; margin:8px 0; }
  .issue::before { content:"!"; flex:none; width:18px; height:18px; border-radius:50%; background:var(--bad); color:#fff; font-size:12px; font-weight:800; display:grid; place-items:center; margin-top:1px; }

  /* 처음 화면 */
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--line2); border-radius:var(--r-l); background:var(--paper); padding:48px 24px; text-align:center; cursor:pointer; transition:.15s; box-shadow:var(--sh-1); min-height:280px; }
  .drop:hover, .drop.over { border-color:var(--accent); background:var(--accent-soft); }
  .drop .big { font-size:18px; font-weight:700; }
  .drop .plus { width:64px; height:64px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; margin-bottom:8px; box-shadow:0 6px 16px rgba(47,99,244,.3); }
  .drop .plus svg { width:28px; height:28px; stroke-width:2.2; }
  .drop .btn { margin-top:10px; pointer-events:none; }
  .drop .makewhere { margin-top:6px; } .drop #mkwhered { max-width:360px; font-size:13px; }
  /* 첫 화면: 큰 영상 한 장면과 한 문장씩 이어지는 이야기형(넓은 여백, 굵기 500의 큰 제목, 파란 알약 단추) */
  body.homepage { background:#fff; } body.homepage .drop { border-color:var(--line2); }
  .full { width:100vw; margin-left:calc(50% - 50vw); }
  html, body { overflow-x:clip; }  /* 100vw 가 세로 스크롤바 폭만큼 넘쳐 옆으로 밀리지 않게(clip 은 sticky 를 깨지 않는다) */
  .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .center { text-align:center; margin-left:auto; margin-right:auto; }
  h2.sect { font-size:28px; font-weight:700; letter-spacing:-.01em; margin:72px 0 20px; text-align:left; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border-radius:100px; padding:12px 22px; font-size:16px; font-weight:700; }
  .pill:hover { background:var(--accent-h); text-decoration:none; } .pill.ghost { background:rgba(255,255,255,.16); backdrop-filter:blur(8px); } .pill.ghost:hover { background:rgba(255,255,255,.26); }
  .mhero { position:relative; height:min(78vh,720px); min-height:520px; margin-top:-32px; display:grid; align-items:center; overflow:hidden; background:var(--ink); padding:0 max(24px, calc((100vw - 1120px) / 2)) 96px; }
  .mbg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(1.05); }
  .mshade { position:absolute; inset:0; background:linear-gradient(90deg, rgba(17,24,58,.94) 0%, rgba(17,24,58,.78) 42%, rgba(17,24,58,.35) 100%); }
  .mcopy { position:relative; text-align:left; color:#fff; max-width:600px; display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  .mcopy h2 { font-size:clamp(36px,5vw,64px); font-weight:700; line-height:1.05; letter-spacing:-.025em; margin:14px 0 16px; }
  .mcopy p { font-size:18px; opacity:.9; margin:0 0 28px; max-width:520px; } .mbtns { display:flex; gap:12px; justify-content:flex-start; flex-wrap:wrap; }
  .mstrip { position:absolute; left:max(24px, calc((100vw - 1120px) / 2)); right:max(24px, calc((100vw - 1120px) / 2)); bottom:0; display:flex; align-items:center; gap:20px; flex-wrap:wrap; padding:22px 0 26px; border-top:1px solid rgba(255,255,255,.16); color:#fff; font-size:15px; }
  .mstrip .mlabel { opacity:.8; } .msteps { display:flex; align-items:center; gap:10px; font-weight:600; }
  .msteps span { display:inline-flex; align-items:center; gap:8px; } .msteps i { width:32px; height:32px; border-radius:50%; background:#fff; color:var(--ink); display:grid; place-items:center; }
  .msteps i .ico { width:18px; height:18px; } .mline { width:22px; height:1px; background:rgba(255,255,255,.4); }
  @media (max-width:860px) { .mstrip { position:relative; left:auto; right:auto; grid-row:2; padding-top:18px; } .mline { display:none; } .mhero { padding-bottom:24px; height:auto; min-height:0; padding-top:72px; } }
  .mpause { position:absolute; right:24px; top:24px; width:52px; height:52px; border-radius:50%; border:2px solid rgba(255,255,255,.6); background:rgba(11,16,21,.35); color:#fff; font-size:14px; }
  .mstory { padding:96px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .mstory.dark { background:#000; color:#fff; } .mstory h2 { font-size:clamp(30px,4vw,48px); font-weight:500; letter-spacing:-.02em; margin:0; }
  .mstory p { max-width:620px; margin:0; font-size:17px; color:var(--muted); } .mstory.dark p { color:#a9b8c6; }
  .mframe { width:min(720px,100%); border-radius:28px; overflow:hidden; position:relative; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .mframe video { width:100%; display:block; }
  .ladder { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:6px; background:rgba(11,16,21,.6); backdrop-filter:blur(10px); padding:6px; border-radius:999px; }
  .ladder span { padding:6px 14px; border-radius:999px; font-size:14px; font-weight:700; color:#a9b8c6; animation:lad 8s infinite; animation-delay:calc(var(--i) * 2s); }
  @keyframes lad { 0%, 24% { background:var(--accent); color:#fff; } 25%, 100% { background:transparent; color:#a9b8c6; } }
  @media (prefers-reduced-motion: reduce) { .ladder span { animation:none; } *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
  .mpair { display:grid; grid-template-columns:1fr 1fr; gap:16px; width:min(820px,100%); } .mpair figure { margin:0; position:relative; }
  .mpair img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:24px; box-shadow:var(--sh-2); } .mpair figcaption { margin-top:8px; color:var(--muted); font-size:14px; }
  .okbadge { position:absolute; top:14px; right:14px; display:inline-flex; align-items:center; gap:6px; background:var(--ok); color:#fff; padding:8px 14px; border-radius:999px; font-size:15px; }
  .okbadge .ico { width:18px; height:18px; }
  .mstart { padding:88px 0 8px; } .mstart h2 { font-size:clamp(30px,4vw,44px); font-weight:500; margin:0 0 10px; } .mstart .sub { margin-bottom:28px; }
  .mstart .drop { max-width:760px; margin:0 auto; } .mstart .trust { justify-content:center; margin-top:16px; }
  .news { display:grid; grid-template-columns:repeat(6,1fr); gap:28px 24px; } .newscard { grid-column:span 2; } .newscard:nth-child(4) { grid-column:2 / span 2; }
  .news.four { grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); } .news.four .newscard { grid-column:auto; }  /* 직무 견본 수가 바뀌어도 한 줄에 */
  @media (max-width:860px) { .news.four { grid-template-columns:1fr 1fr; } }
  .mpov .short { display:none; } @media (max-width:640px) { .mpov .long { display:none; } .mpov .short { display:inline; } }
  .mpov { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; background:rgba(0,0,0,.45); color:#fff; border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; } .mpov .ico { width:16px; height:16px; }
  .sect.first { margin-top:56px; }
  .jobsrc, .jobsrc.center { max-width:760px; margin:-8px 0 22px; font-size:14px; text-align:left; } h2.sect.center { text-align:left; }
  .newscard { color:var(--ink); font-weight:400; display:flex; flex-direction:column; gap:6px; background:var(--paper); border-radius:16px; overflow:hidden; box-shadow:var(--sh-1); padding-bottom:14px; } .newscard:hover { text-decoration:none; box-shadow:var(--sh-2); }
  .newscard > :not(img) { margin-left:14px; margin-right:14px; } .newscard strong { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.7em; font-weight:700 !important; font-size:17px !important; }
  .newscard .seemore { margin-top:auto; color:var(--accent); font-weight:700; } .newscard .seemore .ico { display:none; }
  .newscard img { width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:0; }
  .newscard .kicker { font-size:13px; color:var(--muted); font-weight:600; margin-top:6px; } .newscard strong { font-size:18px; font-weight:500; line-height:1.35; }
  .newscard .seemore { display:inline-flex; align-items:center; gap:8px; font-size:14px; } .newscard .seemore .ico { width:26px; height:26px; padding:5px; border:1px solid var(--line2); border-radius:50%; }
  @media (max-width:860px) { .news { grid-template-columns:1fr 1fr; } .newscard, .newscard:nth-child(4) { grid-column:auto; } }
  @media (max-width:560px) { .news, .mpair { grid-template-columns:1fr; } h2.sect { font-size:30px; margin-top:64px; } .mstory { padding:64px 16px; } }
  .trust { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:13px; color:var(--ink2); font-weight:600; }
  .trust span { display:inline-flex; align-items:center; gap:4px; } .trust .ico { width:15px; height:15px; color:var(--ok); }
  .uses { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .uses div { background:var(--paper); border-radius:var(--r); padding:16px; box-shadow:var(--sh-1); display:flex; flex-direction:column; gap:4px; }
 
  .uses .fi { width:36px; height:36px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin-bottom:6px; }
  .uses strong { font-size:15px; }
  .uses .exs { margin-top:auto; padding-top:10px; display:flex; flex-direction:column; gap:6px; } .uses .ex { font-size:13px; } .uses .muted { font-size:13px; }
  @media (max-width:1000px) { .uses { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) { .uses { grid-template-columns:1fr; } }
  .past { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .pastcard { background:var(--paper); border-radius:var(--r); overflow:hidden; color:inherit; font-weight:400; box-shadow:var(--sh-1); transition:box-shadow .15s, transform .15s; }
  @media print { .keyask { display:none !important; } }
  .keyask { position:fixed; inset:0; z-index:50; background:rgba(11,16,21,.55); display:grid; place-items:center; padding:16px; }
  .keyask form { background:var(--paper); color:var(--ink); border-radius:var(--r-l); padding:24px; width:min(380px,100%); display:grid; gap:10px; box-shadow:var(--sh-3); }
  .keyask input { font:inherit; padding:12px; border:1px solid var(--line2); border-radius:12px; } .keyask input:focus { outline:none; border-color:var(--accent); box-shadow:var(--focus); }
  .pastcard { position:relative; }
  @media screen { .printonly { display:none; } }
  .followhero { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:32px; align-items:center; background:#000; color:#fff; border-radius:28px; padding:28px; margin:4px 0 18px; }
  .fh-media { position:relative; border-radius:20px; overflow:hidden; aspect-ratio:4/3; background:#111; }
  .fh-media img { width:100%; height:100%; object-fit:cover; display:block; opacity:.92; }
  .fh-pov { position:absolute; top:12px; left:12px; display:inline-flex; align-items:center; gap:6px; background:rgba(11,16,21,.6); backdrop-filter:blur(8px); padding:6px 12px; border-radius:999px; font-size:13px; font-weight:700; }
  .fh-check { position:absolute; top:12px; right:12px; display:inline-flex; align-items:center; gap:6px; background:var(--ok); padding:6px 12px; border-radius:999px; font-size:14px; font-weight:700; }
  .fh-card { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(11,16,21,.72); backdrop-filter:blur(8px); padding:8px 16px; border-radius:14px; font-size:18px; font-weight:800; white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
  .fh-pov .ico, .fh-check .ico { width:16px; height:16px; }
  .sumline { font-size:20px; font-weight:700; color:#fff; }
  .safechip { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; background:var(--clay-soft); color:var(--clay-ink); border:1px solid #e8c9ad; border-radius:999px; padding:6px 12px; font-size:14px; font-weight:700; } .safechip .ico { width:16px; height:16px; }
  .fh-copy .kicker { color:#a9b8c6; font-size:14px; font-weight:600; } .fh-copy h2 { font-size:clamp(26px,3vw,36px); font-weight:500; line-height:1.25; margin:6px 0 14px; }
  .fh-steps { margin:0 0 20px; padding-left:20px; color:#cfd9e3; line-height:1.8; } .fh-btns { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .fh-btns .btn { background:rgba(255,255,255,.12); color:#fff; border-color:transparent; } .fh-btns .btn:hover { background:rgba(255,255,255,.2); }
  .pill.big { font-size:17px; padding:14px 24px; border:none; } .pill .ico { width:20px; height:20px; } .fh-note { color:#8d9bab !important; font-size:13px; margin:14px 0 0; }
  .followset { background:var(--paper); border-radius:var(--r); box-shadow:var(--sh-1); padding:4px 18px; margin:0 0 14px; } .followset summary { cursor:pointer; min-height:44px; display:flex; align-items:center; gap:6px; font-weight:600; } .followset .ico { width:18px; height:18px; color:var(--accent); }
  .fq { display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding:10px 0; border-top:1px solid var(--line); } .fq .muted { font-size:13px; }
  .ofold summary { list-style:none; display:inline-flex; } .ofold summary::-webkit-details-marker { display:none; } .ofold .fh-box { margin-top:8px; max-width:520px; }
  .fh-box { background:var(--paper); border-radius:var(--r); padding:16px 18px; box-shadow:var(--sh-1); display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .fh-box strong { display:inline-flex; align-items:center; gap:6px; } .fh-box .ico { width:18px; height:18px; color:var(--accent); } .fh-box .muted { font-size:13px; }
  .fh-qr { display:flex; align-items:center; gap:12px; } .fh-qr .btn { white-space:nowrap; } .fh-qr img { border-radius:8px; } .fh-rec { display:flex; align-items:center; gap:6px; font-weight:600; } .fh-rec input { width:18px; height:18px; accent-color:var(--accent); }
  #records { width:100%; }
  .others { padding:18px 0; border-top:1px solid var(--line); } .others h3 { font-size:15px; margin:0 0 10px; color:var(--muted, #6b7785); font-weight:600; }
  .ogrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; } .ogroup { display:flex; flex-direction:column; align-items:stretch; gap:6px; background:var(--paper); border-radius:var(--r); padding:14px; box-shadow:var(--sh-1); }

<body>
<header>
  <span class="logo" onclick="go({})"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="13" height="15" rx="2.5"/><path d="M4 7v11a3 3 0 0 0 3 3h9"/><path d="m10.5 10.5 2 2 4-4"/></svg></span><span>StepCards</span></span>
  <nav class="steps" id="steps"></nav>
  <span style="flex:1"></span>
  <span class="seg" id="uiseg"></span>
</header>
<main id="main"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
// 보기는 누구나. 돈이 들거나 카드를 바꾸는 요청이 401(접속 키 필요)이면 키를 한 번 묻고 같은 요청을 다시 보낸다
const rawFetch = window.fetch.bind(window);
let keyAsk = null;
window.fetch = async (u, o = {}) => {
  const r = await rawFetch(u, o);
  if (r.status === 402) toast(T("크레딧 상한에 닿아 지금은 AI 기능을 쓸 수 없어요. 보기와 손으로 넘기기는 계속 돼요.", "The credit cap is reached, so AI features are paused. Viewing and turning cards by hand still work."));
  if (r.status === 429) toast(T("오늘 쓸 수 있는 횟수를 다 썼어요. 보기와 손으로 넘기기는 계속 돼요.", "Today's limit is used up. Viewing and turning cards by hand still work."));
  if (r.status !== 401 || !o.method || o.method === "GET" || String(u) === "/login") return r;
  if (Date.now() - keyDeclined < 60000) return r;  // 방금 '취소'했으면 1분 동안은 다시 묻지 않는다(자동 저장·따라 하기가 창을 계속 띄우지 않게)
  return (await askKey()) ? rawFetch(u, o) : r;
};
let keyDeclined = 0;
function askKey() {
  return keyAsk ??= new Promise(done => {
    const box = document.createElement("div");
    box.className = "keyask";
    box.innerHTML = `<form><b>${T("접속 키가 필요해요", "Access key needed")}</b>
      <span class="muted">${T("보기는 누구나 할 수 있어요. 영상 넣기, 그림 만들기, 따라 하기처럼 비용이 들거나 카드를 바꾸는 일에만 키가 필요해요.", "Anyone can view. Adding videos, drawings, Coach mode and edits need the key, because they cost credits or change cards.")}</span>
      <input type="password" autocomplete="current-password" aria-label="${T("접속 키", "Access key")}" placeholder="${T("접속 키", "Access key")}">
      <span class="red" hidden></span>
      <div><button class="btn primary">${T("확인", "OK")}</button> <button type="button" class="btn">${T("취소", "Cancel")}</button></div></form>`;
    const end = ok => { box.remove(); keyAsk = null; if (!ok) keyDeclined = Date.now(); else loadRole(); done(ok); };
    box.querySelector("button[type=button]").onclick = () => end(false);
    box.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      const r = await rawFetch("/login", { method: "POST", body: new URLSearchParams({ k: box.querySelector("input").value }) });
      if (r.ok) return end(true);
      const m = box.querySelector(".red"); m.hidden = false; m.textContent = T("키가 맞지 않아요.", "That key is not right.");
    };
    document.body.append(box); box.querySelector("input").focus();
  });
}
// 선 아이콘(24px 격자). 이모지는 기기마다 모양이 달라서 쓰지 않는다
const IC = { plus:'<path d="M12 5v14M5 12h14"/>', video:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10 5-3v10l-5-3"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/>', print:'<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6H7z"/>',
  tablet:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M11 18h2"/>', glasses:'<rect x="2.5" y="9.5" width="8" height="6.5" rx="3"/><rect x="13.5" y="9.5" width="8" height="6.5" rx="3"/><path d="M10.5 12c1-.9 2-.9 3 0M2.5 11 1.8 8.5M21.5 11l.7-2.5"/>',
  draw:'<path d="M12 3 13.6 8.4 19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6z"/><path d="M19 16v4M17 18h4"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  share:'<path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  sound:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>', mute:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/>' };
const icon = n => `<svg class="ico" viewBox="0 0 24 24">${IC[n]}</svg>`;
const HELP_IC = ['<path d="M5 7h14M5 12h14M5 17h9"/>', '<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 18 5-5 3 3 2-2 4 4"/>',
  '<path d="M5 10v4h3l4 4V6L8 10H5z"/><path d="M16 9a4 4 0 0 1 0 6"/>', '<circle cx="12" cy="12" r="8"/><path d="m10 8.5 5 3.5-5 3.5z"/>'];  // 시안 '도움 4단계' 모티프
const helpIcon = l => `<svg class="ico" viewBox="0 0 24 24">${HELP_IC[l - 1]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => `${Math.floor(t / 60)}:${String(Math.round(t) % 60).padStart(2, "0")}`;
const pad = (n, w = 2) => String(n).padStart(w, "0");
const S = { run: null, view: "home", data: null, idx: 0, poll: null, busy: new Map(), open: new Set(), strip: new Set(),
            saveTimer: null, saving: Promise.resolve(), saveState: "saved" };
let lang = (() => { try { return localStorage.getItem("lang") === "x" ? "x" : null; } catch { return null; } })();  // 카드 글자는 위쪽 화면 언어를 따른다. 따로 고르는 건 더한 언어("x")뿐(11-03: 같은 한국어/English 단추가 두 곳이라 헷갈림)
let ui = (() => {  // 화면 글자: 주소의 ?ui= → 저장된 값 → 영어
  const q = new URLSearchParams(location.search).get("ui");
  if (q === "ko" || q === "en") return q;
  const nav = /^ko/i.test(navigator.language || "") ? "ko" : "en";  // 저장값이 없으면 브라우저 언어(한국어 브라우저의 교사가 영어 화면을 먼저 보지 않게)
  try { return localStorage.getItem("ui") || nav; } catch { return nav; }  // 기본은 영어(심사·해외 사용자). 한국어는 위 단추로
})();
const T = (ko, en) => ui === "en" ? en : ko;
lang ??= ui === "en" ? "en" : "ko";
const runTitle = r => (ui === "en" && r.title_en) || r.title || r.video;  // 견본은 영어 제목도 있다
function setUi(v) { ui = v; if (lang !== "x") lang = v; try { localStorage.setItem("ui", v); } catch {} document.documentElement.lang = v;
  if (S.view === "coach" && C.started) return coachCard(true);  // 따라 하는 중엔 화면을 새로 그리지 않는다(카메라가 꺼짐). 나머지 글은 나갈 때 바뀐다
  route(); }

function go(p) { location.hash = p.run ? new URLSearchParams(p).toString() : ""; }
window.addEventListener("hashchange", route);

const VIEWS = ["making", "edit", "use", "tablet", "coach"];
// 화면 그리기가 망 오류로 멈추면 빈 화면 대신 알리고 다시 시도 단추를 둔다
async function route() {
  const me = (S.nav || 0) + 1;
  try { await routeView(); } catch (e) {
    if (S.nav !== me) return;  // 그사이 다른 화면으로 갔으면 그 화면이 그린다
    $("#main").innerHTML = `<div class="center" style="padding:48px 0"><p>${T("불러오지 못했어요. 인터넷 연결을 확인해 주세요.", "Could not load. Please check your connection.")}</p>
      <button class="btn primary" onclick="route()">${T("다시 시도", "Try again")}</button></div>`;
  }
}
async function routeView() {
  if (S.savePending && S.data) saveNow();  // 입력하고 0.7초 안에 다른 화면으로 가도 고친 내용을 먼저 보낸다
  const me = S.nav = (S.nav || 0) + 1;  // 빨리 연달아 옮기면 늦게 온 옛 응답은 버린다
  clearInterval(S.poll); clearInterval(S.livePoll);
  stopCoach();
  if ($("#vbox")) closeVerify();  // 확인하기 카메라가 켜진 채 다른 화면으로 가지 않게
  if (recState?.state === "recording") recState.stop();  // 녹음 중에 나가면 마이크를 끈다(녹음은 저장)
  const p = new URLSearchParams(location.hash.slice(1));
  const run = p.get("run"), was = `${S.run}|${S.view}`;
  if (run !== S.run) { S.run = run; S.data = null; S.undo = null; S.framesOk = false; S.idx = 0; S.open.clear(); S.strip.clear(); S.stuck = undefined; }
  S.view = run ? (VIEWS.includes(p.get("view")) ? p.get("view") : "making") : p.get("view") === "admin" ? "admin" : "home";  // 모르는 화면 이름이면 기본 화면
  if (run && !S.data) {
    const r = await fetch(`/api/runs/${run}/cards`), data = r.ok ? await r.json() : null;
    const gone = !r.ok && r.status === 404 && (await fetch(`/api/runs/${run}/progress`)).status === 404;
    if (me !== S.nav) return;
    if (data) S.data = data; else if (gone) S.view = "missing";
  }
  if (`${S.run}|${S.view}` !== was) scrollTo(0, 0);  // 다른 화면으로 가면 맨 위부터
  if (["edit", "use", "tablet", "coach"].includes(S.view) && !S.data) S.view = "making";
  document.body.classList.toggle("tabmode", S.view === "tablet" || S.view === "coach");
  document.body.classList.toggle("homepage", S.view === "home");  // 첫 화면은 흰 바탕(이야기형)
  document.documentElement.lang = ui;
  $("#uiseg").innerHTML = [["ko", "한국어", "한"], ["en", "English", "EN"]].map(([v, l, short]) => `<button class="${ui === v ? "on" : ""}" aria-pressed="${!!(ui === v)}" onclick="setUi('${v}')" aria-label="${l}"><span class="long">${l}</span><span class="short">${short}</span></button>`).join("");  // 휴대폰에서는 짧게
  header();
  ({ home, making, edit, use, tablet, coach, missing, admin })[S.view]();
}

/* 위쪽 1·2·3 단계 표시 */
function header() {
  document.body.classList.toggle("home", S.view === "home");  // 휴대폰 처음 화면에서는 숫자만 남는 단계 표시를 숨긴다
  const done = !!S.data, cur = ["tablet", "coach"].includes(S.view) ? "use" : S.view === "home" ? "making" : S.view;
  const items = [["making", T("영상 넣기", "Add video"), T("영상", "Video")], ["edit", T("카드 확인·고치기", "Check & edit"), T("고치기", "Edit")], ["use", T("따라 하며 확인", "Follow & check"), T("확인", "Check")]];  // 세 번째는 휴대폰용 짧은 이름
  $("#steps").innerHTML = items.map(([v, l, short], i) => {
    const ok = (v === "making" && done) || (v === "edit" && done && cur === "use" && !(S.data.problems || []).length);
    const off = !S.run || S.view === "missing" || (v !== "making" && !done);
    return `${i ? '<span class="arrow">›</span>' : ""}<button class="step ${cur === v ? "on" : ""} ${ok ? "done" : ""}" ${off && cur !== v ? "disabled" : ""}
      onclick="${S.run ? `go({run:S.run,view:'${v}'})` : ""}"><span class="dot">${ok ? "✓" : i + 1}</span><span class="long">${l}</span><span class="short">${short}</span></button>`;
  }).join("");
}

function imgSrc(c, plain) {  // plain: 인쇄·공유(종이·메신저에는 물건 테두리가 사진만 가린다)
  if (c.view === "ill" && c.ill) return `/runs/${S.run}/${c.ill}?v=${c.v || 0}`;
  const f = c.box && !c.hl_off && !plain ? c.image.replace(".jpg", "_hl.jpg") : c.image;
  return `/runs/${S.run}/${f}?v=${c.v || 0}`;
}
// 움직임 보기: 그 단계 영상 몇 초를 소리 없이 반복. 인쇄·미리 불러오기는 사진(imgSrc)을 쓴다
function media(c, attrs = "") {
  if (c.view === "fold" && S.data?.fold?.report?.[c.n] === "no" && S.view !== "edit") return media({ ...c, view: S.data.stage === "archived" ? (c.ill ? "ill" : "photo") : "clip" }, attrs);  // 대조에서 다르다고 나온 3D는 학습자에게 보이지 않고 움직임으로
  if (c.view === "fold" && S.data?.fold) return `<span class="f3wrap"><canvas class="fold3d" data-n="${c.n}" width="480" height="360" style="background:#f4f1ea url('${imgSrc(c)}') center/cover" role="img" aria-label="${esc(main(c))}" onclick="f3pause(this)" title="${T("누르면 멈춰요", "Tap to pause")}"></canvas><button class="f3speed" onclick="f3slow(event)">${f3slowLabel()}</button></span>`;  // 3D 접기(fold3d.js 가 그린다)
  return c.view === "clip" ? `<video src="/api/runs/${S.run}/clip/${c.n}.mp4?t=${c.frame_t ?? c.rep}" poster="${imgSrc(c)}" autoplay muted loop playsinline ${attrs}></video>`
                           : `<img src="${imgSrc(c)}" alt="${esc(main(c))}" ${attrs}>`;  // 사진 설명 = 카드 문장(화면 낭독기, 고른 카드 글자로)
}
const xOn = () => lang === "x" && S.data?.extra?.ok;  // 한 언어 더: 만든 사람이 확인한 뒤에만 보인다
const main = c => (lang === "en" || (lang === "x" && ui === "en")) ? c.en : c.ko;
function text(c) {
  if (lang === "x") return `${esc(main(c))}${xOn() && c.x ? `<span class="en">${esc(c.x)}</span>` : ""}`;
  if (lang === "en") return esc(c.en);
  return esc(c.ko);
}
function setLang(v) { lang = v; try { localStorage.setItem("lang", v); } catch {} ({ use, tablet })[S.view]?.(); }
// 망이 끊기면 알린다(요청마다 실패 알림이 따로 뜨기 전에 원인을 먼저)
addEventListener("offline", () => toast(T("인터넷 연결이 끊겼어요. 다시 이어지면 계속돼요.", "You're offline. It will continue when the connection is back.")));
const loadRole = () => rawFetch("/api/me").then(r => r.json()).then(d => { const was = S.role; S.role = d.role; if (was !== S.role && S.view === "home") route(); }).catch(() => {});
loadRole();
addEventListener("online", () => { toast(T("다시 연결됐어요.", "Back online.")); if (S.saveState === "error" || S.savePending) saveNow(); });
function toast(msg, label, act) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span>${esc(msg)}</span>${label ? `<button>${esc(label)}</button>` : ""}`;
  if (label) t.querySelector("button").onclick = () => { t.remove(); act(); };
  document.body.append(t);
  setTimeout(() => t.remove(), label ? 15000 : 6000);  // 되돌리기 단추가 있는 알림은 천천히 읽는 사람도 누를 수 있게

async function upload(f) {
  if (!f.type.startsWith("video/")) return toast(T("영상 파일만 넣을 수 있어요.", "Only video files can be added."));
  const dur = await new Promise(res => { const v = document.createElement("video"); v.preload = "metadata"; v.onloadedmetadata = () => res(v.duration); v.onerror = () => res(0); v.src = URL.createObjectURL(f); });
  if (dur > 600) return toast(T(`영상이 ${Math.round(dur / 60)}분이에요. 10분 안으로 잘라서 넣어 주세요(1~5분이 가장 좋아요).`, `This video is ${Math.round(dur / 60)} min. Please trim it to under 10 minutes (1–5 is best).`));
  if (f.size > 500 * 1048576) return toast(T(`영상이 ${Math.round(f.size / 1048576)}MB예요. 500MB 아래로 줄여 주세요(휴대폰 설정에서 1080p로 찍거나, 앞뒤를 잘라 주세요).`, `This video is ${Math.round(f.size / 1048576)} MB. Please keep it under 500 MB (record at 1080p, or trim it).`));

  $("#drop").innerHTML = `<div class="big">${T("영상을 올리는 중…", "Uploading…")} <span id="upct"></span></div><div class="prog"><i id="upbar" style="width:0%"></i></div>`;
  const fd = new FormData(); fd.append("file", f); if (S.makeLocal) fd.append("local", "true");
  const r = await new Promise(res => {  // fetch 는 올리는 진행을 못 알려서 XHR 로(몇 분 걸리는 휴대폰 영상에서 멈춘 줄 알지 않게)
    const x = new XMLHttpRequest(); x.open("POST", "/api/upload");
    x.upload.onprogress = e => { if (!e.lengthComputable) return; const p = Math.round(e.loaded / e.total * 100); const b = $("#upbar"), t = $("#upct"); if (b) b.style.width = p + "%"; if (t) t.textContent = p + "%"; };
    x.onload = () => res({ ok: x.status < 300, status: x.status, json: async () => JSON.parse(x.responseText) });

  if (!r.ok) {  // 서버가 알려 준 이유(크기·길이·저장 공간·키 없음)를 그대로

                  409: T("이 맥의 Muse Glimmer 서버가 꺼져 있어요.", "The Muse Glimmer server on this Mac is not running."),
                  401: T("영상을 넣으려면 접속 키가 필요해요.", "An access key is needed to add videos."), 403: T("저장 한도를 넘었어요. 안 쓰는 카드 묶음을 지워 주세요.", "You've reached your storage limit. Delete card sets you no longer need.") }[r.status];

  [/대표 시각/, "고른 장면이 이 카드 시간 밖에 있어요. '다른 장면 고르기'로 다시 골라 주세요.", "The chosen photo is outside this card's time. Use 'Choose another frame'."],

  [/맞춤법/, m => `맞춤법: ${m.match(/\('(.+)' → '(.+)'\)/).slice(1).join(" → ")} 로 고쳐 주세요.`,
             m => `Korean spelling: change ${m.match(/\('(.+)' → '(.+)'\)/).slice(1).join(" → ")}.`],

function problemText(m, withStep) {
  const hit = FRIENDLY.find(([re]) => re.test(m));
  if (!hit) return m;
  const f = ui === "en" ? hit[2] : hit[1], txt = typeof f === "function" ? f(m) : f;
  const k = m.match(/^(\d+)(?:·(\d+))?단계/);
  return withStep && k ? `${T(`${k[2] ? k[1] + "·" + k[2] : k[1]}단계: `, `Step ${k[2] ? k[1] + "–" + k[2] : k[1]}: `)}${txt}` : txt;
}
function issues() {
  const per = {}, global = [], gaps = {};
  for (const m of S.data.problems || []) {
    const k = m.match(/^(\d+)(?:·(\d+))?단계/);
    const f = problemText(m);
    if (!k) { global.push(f); continue; }
    const i = +(k[2] || k[1]) - 1;
    (per[i] = per[i] || []).push(f);
  }
  for (const w of S.data.warnings || []) {
    const k = w.match(/^(\d+)·\d+단계 사이 (\d+)~(\d+)초/);
    if (k) gaps[+k[1] - 1] = [+k[2], +k[3]];
  }
  return { per, global, gaps };
}

function stripHtml(c, i) {

    fetch(`/api/runs/${S.run}/cards/${n}/similar`).then(r => r.json()).then(x => { const w = $("#sim" + n); if (w && x.similar) w.hidden = false; }).catch(() => {});
  if (which === "strip" && s.has(n) && S.data.stage === "compact" && !S.framesOk) {  // 정리된 묶음은 1초 사진을 사본에서 다시 뽑는다

/* 고친 내용은 저절로 저장하고, 저장할 때마다 서버가 규칙 검사를 다시 한다 */
function setSave(s) { S.saveState = s; const el = $("#saved"); if (el) el.textContent = saveText(); }
function scheduleSave(ms = 700) { clearTimeout(S.saveTimer); setSave("dirty"); S.savePending = true; S.saveTimer = setTimeout(saveNow, ms); }
/* 막지는 않지만 교사가 꼭 볼 곳(11-02 검토: 검사기는 형식만 보고 내용은 못 잡는다). 숫자가 영상 말소리에 없음 / 왼쪽·오른쪽(거울처럼 뒤바뀌기 쉬움) */
function notesHtml(c) {
  const t = `${c.ko || ""} ${c.en || ""}`, heard = new Set(S.data.heard_nums || []), out = [];
  if ((t.match(/\d+(?:[.,]\d+)?/g) || []).some(x => !heard.has(x))) out.push(T("숫자(양·시간)가 영상 말소리에 없어요. 맞는지 봐 주세요.", "This number isn't in what was said in the video. Please check it."));
  if (c.en_src != null && c.en_src !== c.ko) out.push(T("한국어 문장을 고쳤어요. 영어 문장도 같은 뜻인지 맞춰 주세요.", "The Korean sentence changed. Please make the English one match."));
  if (/왼|오른|\b(left|right)\b/i.test(t)) out.push(T("왼쪽·오른쪽이 영상과 같은지 봐 주세요. 거울처럼 바뀌기 쉬워요.", "Check left and right against the video. They are easy to mirror."));
  return out.map(x => `<div class="rnote">${esc(x)}</div>`).join("");
}
// '다 됐어요': 교사가 지금 카드를 확인했다고 남기고 따라 하기로. 그 뒤 카드를 고치면 다시 '확인 전'
async function markReviewed() { S.reviewNext = true; await saveNow(); go({ run: S.run, view: "use" }); }
function saveNow() {
  clearTimeout(S.saveTimer); S.savePending = false;
  const run = S.run, cards = JSON.parse(JSON.stringify(S.data.cards)), title = S.data.title ?? "";  // 부른 순간의 묶음·카드로 저장(그사이 다른 묶음으로 옮겨도 섞이지 않게)
  S.saving = S.saving.then(async () => {
    setSave("saving");
    const reviewed = !!S.reviewNext; S.reviewNext = false;
    const r = await fetch(`/api/runs/${run}/cards`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cards, title, ...(S.foldDrop ? { fold: null } : S.foldPut ? { fold: S.data.fold } : {}), ...(reviewed ? { reviewed: true } : {}) }) });
    if (r.status === 401) return setSave("readonly");
    if (r.status === 403) return setSave("others");  // 다른 교사의 카드 묶음
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (S.run !== run || !S.data) return setSave("saved");
    Object.assign(S.data, { problems: d.problems, warnings: d.warnings, status: d.status, extra: d.extra, next_n: d.next_n, edited_at: d.edited_at, reviewed: !!d.reviewed_at && d.reviewed_at === d.edited_at }); S.foldDrop = false; S.foldPut = false;  // 문장이 바뀌면 서버가 번역 확인을 푼다
    setSave("saved");
    if (S.view === "edit") updateIssues();
  }).catch(() => setSave("error"));
  return S.saving;
}
/* 막힌 카드 돌려보내기: 따라 한 사람들이 자주 막힌 카드를 만든 사람에게 보여 주고, 고칠 안을 Muse Spark 에게 받는다.

function stuckHtml() {
  if (S.stuck === undefined) { S.stuck = null; loadStuck(); }
  const list = S.stuck || [], pos = n => S.data.cards.findIndex(c => c.n === n);

  return `<div class="stuckbox"><b>${icon("plus")} ${T("따라 한 사람들이 자주 막힌 카드", "Cards people often got stuck on")}</b>
    ${rows.map(x => { const i = pos(x.n), c = S.data.cards[i], why = [
        x.tries ? T(`${x.tries}번 중 ${x.high}번 소리·움직임 도움까지`, `needed sound or motion help ${x.high} of ${x.tries} times`) : "",
        x.miss ? T(`확인에서 '달라요·아직' ${x.miss}번`, `Check said different / not yet ${x.miss} times`) : "",
        x.marks ? T(`'여기서 막혔어요' ${x.marks}번`, `'Stuck here' ${x.marks} times`) : "",
        x.local ? T("방금 이 기기의 따라 하기", "just now on this device") : ""].filter(Boolean).join(" · ");
      return `<div class="stuckrow"><span class="n">${i + 1}</span><div><span>${esc(text(c))}</span><br><span class="muted">${why}</span></div>

        <button class="btn primary" onclick="fixStuck(${c.n})">${T("고칠 안 받기", "Get a fix")}</button></span></div>`; }).join("")}</div>`;
}
async function loadStuck() {

function fixStuck(n) {  // 그 카드 하나만 콕 집어 부탁한다. 결과는 늘 그렇듯 '적용'을 눌러야 바뀐다

/* 그림 카드(Muse Image): 교사가 카드마다 사진·그림 중 고른다 */
function setView(i, v) { S.data.cards[i].view = v; changed(); }
async function illustrateCard(i, quiet) {
  const c = S.data.cards[i];
  S.busy.set(c.n, T("그림으로 바꾸는 중…", "Drawing…")); if (S.view === "edit") edit();
  await saveNow();
  const r = await fetch(`/api/runs/${S.run}/cards/${c.n}/illustrate`, { method: "POST" }).catch(() => ({ ok: false }));
  S.busy.delete(c.n);
  if (r.ok) { const f = await r.json(); Object.assign(c, { ill: f.ill, view: "ill", v: Date.now() }); }
  else if (!quiet) toast(T("그림을 만들지 못했어요. 다시 해 주세요.", "Could not make the drawing. Please try again."));
  if (S.view === "edit") edit();
  if (!quiet) saveNow();
  return r.ok;
}
function illustrateAll() {
  const n = S.data.cards.filter(c => !c.ill && !S.busy.has(c.n)).length;
  if (!n) return toast(T("모든 카드에 이미 그림이 있어요. 카드마다 '다시 그리기'로 바꿀 수 있어요.", "Every card already has a drawing. Use 'Redraw' on a card to replace one."));
  // 값이 드는 일이라 한 번 더 묻는다. 16장에 59초 걸린 실측(3장씩 동시에)으로 시간을 어림한다
  toast(T(`그림 ${n}장 · 약 $${(n * 0.01).toFixed(2)} · 약 ${Math.ceil(n * 3.7)}초`, `${n} drawings · about $${(n * 0.01).toFixed(2)} · about ${Math.ceil(n * 3.7)} s`), T("만들기", "Make"), illustrateMissing);
}
async function illustrateMissing() {
  const todo = S.data.cards.map((c, i) => [c, i]).filter(([c]) => !c.ill && !S.busy.has(c.n)).map(([, i]) => i);
  let done = 0, fail = 0;
  const worker = async () => { while (todo.length) { const i = todo.shift(); (await illustrateCard(i, true)) ? done++ : fail++; } };
  await Promise.all([worker(), worker(), worker()]);  // 3장씩 동시에
  await saveNow();
  toast(T(`그림 ${done}장을 만들었어요${fail ? ` (${fail}장 실패)` : ""}.`, `Made ${done} drawings${fail ? ` (${fail} failed)` : ""}.`));
}

async function addCard(i) {
  const cs = S.data.cards, prev = cs[i], next = cs[i + 1], dur = S.data.duration || Infinity;
  let start = prev.end + 1, end = next ? next.start - 1 : Math.min(dur - 1, start + 3);
  if (end - start < 1) {  // 붙어 있으면 앞 카드를 반으로 나눠 뒤쪽 절반을 새 카드로(시간이 겹치지 않게)
    if (prev.end - prev.start < 3) return toast(T("여기엔 카드를 넣을 시간이 없어요. 위 카드의 시간을 줄이고 넣어 주세요.", "No time left here. Shorten the card above first."));
    const mid = Math.floor((prev.start + prev.end) / 2);
    start = mid + 1; end = prev.end; prev.end = mid; prev.rep = Math.min(prev.rep, mid);
    if (prev.done_t != null && prev.done_t > mid) delete prev.done_t;
  }
  const n = Math.max(S.data.next_n || 0, ...cs.map(c => c.n + 1)); S.data.next_n = n + 1; foldStale();  // 뺀 카드 번호를 다시 쓰지 않는다(서버 next_n 과 같은 규칙)
  cs.splice(i + 1, 0, { n, start, end, rep: start, ko: "", en: "", object: "", look: "", image: `cards/${pad(n)}.jpg`, box: null });
  S.strip.add(n);
  await reframe(i + 1, start + Math.floor((end - start) / 2));
  $(`#row${i + 1} textarea.say`)?.focus();
}

async function runX() {

  if (!r.ok) { b.disabled = false; b.textContent = T("옮기기", "Translate"); return toast(r.status === 401 ? T("옮기려면 접속 키가 필요해요.", "An access key is needed to translate.") : r.status === 403 ? T("다른 사람이 만든 카드 묶음이에요.", "Someone else made this card set.") : T("옮기지 못했어요. 다시 해 주세요.", "Could not translate. Please try again.")); }
  const d = await r.json();
  S.data.cards = d.cards; S.data.extra = d.extra; S.xprob = d.translate.problems;
  $("#xbox").innerHTML = xboxHtml(); toast(T(`옮겼어요 · $${d.translate.cost}`, `Translated · $${d.translate.cost}`));
}
function editX(i, v) {  // 직접 고친 번역은 되옮김이 없어진다(옛 되옮김을 믿지 않게). 다시 확인 필요
  const c = S.data.cards[i]; c.x = v.trim(); c.xb = null; c.xsrc = c.ko; S.data.extra.ok = false;
  S.xprob = (S.xprob || []).filter(x => x.n !== c.n); saveX(false);
}
async function saveX(ok) {
  const extra = ok === null ? null : { ...S.data.extra, ok: !!ok };
  if (ok === null) S.data.cards.forEach(c => { delete c.x; delete c.xb; delete c.xsrc; });
  const r = await fetch(`/api/runs/${S.run}/cards`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cards: S.data.cards, title: S.data.title ?? "", extra }) });
  if (!r.ok) return toast(r.status === 403 ? T("다른 사람이 만든 카드 묶음이에요.", "Someone else made this card set.") : T("저장하지 못했어요.", "Could not save."));
  const d = await r.json(); S.data.extra = d.extra;
  if (!d.extra && lang === "x") setLang(ui);

    const cs = S.data.cards, name = (S.data.title || "StepCards").replace(/[\\/:*?"<>|]/g, "");

    const files = await Promise.all(cvs.map(async (cv, i) => new File([await blob(cv)], `${name}_${pad(i + 1)}.jpg`, { type: "image/jpeg" })));

  for (let t = 0; t <= (S.data.duration || cs.at(-1).end); t++) {
    const k = cs.findIndex(c => t >= c.start && t <= c.end);
    if (k < 0) continue;  // 카드 사이 빈 시간은 쓰지 않는다
    const img = await loadImg(`/runs/${S.run}/frames/f${pad(t + 1, 3)}.jpg`).catch(() => null);
    if (img) items.push({ e: OD.emb.embed(img).embeddings[0].floatEmbedding, k: k + 1, pos: (t - cs[k].start) / Math.max(1, cs[k].end - cs[k].start) });
  }
  return OD.index = { run: S.run, items, ms: Math.round(performance.now() - t0) };
}
function odGuess(video) {  // 지금 화면이 몇 번 카드와 가장 닮았는지(위 5개 투표)와 그 카드 안 위치
  const e = OD.emb.embed(video).embeddings[0].floatEmbedding;
  const top = OD.index.items.map(it => { let s = 0; for (let j = 0; j < e.length; j++) s += e[j] * it.e[j]; return [s, it]; }).sort((a, b) => b[0] - a[0]).slice(0, 5);
  const votes = {};
  for (const [s, it] of top) votes[it.k] = (votes[it.k] || 0) + s;
  const k = +Object.entries(votes).sort((a, b) => b[1] - a[1])[0][0], mine = top.filter(([, it]) => it.k === k);
  return { k, pos: mine.reduce((a, [, it]) => a + it.pos, 0) / mine.length, sim: top[0][0] };
}
async function odLoop() {
  pill(T("이 기기 모델 준비 중…", "Preparing on-device model…"));
  try { await odIndex(); } catch { pill(T("이 기기 모델을 불러오지 못했어요 · 이전·다음으로 넘겨요", "Could not load the on-device model · use Back and Next")); return; }
  const v = $("#cvid"), hist = [];
  C.odStats = { n: 0, ms: 0 };
  while (C.running && S.view === "coach" && C.where === "device") {
    if (v.readyState >= 2 && !C.checking) {
      const t0 = performance.now(), g = odGuess(v), ms = performance.now() - t0;
      C.odStats.n++; C.odStats.ms += ms;
      hist.push(g); if (hist.length > 8) hist.shift();
      const cur = S.idx + 1, n = S.data.cards.length, count = k => hist.filter(h => h.k === k).length;
      pill(T(`이 기기 · ${Math.round(ms)}ms`, `On device · ${Math.round(ms)} ms`));
      if (hist.length >= 6 && cur < n && count(cur + 1) >= 6) {  // 다음 단계 장면이 1초쯤 이어지면 넘긴다
        S.idx++; hist.length = 0; C.buf = []; $("#cagain").hidden = true; coachCard(); pill(T(`${S.idx + 1}번 카드로 넘겼어요 · 이 기기`, `Moved to card ${S.idx + 1} · on device`));
      } else if (hist.length >= 8 && hist.every(h => h.k > cur + 1) && C.againSaid !== S.idx) {  // 뒤 단계가 계속 보이면 '이 카드부터'
        $("#cagain").hidden = false; glassesSync(true); C.againSaid = S.idx; speak(false, true);
        setTimeout(() => { const a = $("#cagain"); if (a) a.hidden = true; }, 4000);
      } else if (cur === n && hist.length >= 8 && hist.filter(h => h.k === cur && h.pos > 0.8).length >= 6) { coachEnd(true); break; }
    }
    await new Promise(r => setTimeout(r, 150));
  }
}
/* 선생님이 고친 카드를 받는다(보던 카드 번호에서 이어 감). 판단 응답(reload)으로도, 판단을 안 보내는 상태(손으로 넘김·판단 끔·카메라 없음)에서는
   10초마다 고친 시각을 직접 확인해서도 부른다(11-02 검토: 그 상태의 학습자에게는 고친 카드가 영영 안 갔다) */
async function reloadCards(data) {
  const n = S.data.cards[S.idx]?.n, wasNoDone = noDone();
  if (!data) { const r2 = await fetch(`/api/runs/${S.run}/cards`).catch(() => null); if (!r2?.ok) return; data = await r2.json(); }
  if (S.view !== "coach") return;
  S.data = data; const k = S.data.cards.findIndex(c => c.n === n); S.idx = k >= 0 ? k : Math.min(S.idx, S.data.cards.length - 1);
  C.buf = []; C.prev = 0; C.pm = -1; coachCard(true); pill(T("만든 사람이 고친 카드로 바꿨어요", "Updated to the maker's latest cards"));
  if (noDone() && !wasNoDone) {  // '사람이 정하기'로 바뀜: 카메라를 끄고 손으로 넘긴다(그대로 두면 409 를 받으며 판단을 계속 보냈다)
    C.manual = true; C.stream?.getTracks().forEach(t => t.stop()); C.stream = null;
    $(".coachv")?.classList.remove("follow"); $(".coachv")?.classList.add("nodone"); $(".verifybtn")?.remove();
    pill(T("직접 넘겨요 · '다 했다'는 사람이 정해요", "Turn cards by hand · a person decides when it's done"));
  }
}
/* 판단 한 번: 서버에 묻고 답(d)을 돌려준다. 자동 넘김을 더 할 수 없는 응답(401·402·409·429)이면 멈추고 이유를 말한 뒤 "off" */
async function askCoach(cur) {
  const t0 = Date.now(); let d = null;
  try { const r = await fetch(`/api/runs/${S.run}/coach`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cur, frames: C.buf.slice(), prev_seen: C.prev, prev_match: C.pm ?? -1, on_card: C.started ? (Date.now() - (C.cardAt || Date.now())) / 1000 : null, local: C.local, live: C.live, ver: S.data.edited_at ?? null }) }); if (r.ok) d = await r.json();
    // 같은 요청을 0.4초마다 끝없이 다시 보내며 '다시 보는 중'만 띄우던 것을 멈추고 이유를 말한다(11-02 검토)
    const off = { 401: T("자동 넘김은 접속 키가 필요해요", "Auto-advance needs the access key"), 402: T("지금은 자동 넘김을 쓸 수 없어요", "Auto-advance is unavailable right now"),
      409: T("이 카드는 사람이 '다 했다'를 정해요", "A person decides when this is done"), 429: T("오늘 자동 넘김 횟수를 다 썼어요", "Today's auto-advance limit is used up") }[r.status];
    if (off) { C.manual = true; pill(`${off} · ${T("이전·다음으로 넘겨요", "use Back and Next")}`); const j = $("#cjudge"); if (j) { j.className = "judge"; j.textContent = off; } return "off"; } } catch { d = null; }
  clog("decision", { cur, decision: d?.decision || "none", target: d?.target ?? "", ms: Date.now() - t0, in_view: d?.in_view ?? "", match: d?.match ?? "", done_step: d?.done_step ?? "" });  // 어느 시범 사진과 맞췄는지(늦거나 이른 넘김을 가리려고)
  return d;
}
/* 답을 화면에 반영. 그 사이 카드가 바뀌었으면(사람이 넘김, 먼저 온 다른 답이 넘김) 버린다. 끝 화면으로 가면 "end" */
async function applyCoach(d, cur) {
  const cs = S.data.cards;
  if (!C.running || S.idx + 1 !== cur) return;
  if (!d) { pill(T("판단하지 못했어요 · 다시 보는 중", "No answer · watching again")); return; }
  if (d.decision === "reload") { await reloadCards(); return; }  // 선생님이 카드를 고쳤다: 새 카드를 받고, 보던 카드(번호 n)에서 이어 간다
  if (d.in_view === true) C.lastMove = Date.now();  // 손과 물건이 보이면 하고 있는 중: 오래 걸리는 단계에서 5분 멈춤에 걸리지 않게
  C.prev = d.seen; C.pm = d.done_step ?? -1; judge(d, cur);  // 앞뒤가 비슷한 단계는 두 번 연속 '끝'일 때만 넘긴다(서버가 판단)
  viewSeen(d);
  liveCheck(d);
  C.fin = d.decision === "finished" ? (C.fin || 0) + 1 : 0;
  if (C.fin >= 2) { coachEnd(true); return "end"; }  // 마지막 단계를 마쳤다는 판단이 두 번 연속
  const to = d.decision === "next" ? cur + 1 : d.decision === "jump" ? d.target : 0;
  if (Number.isInteger(to) && to >= 1 && to <= cs.length) {  // 없는 카드 번호는 무시
    S.idx = to - 1; clog("card", { cur, to, by: "auto" });
    C.buf = []; C.prev = 0;  // C.pm(끝난 단계 번호)은 저절로 넘겨도 그대로(절대 번호)
    $("#cagain").hidden = true; coachCard(); judge(d, cur, true); pill(T(`${S.idx + 1}번 카드로 넘겼어요`, `Moved to card ${S.idx + 1}`));
  }
  else if (d.decision === "again") {
    $("#cagain").hidden = false; glassesSync(true); if (C.againSaid !== S.idx) { C.againSaid = S.idx; speak(false, true); } C.buf = []; clearTimeout(C.againTimer); C.againTimer = setTimeout(() => { const a = $("#cagain"); if (a) a.hidden = true; }, 4000);
    watching(d);
  } else watching(d);
}
const canAsk = () => C.running && S.view === "coach" && !C.manual && !C.checking && C.buf.length >= 2 && S.idx + 1 <= S.data.cards.length;
async function coachLoop() {
  if (C.where === "device") return odLoop();
  const sess = C.sess;
  while (C.running && S.view === "coach" && sess === C.sess) {
    if (canAsk()) {
      const cur = S.idx + 1;
      C.inflight = (C.inflight || 0) + 1;
      const d = await askCoach(cur);
      if (sess !== C.sess) return;  // 그사이 새로 시작했으면 이 답과 루프는 버린다(새 세션 개수도 건드리지 않음)
      C.inflight--;
      if (d === "off") continue;
      C.fail = d ? 0 : (C.fail || 0) + 1;  // 답이 없으면(망 끊김·서버 오류) 0.8·1.6·3.2·5초로 늦춘다: 0.4초마다 다시 보내던 것
      if (await applyCoach(d, cur) === "end") break;
    }
    await new Promise(r => setTimeout(r, C.fail ? Math.min(5000, 400 * 2 ** C.fail) : 400));  // 판단 사이 쉬는 시간(1.5초 → 0.4초, 짧은 단계에서 밀리지 않게)
  }
}
/* 손이 멈춘 순간에는 앞 질문의 답을 기다리지 않고 한 번 더 바로 묻는다(동시에 최대 2개). 단계가 끝난 직후 사진이 응답 한 번만큼 빨리 판단에 들어간다.
   Meta 응답이 느릴 때(4~13초, 11-02 오후) 넘김이 그만큼 밀렸다. 추가 질문은 멈춤 순간에만 생겨 비용은 조금만 는다 */
async function coachSettled() {
  if (!canAsk() || (C.inflight || 0) >= 2 || C.where === "device") return;
  const cur = S.idx + 1, sess = C.sess;
  C.inflight = (C.inflight || 0) + 1;
  const d = await askCoach(cur);
  if (sess !== C.sess) return;
  C.inflight--;
  if (d !== "off") await applyCoach(d, cur);
}
/* 실시간 확인: 따라 하기 판단(2~4초마다)에 지금 카드의 기준 사진을 같이 넣어, 결과가 기준과 다르면 막지 않고 알려 준다.
   '달라요'가 두 번 연속일 때만(한 번은 잘못 볼 수 있어서), 카드마다 한 번 말하고 도움을 한 칸 올린다 */
C.live = (() => { try { return localStorage.getItem("live") !== "off"; } catch { return true; } })();
function setLive(on) { C.live = on; try { localStorage.setItem("live", on ? "on" : "off"); } catch {} }
function liveCheck(d) {
  if (!d.state || C.checking) return;
  const box = $("#clive");
  if (d.state !== "different") { C.diffN = 0; if (d.state === "done" && box) box.hidden = true; return; }
  if (++C.diffN < 2 || C.diffFor === S.idx || !box) return;
  C.diffFor = S.idx; callMaker("auto");
  const c = S.data.cards[S.idx], hint = ui === "en" ? d.hint_en : d.hint_ko;
  box.innerHTML = `<img src="/api/runs/${S.run}/cards/${c.n}/after.jpg?t=${doneT(c)}" alt=""><div><b>${T("이렇게 되면 돼요", "It should look like this")}</b><span>${esc(hint)}</span></div>
    <button onclick="this.parentElement.hidden=true" aria-label="${T("닫기", "Close")}">${icon("x")}</button>`;
  box.hidden = false;
  if (C.voice && window.speechSynthesis) { speechSynthesis.cancel(); speechSynthesis.speak(utter(hint, ui === "en" ? "en-US" : "ko-KR")); }
  if (C.help) helpUp(true);
  glassesResult({ result: "different", hint_ko: d.hint_ko, hint_en: d.hint_en });
}
const IDLE_MIN = 5;
function coachPause() {  // 카메라와 판단만 멈춘다(카드·안경 맞추기는 그대로). '다시 시작'으로 이어서
  C.running = false; clearInterval(C.timer); clearInterval(C.helpTimer);
  C.stream?.getTracks().forEach(t => t.stop()); C.stream = null; C.lock?.release().catch(() => {}); C.lock = null; $(".coachv")?.classList.remove("follow");
  $(".coachv")?.insertAdjacentHTML("beforeend", `<div class="cstart" id="cpause"><div class="glyph">${icon("glasses")}</div>
    <div class="t">${T("잠시 멈췄어요", "Paused")}</div>
    <div class="d">${T(`${IDLE_MIN}분 동안 다음 카드로 넘어가지 않아서 카메라를 껐어요. 카메라가 꺼진 동안은 비용이 들지 않아요.`, `No step change for ${IDLE_MIN} minutes, so the camera is off and nothing is being spent.`)}</div>
    <button class="navb next" onclick="document.getElementById('cpause').remove();coachCamera()">${T("다시 시작", "Resume")}</button></div>`);
  pill(T("멈춤", "Paused"));
}
function stopCoach(keepSync) {  // keepSync: 끝 화면에서도 안경의 '처음으로'를 받는다
  aim(false); $(".coachv")?.classList.remove("follow");
  C.running = false; clearInterval(C.timer); if (!keepSync) clearInterval(C.sync); clearInterval(C.helpTimer); C.started = false;
  window.speechSynthesis?.cancel(); C.lock?.release().catch(() => {}); C.lock = null; clearTimeout(C.againTimer);
  C.stream?.getTracks().forEach(t => t.stop()); C.stream = null;
}

function dotsHtml(n, idx) {  // 카드가 많으면 점이 넘쳐서 숫자만
  return n > 15 ? "" : `<div class="dots">${Array.from({ length: n }, (_, j) => `<i class="${j === idx ? "on" : ""}"></i>`).join("")}</div>`;
}
function flip(d) { stopVoice(); S.idx = Math.max(0, Math.min(S.data.cards.length - 1, S.idx + d)); tablet(); }
document.addEventListener("keydown", e => {
  if ($("#vbox")) { if (e.key === "Escape") closeVerify(); return; }
  if (S.view === "coach") { if ($("#csum")) return; if (e.key === "ArrowRight") coachFlip(1); if (e.key === "ArrowLeft") coachFlip(-1); if (e.key === "Escape") coachExit(); return; }
  if (S.view !== "tablet") return;
  if (e.key === "ArrowRight" || e.key === " ") flip(1);
  if (e.key === "ArrowLeft") flip(-1);
  if (e.key === "Escape") go({ run: S.run, view: "use" });
});
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; });
document.addEventListener("touchend", e => {
  if (S.view === "tablet" && touchX !== null) { const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 60) flip(dx < 0 ? 1 : -1); }
  touchX = null;
});

route();
</script>
