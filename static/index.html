<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>StepCards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230064e0'/%3E%3Cpath d='m7 12.5 3 3 7-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#f1f4f7; --paper:#fff; --raised:#f7f9fb; --ink:#1c2b33; --ink2:#344854; --muted:#65788a; --line:#dde3e9; --line2:#cbd2d9;
    --accent:#0064e0; --accent-h:#0052ba; --accent-soft:#e7f0fd; --accent-ink:#0050b5;
    --bad:#c4122f; --bad-soft:#fdecef; --ok:#0a7a35; --ok-soft:#e6f4eb; --warn:#8a5600; --warn-soft:#fff3d9;
    --dark:#0b1015; --dark2:#1a222a; --dark3:#2a343e;
    --r-s:10px; --r:16px; --r-l:24px;
    --sh-1:0 1px 2px rgba(28,43,51,.06), 0 1px 3px rgba(28,43,51,.05);
    --sh-2:0 4px 12px rgba(28,43,51,.08), 0 1px 3px rgba(28,43,51,.06);
    --sh-3:0 12px 32px rgba(28,43,51,.14);
    --focus:0 0 0 3px rgba(0,100,224,.35);
    --hh:64px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); word-break:keep-all; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.005em; }
  button { font:inherit; cursor:pointer; color:inherit; }
  :focus-visible { outline:none; box-shadow:var(--focus); }
  a { color:var(--accent); text-decoration:none; font-weight:600; } a:hover { text-decoration:underline; }
  .ico { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-4px; }

  /* 위쪽 막대 */
  header { display:flex; align-items:center; gap:20px; padding:0 24px; height:var(--hh); background:rgba(255,255,255,.92); backdrop-filter:saturate(1.8) blur(16px);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; cursor:pointer; letter-spacing:-.02em; flex:none; }
  .logo .mark { width:32px; height:32px; border-radius:9px; background:var(--accent); display:grid; place-items:center; }
  .logo .mark svg { width:20px; height:20px; }
  .steps { display:flex; align-items:center; gap:2px; margin:0 auto; background:var(--bg); padding:4px; border-radius:999px; }
  #uiseg .short, .step .short { display:none; } #uiseg .long, #uiseg .short { pointer-events:none; }
  @media (max-width:720px) { #uiseg .short, .step .short { display:inline; } .step .long { display:none; } }
  .step { display:flex; align-items:center; gap:8px; padding:7px 14px 7px 8px; border-radius:999px; border:none; background:none; color:var(--muted); font-size:14px; font-weight:600; transition:background .15s, color .15s; }
  .step .dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--ink2); font-size:12px; font-weight:700; }
  .step:hover:not(:disabled):not(.on) { color:var(--ink); }
  .step.on { background:var(--paper); color:var(--ink); box-shadow:var(--sh-1); } .step.on .dot { background:var(--accent); color:#fff; }
  .step.done .dot { background:var(--ok); color:#fff; }
  .step:disabled { opacity:.45; cursor:default; }
  .arrow { display:none; }
  main { max-width:1120px; margin:0 auto; padding:32px 24px 64px; }
  h2 { margin:0 0 6px; font-size:28px; line-height:1.25; font-weight:700; letter-spacing:-.025em; } h3 { margin:40px 0 14px; font-size:18px; font-weight:700; letter-spacing:-.015em; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:16px; max-width:680px; }
  .muted { color:var(--muted); font-size:14px; } .red { color:var(--bad); font-weight:600; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2); background:var(--paper); padding:8px 16px; border-radius:999px; font-size:14px; font-weight:600; color:var(--ink); transition:background .15s, border-color .15s; }
  .btn:hover:not(:disabled) { background:var(--raised); border-color:var(--muted); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover:not(:disabled) { background:var(--accent-h); border-color:var(--accent-h); }
  .btn.big { padding:14px 26px; font-size:16px; }
  .btn:disabled { opacity:.4; cursor:default; }
  .issue { display:flex; gap:8px; align-items:flex-start; padding:10px 14px; border-radius:var(--r-s); background:var(--bad-soft); color:var(--bad); font-size:14px; font-weight:500; margin:8px 0; }
  .issue::before { content:"!"; flex:none; width:18px; height:18px; border-radius:50%; background:var(--bad); color:#fff; font-size:12px; font-weight:800; display:grid; place-items:center; margin-top:1px; }

  /* 처음 화면 */
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--line2); border-radius:var(--r-l); background:var(--paper); padding:48px 24px; text-align:center; cursor:pointer; transition:.15s; box-shadow:var(--sh-1); min-height:280px; }
  .drop:hover, .drop.over { border-color:var(--accent); background:var(--accent-soft); }
  .drop .big { font-size:18px; font-weight:700; }
  .drop .plus { width:64px; height:64px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; margin-bottom:8px; box-shadow:0 6px 16px rgba(0,100,224,.3); }
  .drop .plus svg { width:28px; height:28px; stroke-width:2.2; }
  .drop .btn { margin-top:10px; pointer-events:none; }
  .drop .makewhere { margin-top:6px; } .drop #mkwhered { max-width:360px; font-size:13px; }
  /* 첫 화면: 큰 영상 한 장면과 한 문장씩 이어지는 이야기형(넓은 여백, 굵기 500의 큰 제목, 파란 알약 단추) */
  body.homepage { background:#fff; } body.homepage .drop { border-color:var(--line2); }
  .full { width:100vw; margin-left:calc(50% - 50vw); }
  html, body { overflow-x:clip; }  /* 100vw 가 세로 스크롤바 폭만큼 넘쳐 옆으로 밀리지 않게(clip 은 sticky 를 깨지 않는다) */
  .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .center { text-align:center; margin-left:auto; margin-right:auto; }
  h2.sect { font-size:40px; font-weight:500; letter-spacing:-.02em; margin:88px auto 28px; max-width:760px; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border-radius:100px; padding:12px 22px; font-size:16px; font-weight:700; }
  .pill:hover { background:var(--accent-h); text-decoration:none; } .pill.ghost { background:rgba(255,255,255,.16); backdrop-filter:blur(8px); } .pill.ghost:hover { background:rgba(255,255,255,.26); }
  .mhero { position:relative; height:min(78vh,720px); min-height:460px; margin-top:-32px; display:grid; place-items:center; overflow:hidden; background:var(--dark); }
  .mbg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(1.05); }
  .mshade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,16,21,.25), rgba(11,16,21,.55)); }
  .mcopy { position:relative; text-align:center; color:#fff; max-width:820px; padding:0 20px; }
  .mcopy h2 { font-size:clamp(32px,4.4vw,52px); font-weight:500; line-height:1.18; letter-spacing:-.02em; margin:0 0 14px; }
  .mcopy p { font-size:18px; opacity:.9; margin:0 auto 24px; max-width:620px; } .mbtns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .mpause { position:absolute; right:24px; bottom:24px; width:52px; height:52px; border-radius:50%; border:2px solid rgba(255,255,255,.6); background:rgba(11,16,21,.35); color:#fff; font-size:14px; }
  .mstory { padding:96px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .mstory.dark { background:#000; color:#fff; } .mstory h2 { font-size:clamp(30px,4vw,48px); font-weight:500; letter-spacing:-.02em; margin:0; }
  .mstory p { max-width:620px; margin:0; font-size:17px; color:var(--muted); } .mstory.dark p { color:#a9b8c6; }
  .mframe { width:min(720px,100%); border-radius:28px; overflow:hidden; position:relative; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .mframe video { width:100%; display:block; }
  .ladder { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:6px; background:rgba(11,16,21,.6); backdrop-filter:blur(10px); padding:6px; border-radius:999px; }
  .ladder span { padding:6px 14px; border-radius:999px; font-size:14px; font-weight:700; color:#a9b8c6; animation:lad 8s infinite; animation-delay:calc(var(--i) * 2s); }
  @keyframes lad { 0%, 24% { background:var(--accent); color:#fff; } 25%, 100% { background:transparent; color:#a9b8c6; } }
  @media (prefers-reduced-motion: reduce) { .ladder span { animation:none; } }
  .mpair { display:grid; grid-template-columns:1fr 1fr; gap:16px; width:min(820px,100%); } .mpair figure { margin:0; position:relative; }
  .mpair img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:24px; box-shadow:var(--sh-2); } .mpair figcaption { margin-top:8px; color:var(--muted); font-size:14px; }
  .okbadge { position:absolute; top:14px; right:14px; display:inline-flex; align-items:center; gap:6px; background:var(--ok); color:#fff; padding:8px 14px; border-radius:999px; font-size:15px; }
  .okbadge .ico { width:18px; height:18px; }
  .mstart { padding:88px 0 8px; } .mstart h2 { font-size:clamp(30px,4vw,44px); font-weight:500; margin:0 0 10px; } .mstart .sub { margin-bottom:28px; }
  .mstart .drop { max-width:760px; margin:0 auto; } .mstart .trust { justify-content:center; margin-top:16px; }
  .news { display:grid; grid-template-columns:repeat(6,1fr); gap:28px 24px; } .newscard { grid-column:span 2; } .newscard:nth-child(4) { grid-column:2 / span 2; }
  .newscard { color:var(--ink); font-weight:400; display:flex; flex-direction:column; gap:6px; } .newscard:hover { text-decoration:none; }
  .newscard img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:24px; transition:transform .2s; } .newscard:hover img { transform:scale(1.015); }
  .newscard .kicker { font-size:13px; color:var(--muted); font-weight:600; margin-top:6px; } .newscard strong { font-size:18px; font-weight:500; line-height:1.35; }
  .newscard .seemore { display:inline-flex; align-items:center; gap:8px; font-size:14px; } .newscard .seemore .ico { width:26px; height:26px; padding:5px; border:1px solid var(--line2); border-radius:50%; }
  @media (max-width:860px) { .news { grid-template-columns:1fr 1fr; } .newscard, .newscard:nth-child(4) { grid-column:auto; } }
  @media (max-width:560px) { .news, .mpair { grid-template-columns:1fr; } h2.sect { font-size:30px; margin-top:64px; } .mstory { padding:64px 16px; } }
  .trust { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:13px; color:var(--ink2); font-weight:600; }
  .trust span { display:inline-flex; align-items:center; gap:4px; } .trust .ico { width:15px; height:15px; color:var(--ok); }
  .where { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .where > div { background:var(--paper); border-radius:var(--r); padding:16px 18px; box-shadow:var(--sh-1); display:flex; flex-direction:column; gap:4px; border-top:4px solid var(--accent); }
  .where > div:nth-child(2) { border-top-color:var(--ink); } .where.two { grid-template-columns:repeat(2,1fr); max-width:900px; margin:0 auto; }
  .where .m { font-size:12px; font-weight:700; color:var(--muted); } .where .muted { font-size:13px; }
  @media (max-width:720px) { .where { grid-template-columns:1fr; } }
  .uses { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .uses div { background:var(--paper); border-radius:var(--r); padding:16px; box-shadow:var(--sh-1); display:flex; flex-direction:column; gap:4px; }
 
  .uses .fi { width:36px; height:36px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin-bottom:6px; }
  .uses strong { font-size:15px; }
  .uses .exs { margin-top:auto; padding-top:10px; display:flex; flex-direction:column; gap:6px; } .uses .ex { font-size:13px; } .uses .muted { font-size:13px; }
  @media (max-width:1000px) { .uses { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) { .uses { grid-template-columns:1fr; } }
  .past { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .pastcard { background:var(--paper); border-radius:var(--r); overflow:hidden; color:inherit; font-weight:400; box-shadow:var(--sh-1); transition:box-shadow .15s, transform .15s; }
  .keyask { position:fixed; inset:0; z-index:50; background:rgba(11,16,21,.55); display:grid; place-items:center; padding:16px; }
  .keyask form { background:var(--paper); color:var(--ink); border-radius:var(--r-l); padding:24px; width:min(380px,100%); display:grid; gap:10px; box-shadow:var(--sh-3); }
  .keyask input { font:inherit; padding:12px; border:1px solid var(--line2); border-radius:12px; } .keyask input:focus { outline:none; border-color:var(--accent); box-shadow:var(--focus); }
  .pastcard { position:relative; }
  @media screen { .printonly { display:none; } }
  .followhero { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:32px; align-items:center; background:#000; color:#fff; border-radius:28px; padding:28px; margin:4px 0 18px; }
  .fh-media { position:relative; border-radius:20px; overflow:hidden; aspect-ratio:4/3; background:#111; }
  .fh-media img { width:100%; height:100%; object-fit:cover; display:block; opacity:.92; }
  .fh-pov { position:absolute; top:12px; left:12px; display:inline-flex; align-items:center; gap:6px; background:rgba(11,16,21,.6); backdrop-filter:blur(8px); padding:6px 12px; border-radius:999px; font-size:13px; font-weight:700; }
  .fh-check { position:absolute; top:12px; right:12px; display:inline-flex; align-items:center; gap:6px; background:var(--ok); padding:6px 12px; border-radius:999px; font-size:14px; font-weight:700; }
  .fh-card { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(11,16,21,.72); backdrop-filter:blur(8px); padding:8px 16px; border-radius:14px; font-size:18px; font-weight:800; white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
  .fh-pov .ico, .fh-check .ico { width:16px; height:16px; }
  .fh-copy .kicker { color:#a9b8c6; font-size:14px; font-weight:600; } .fh-copy h2 { font-size:clamp(26px,3vw,36px); font-weight:500; line-height:1.25; margin:6px 0 14px; }
  .fh-steps { margin:0 0 20px; padding-left:20px; color:#cfd9e3; line-height:1.8; } .fh-btns { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .fh-btns .btn { background:rgba(255,255,255,.12); color:#fff; border-color:transparent; } .fh-btns .btn:hover { background:rgba(255,255,255,.2); }
  .pill.big { font-size:17px; padding:14px 24px; border:none; } .pill .ico { width:20px; height:20px; } .fh-note { color:#8d9bab !important; font-size:13px; margin:14px 0 0; }
  .fh-side { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .fh-box { background:var(--paper); border-radius:var(--r); padding:16px 18px; box-shadow:var(--sh-1); display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .fh-box strong { display:inline-flex; align-items:center; gap:6px; } .fh-box .ico { width:18px; height:18px; color:var(--accent); } .fh-box .muted { font-size:13px; }
  .fh-qr { display:flex; align-items:center; gap:12px; } .fh-qr img { border-radius:8px; } .fh-rec { display:flex; align-items:center; gap:6px; font-weight:600; } .fh-rec input { width:18px; height:18px; accent-color:var(--accent); }
  #records { width:100%; }
  .others { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:14px 0; border-top:1px solid var(--line); } .others .btn { padding:6px 12px; font-size:13px; }
  .others .langrow { margin-left:auto; display:inline-flex; align-items:center; gap:8px; }
  @media (max-width:860px) { .followhero, .fh-side { grid-template-columns:1fr; } .followhero { padding:16px; border-radius:22px; } }
  .vrow { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; padding:2px 0 4px; }
  .verifybtn { display:inline-flex; align-items:center; gap:8px; border:2px solid rgba(255,255,255,.35); background:transparent; color:#fff; border-radius:999px; padding:10px 22px; font-size:18px; font-weight:700; min-height:48px; }
  .verifybtn:hover { background:rgba(255,255,255,.1); }
  .vbox { position:fixed; inset:0; z-index:40; background:rgba(11,16,21,.85); display:grid; place-items:center; padding:16px; }
  .vcard { background:var(--paper); color:var(--ink); border-radius:var(--r-l); padding:20px; width:min(720px,100%); display:grid; gap:12px; justify-items:center; text-align:center; box-shadow:var(--sh-3); }
  .vcard video { width:100%; max-height:52vh; border-radius:var(--r); background:#000; object-fit:cover; }
  .vcount { font-size:64px; font-weight:800; line-height:1; color:var(--accent); min-height:64px; } .vmsg { font-weight:600; }
  .vwhich { font-size:13px; color:var(--muted); font-weight:600; }
  .vhead { display:flex; align-items:center; gap:8px; font-size:28px; font-weight:800; } .vhead .ico { width:30px; height:30px; }
  .vcard.ok .vhead { color:var(--ok); } .vcard.diff .vhead { color:var(--warn); } .vcard.wait .vhead { color:var(--ink2); }
  .vpair { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; } .vpair figure { margin:0; } .vpair img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:12px; background:var(--line); }
  .vpair figcaption { font-size:13px; color:var(--muted); margin-top:4px; } .vhint { font-size:22px; font-weight:700; } .vbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .recgrp th { text-align:left; background:var(--accent-soft); font-size:13px; }
  .stuckbox { background:var(--paper); border:1px solid var(--warn); border-radius:var(--r); padding:12px 14px; margin:0 0 12px; display:grid; gap:10px; }
  .stuckrow { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .stuckrow > div { flex:1; min-width:180px; }
  .stuckrow .n { width:26px; height:26px; border-radius:50%; background:var(--warn-soft); color:var(--warn); display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
  .stuckbtns { display:flex; gap:6px; }
  .callbtn { border:1.5px solid rgba(255,255,255,.5); background:rgba(255,255,255,.12); color:#fff; border-radius:999px; padding:10px 18px; font-weight:700; font-size:15px; }
  .callbtn:disabled { opacity:.7; }
  .livebox { background:var(--paper); border-radius:var(--r); box-shadow:var(--sh-1); padding:14px 16px; margin:0 0 16px; display:grid; gap:8px; }
  .liverow { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 10px; border-radius:10px; background:var(--bg); }
  .liverow.call { background:var(--warn-soft); } .liverow.call b { color:var(--warn); }
  .liverow .code { font-family:ui-monospace,monospace; font-weight:700; } .liverow .btn { margin-left:auto; }
  .simwarn { background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; }
  .voicerow { display:flex; flex-wrap:wrap; align-items:center; gap:8px; } .voicerow .btn { padding:4px 12px; font-size:13px; }
  .afterimg { width:96px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; vertical-align:middle; } .more input.wide { flex:1; min-width:200px; }
  .adminlink { margin-top:28px; } .adminlink a { color:var(--muted); font-weight:500; }
  .adminrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 14px; }
  .admintable { width:100%; border-collapse:collapse; background:var(--paper); border-radius:var(--r); overflow:hidden; box-shadow:var(--sh-1); font-size:13px; }
  .admintable th, .admintable td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; } .admintable td:first-child { white-space:normal; }

  if (r.status === 429) toast(T("심사용 키의 오늘 한도를 다 썼어요. 보기는 계속 돼요.", "The judge key has reached today's limit. Viewing still works."));
  if (r.status !== 401 || !o.method || o.method === "GET" || String(u) === "/login") return r;
  if (Date.now() - keyDeclined < 60000) return r;  // 방금 '취소'했으면 1분 동안은 다시 묻지 않는다(자동 저장·따라 하기가 창을 계속 띄우지 않게)
  return (await askKey()) ? rawFetch(u, o) : r;
};
let keyDeclined = 0;
function askKey() {

    const box = document.createElement("div");
    box.className = "keyask";
    box.innerHTML = `<form><b>${T("접속 키가 필요해요", "Access key needed")}</b>
      <span class="muted">${T("보기는 누구나 할 수 있어요. 영상 넣기, 그림 만들기, 따라 하기처럼 비용이 들거나 카드를 바꾸는 일에만 키가 필요해요.", "Anyone can view. Adding videos, drawings, Coach mode and edits need the key, because they cost credits or change cards.")}</span>
      <input type="password" autocomplete="current-password" aria-label="${T("접속 키", "Access key")}" placeholder="${T("접속 키", "Access key")}">
      <span class="red" hidden></span>
      <div><button class="btn primary">${T("확인", "OK")}</button> <button type="button" class="btn">${T("취소", "Cancel")}</button></div></form>`;
    const end = ok => { box.remove(); keyAsk = null; if (!ok) keyDeclined = Date.now(); done(ok); };
    box.querySelector("button[type=button]").onclick = () => end(false);
    box.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      const r = await rawFetch("/login", { method: "POST", body: new URLSearchParams({ k: box.querySelector("input").value }) });
      if (r.ok) return end(true);
      const m = box.querySelector(".red"); m.hidden = false; m.textContent = T("키가 맞지 않아요.", "That key is not right.");
    };
    document.body.append(box); box.querySelector("input").focus();

}

      </div>

    if (done || err) clearInterval(S.poll);

// 프로그램 오류문 대신 할 일을 쉬운 말로
function errText(m) {
  if (/401|403|unauthori|api.?key|MODEL_API_KEY/i.test(m)) return T("Meta API 키가 맞지 않아요. 서버의 MODEL_API_KEY를 확인해 주세요.", "The Meta API key was refused. Check MODEL_API_KEY on the server.");
  if (/다시 시작돼서/.test(m)) return T("서버가 다시 시작돼서 만들던 작업이 끊겼어요. '다시 만들기'를 눌러 주세요.", "The server restarted while making these cards. Press Try again.");
  if (/429|rate/i.test(m)) return T("Meta API 사용량이 잠시 넘쳤어요. 1분쯤 뒤에 다시 해 주세요.", "Too many requests to the Meta API. Try again in a minute.");
  if (/timeout|timed out|connect|network/i.test(m)) return T("Meta API에 연결하지 못했어요. 인터넷을 확인하고 다시 해 주세요.", "Could not reach the Meta API. Check the connection and try again.");
  if (/ffmpeg|ffprobe|invalid data|moov/i.test(m)) return T("영상을 읽지 못했어요. 다른 형식(mp4)으로 다시 넣어 주세요.", "The video could not be read. Try an mp4 file.");
  return T("만들다가 멈췄어요. 다시 해 주세요.", "Making stopped. Please try again.");
}
async function retryRun() {

const FRIENDLY = [
  [/JSON 형식/, "모델 답을 읽지 못했어요. 처음 화면에서 영상을 다시 넣거나 '다시 만들기'를 눌러 주세요.", "The model's answer could not be read. Try making the cards again."],
  [/겹칩니다/, "앞 카드와 시간이 겹쳐요. '시간·물건 고치기'에서 시작이나 끝을 바꿔 주세요.", "Overlaps another card in time. Change the start or end under 'Edit time & object'."],
  [/문장이 비어/, "문장을 써 주세요.", "Write a sentence."],
  [/한국어 문장이 깁니다/, "문장이 길어요. 25자 안으로 줄여 주세요.", "The Korean sentence is too long. Keep it within 25 characters."],
  [/세요'로 끝나야/, "문장 끝을 '~세요'로 맞춰 주세요.", "End the Korean sentence with '~세요' (a polite instruction)."],
  [/동작이 둘/, "한 카드에는 동작 하나만 넣어요. 아래 '+ 여기에 카드 넣기'로 나눠 주세요.", "One action per card. Split it with '+ Add a card here' below."],
  [/대표 시각/, "고른 장면이 이 카드 시간 밖에 있어요. '다른 장면 고르기'로 다시 골라 주세요.", "The chosen photo is outside this card's time. Use 'Choose another frame'."],
  [/영상\(/, "시간이 영상 길이를 벗어났거나 끝이 시작보다 빨라요.", "The time is outside the video, or the end comes before the start."],
  [/영어 문장이 깁니다/, "영어 문장이 길어요.", "The English sentence is too long."],
  [/항목이 없습니다/, "빠진 내용이 있어요.", "Something is missing."],
  [/맞춤법/, m => `맞춤법: ${m.match(/\('(.+)' → '(.+)'\)/).slice(1).join(" → ")} 로 고쳐 주세요.`,
             m => `Korean spelling: change ${m.match(/\('(.+)' → '(.+)'\)/).slice(1).join(" → ")}.`],
];
function problemText(m, withStep) {
  const hit = FRIENDLY.find(([re]) => re.test(m));
  if (!hit) return m;
  const f = ui === "en" ? hit[2] : hit[1], txt = typeof f === "function" ? f(m) : f;
  const k = m.match(/^(\d+)(?:·(\d+))?단계/);
  return withStep && k ? `${T(`${k[2] ? k[1] + "·" + k[2] : k[1]}단계: `, `Step ${k[2] ? k[1] + "–" + k[2] : k[1]}: `)}${txt}` : txt;
}
function issues() {
  const per = {}, global = [], gaps = {};
  for (const m of S.data.problems || []) {
    const k = m.match(/^(\d+)(?:·(\d+))?단계/);
    const f = problemText(m);
    if (!k) { global.push(f); continue; }
    const i = +(k[2] || k[1]) - 1;
    (per[i] = per[i] || []).push(f);
  }
  for (const w of S.data.warnings || []) {
    const k = w.match(/^(\d+)·\d+단계 사이 (\d+)~(\d+)초/);
    if (k) gaps[+k[1] - 1] = [+k[2], +k[3]];
  }
  return { per, global, gaps };
}

async function toggle(which, n) {

  if (which === "strip" && s.has(n) && S.data.stage === "compact" && !S.framesOk) {  // 정리된 묶음은 1초 사진을 사본에서 다시 뽑는다

/* 고친 내용은 저절로 저장하고, 저장할 때마다 서버가 규칙 검사를 다시 한다 */
function setSave(s) { S.saveState = s; const el = $("#saved"); if (el) el.textContent = saveText(); }
function scheduleSave(ms = 700) { clearTimeout(S.saveTimer); setSave("dirty"); S.saveTimer = setTimeout(saveNow, ms); }
function saveNow() {
  clearTimeout(S.saveTimer);
  const cards = JSON.parse(JSON.stringify(S.data.cards)), title = S.data.title ?? "";
  S.saving = S.saving.then(async () => {
    setSave("saving");
    const r = await fetch(`/api/runs/${S.run}/cards`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cards, title }) });
    if (r.status === 401) return setSave("readonly");
    if (r.status === 403) return setSave("others");  // 다른 교사의 카드 묶음
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    Object.assign(S.data, { problems: d.problems, warnings: d.warnings, status: d.status });
    setSave("saved");
    if (S.view === "edit") updateIssues();
  }).catch(() => setSave("error"));
  return S.saving;
}
/* 막힌 카드 돌려보내기: 따라 한 사람들이 자주 막힌 카드를 만든 사람에게 보여 주고, 고칠 안을 Muse Spark 에게 받는다.
   근거는 기록(켜 둔 기기만, 서버가 모음)과 이 기기에서 방금 끝낸 따라 하기(소리·움직임까지 간 카드) */
function stuckHtml() {
  if (S.stuck === undefined) { S.stuck = null; loadStuck(); }
  const list = S.stuck || [], pos = n => S.data.cards.findIndex(c => c.n === n);
  const rows = list.filter(x => pos(x.n) >= 0);
  if (!rows.length) return "";
  return `<div class="stuckbox"><b>${icon("plus")} ${T("따라 한 사람들이 자주 막힌 카드", "Cards people often got stuck on")}</b>
    ${rows.map(x => { const i = pos(x.n), c = S.data.cards[i], why = [
        x.tries ? T(`${x.tries}번 중 ${x.high}번 소리·움직임 도움까지`, `needed sound or motion help ${x.high} of ${x.tries} times`) : "",
        x.miss ? T(`확인에서 '달라요·아직' ${x.miss}번`, `Check said different / not yet ${x.miss} times`) : "",
        x.local ? T("방금 이 기기의 따라 하기", "just now on this device") : ""].filter(Boolean).join(" · ");
      return `<div class="stuckrow"><span class="n">${i + 1}</span><div><span>${esc(text(c))}</span><br><span class="muted">${why}</span></div>
        <span class="stuckbtns"><button class="btn" onclick="document.getElementById('row${i}').scrollIntoView({behavior:'smooth',block:'center'})">${T("카드 보기", "Show card")}</button>
        <button class="btn primary" onclick="fixStuck(${c.n})">${T("고칠 안 받기", "Get a fix")}</button></span></div>`; }).join("")}</div>`;
}
async function loadStuck() {
  let list = [];
  try { const r = await fetch(`/api/runs/${S.run}/stuck`); if (r.ok) list = await r.json(); } catch {}
  try { for (const x of JSON.parse(sessionStorage.getItem("stuck:" + S.run) || "[]")) if (!list.some(y => y.n === x.n)) list.push({ n: x.n, local: true, tries: 0, high: 0, miss: 0 }); } catch {}
  S.stuck = list;
  const b = $("#stuck"); if (b && S.view === "edit") b.innerHTML = stuckHtml();
}
function fixStuck(n) {  // 그 카드 하나만 콕 집어 부탁한다. 결과는 늘 그렇듯 '적용'을 눌러야 바뀐다
  const i = S.data.cards.findIndex(c => c.n === n), x = (S.stuck || []).find(y => y.n === n) || {};
  const why = x.miss ? T("결과가 기준과 자주 달랐어요", "the result often differed from the reference") : T("그림·소리·움직임 도움이 자주 필요했어요", "they often needed picture, sound or motion help");
  $("#askin").value = T(`${i + 1}번 카드에서 따라 하는 사람들이 자주 막혀요(${why}). 이 카드 문장만 더 따라 하기 쉽게 고쳐 주세요: 손에 든 물건과 방향을 정확히, 한 번에 한 동작. 두 동작이 섞여 있으면 메모에 알려 주세요.`,
    `People following these cards often get stuck on card ${i + 1} (${why}). Rewrite only this card so it is easier to follow: name the exact object and direction, one action at a time. If it holds two actions, say so in the note.`);
  if (x.miss && !S.data.cards[i].check) { S.open.add(n); toast(T("확인에서 자주 달랐어요. 카드의 '완료 기준 문장'도 써 주면 정확해져요.", "Checks often differed. Writing a 'done when' sentence on this card also helps.")); }
  $("#askin").closest("form").requestSubmit();
}
// 교사 부탁 → 고칠 안(바뀌는 문장만) → '적용'을 눌러야 바뀐다(되돌리기 가능)
async function askAgent(e) {
  e.preventDefault();
  const q = $("#askin").value.trim(), box = $("#askres");
  if (!q) return;
  await saveNow();
  box.innerHTML = `<div class="askbox muted">${T("Muse Spark가 고치고, 검사기로 확인하는 중…", "Muse Spark is revising and running the checker…")}</div>`;
  let d = null;
  try { const r = await fetch(`/api/runs/${S.run}/agent`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ instruction: q, lang: ui }) }); if (r.ok) d = await r.json(); } catch {}
  if (!d) { box.innerHTML = ""; return toast(T("답을 받지 못했어요. 다시 해 주세요.", "No answer. Please try again.")); }
  S.ask = d;
  box.innerHTML = `<div class="askbox"><b>${esc(d.note || T("고칠 안", "Proposed changes"))}</b>
    <span class="muted">${T(`바뀌는 카드 ${d.changes.length}장 · 검사 ${d.checks}번 · $${d.cost}`, `${d.changes.length} cards change · checker run ${d.checks}× · $${d.cost}`)}</span>
    ${d.changes.map(c => `<div class="askrow"><span class="n">${S.data.cards.findIndex(x => x.n === c.n) + 1}</span><div><s>${esc(c.ko_before)}</s><br><b>${esc(c.ko)}</b><span class="muted"> · ${esc(c.en)}</span></div></div>`).join("")}
    ${d.problems.length ? `<div class="issue">${T("적용하면 검사에 걸리는 곳이 있어요:", "Applying this leaves issues:")} ${esc(d.problems.map(m => problemText(m, true)).join(" / "))}</div>` : ""}
    <div class="askbtns">${d.changes.length ? `<button class="btn primary" onclick="applyAgent()">${T("적용", "Apply")}</button>` : ""}<button class="btn" onclick="$('#askres').innerHTML=''">${T("닫기", "Close")}</button></div></div>`;
}
function applyAgent() {
  const before = snapshot(), by = Object.fromEntries(S.ask.changes.map(c => [c.n, c]));
  S.data.cards.forEach(c => { if (by[c.n]) { c.ko = by[c.n].ko; c.en = by[c.n].en; } });
  $("#askres").innerHTML = ""; changed();
  undoable(T(`카드 ${S.ask.changes.length}장의 문장을 바꿨어요.`, `Changed ${S.ask.changes.length} cards.`), before);
}
function jumpHtml(per) {
  return S.data.cards.map((_, i) => `<button class="${per[i]?.length ? "bad" : ""}" onclick="document.getElementById('row${i}').scrollIntoView({behavior:'smooth',block:'center'})">${i + 1}</button>`).join("");
}
function updateIssues() {
  const { per, global, gaps } = issues();
  const j = $("#jump"); if (j) j.innerHTML = jumpHtml(per);
  $("#chip").innerHTML = chipHtml(Object.keys(per).length + global.length);
  $("#global").innerHTML = global.map(g => `<div class="issue">${esc(g)}</div>`).join("");
  S.data.cards.forEach((c, i) => {
    const iss = per[i] || [];
    $("#row" + i)?.classList.toggle("has-bad", iss.length > 0);
    const box = $("#iss" + i); if (box) box.innerHTML = iss.map(x => `<div class="issue">${esc(x)}</div>`).join("");
    const bar = $("#gap" + i); if (bar) bar.outerHTML = between(i, gaps);
  });
  header();
}
window.addEventListener("beforeunload", e => { if (!["saved", "readonly", "others"].includes(S.saveState)) e.preventDefault(); });

function changed() { S.undo = null; redraw(); saveNow(); }  // 다른 편집이 있으면 옛 되돌리기는 지운다(그사이 고친 것을 날리지 않게)
function redraw() {  // 칸을 고친 채 단추를 누르면 change 가 먼저 와서 화면을 다시 그려 클릭이 사라진다 → 손을 뗀 뒤에 그린다
  if (S.view !== "edit") return;
  if (S.pdown) S.redrawLater = true; else edit();
}
document.addEventListener("pointerdown", () => { S.pdown = true; }, true);
document.addEventListener("pointerup", () => { S.pdown = false; if (S.redrawLater) { S.redrawLater = false; setTimeout(() => S.view === "edit" && edit(), 0); } }, true);
function typed(i, k, el) { S.data.cards[i][k] = el.value; S.undo = null; autosize(el); scheduleSave(); }
function snapshot() { return JSON.parse(JSON.stringify(S.data.cards)); }
function undoable(msg, before) {
  S.undo = before; if (S.view === "edit") edit();
  toast(msg, T("되돌리기", "Undo"), undoLast);
}
function undoLast() { if (!S.undo) return; const u = S.undo; document.querySelector(".toast")?.remove(); S.data.cards = u; changed(); }
function move(i, d) { const before = snapshot(), cs = S.data.cards; [cs[i], cs[i + d]] = [cs[i + d], cs[i]]; changed(); undoable(T("순서를 바꿨어요.", "Order changed."), before); }
function del(i) { const before = snapshot(); S.data.cards.splice(i, 1); changed(); undoable(T("카드를 뺐어요.", "Card removed."), before); }
function merge(i) {
  const before = snapshot(), cs = S.data.cards, a = cs[i], b = cs[i + 1];
  a.start = Math.min(a.start, b.start); a.end = Math.max(a.end, b.end);
  if (!a.ko.trim()) a.ko = b.ko;
  cs.splice(i + 1, 1); changed(); undoable(T("두 카드를 하나로 합쳤어요.", "Cards merged."), before);
}
function setTime(i, k, v) {
  const c = S.data.cards[i];
  c[k] = Math.max(0, Math.round(+v));
  c.rep = Math.min(Math.max(c.rep, c.start), c.end);  // 고른 장면은 카드 시간 안에 둔다
  changed();
}
function setHl(i, on) { S.data.cards[i].hl_off = !on; changed(); }
function previewVoice(i) { stopVoice(); playVoice(S.data.cards[i], false); }
let recState = null;
async function recordVoice(i) {  // 교사만(고치기 화면). 한 번 더 누르면 멈추고 올린다. 최대 15초
  const c = S.data.cards[i], btn = $("#rec" + c.n);
  if (recState) { recState.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return toast(T("마이크를 켤 수 없어요.", "Microphone unavailable.")); }
  const mr = new MediaRecorder(stream), chunks = [];
  recState = mr; btn.textContent = "■ " + T("멈추고 저장", "Stop & save"); btn.classList.add("primary");
  const timer = setTimeout(() => mr.state === "recording" && mr.stop(), 15000);
  mr.ondataavailable = e => chunks.push(e.data);
  mr.onstop = async () => {
    clearTimeout(timer); stream.getTracks().forEach(t => t.stop()); recState = null;
    const type = (mr.mimeType || "audio/webm").split(";")[0], fd = new FormData();
    fd.append("file", new Blob(chunks, { type }), "voice." + (type.includes("mp4") ? "m4a" : type.split("/")[1]));
    const r = await fetch(`/api/runs/${S.run}/cards/${c.n}/voice`, { method: "POST", body: fd });
    if (r.ok) { c.voice = "rec"; c.voiceV = Date.now(); toast(T("녹음을 저장했어요.", "Recording saved.")); } else toast(T("녹음을 저장하지 못했어요.", "Could not save the recording."));
    if (S.view === "edit") edit();
  };
  mr.start();
}
async function deleteVoice(i) {
  const c = S.data.cards[i], r = await fetch(`/api/runs/${S.run}/cards/${c.n}/voice`, { method: "DELETE" });
  if (r.ok) { c.voice = (await r.json()).voice; c.voiceV = Date.now(); if (S.view === "edit") edit(); }
  else toast(r.status === 403 ? T("다른 선생님의 카드 묶음이라 지울 수 없어요.", "This is another teacher's card set, so it can't be deleted.") : T("녹음을 지우지 못했어요. 다시 해 주세요.", "Could not delete the recording. Please try again."));
}
function doneT(c) {  // 완료 기준 시각: 교사가 고른 것, 없으면 카드 끝 뒤 다음 카드 전의 빈 시간(서버 verify.after_t 와 같은 식)
  if (c.done_t != null) return c.done_t;
  const cs = S.data.cards, i = cs.findIndex(x => x.n === c.n), nxt = cs[i + 1]?.start ?? (S.data.duration ?? c.end);
  return nxt - c.end >= 2 ? Math.min(c.end + 2, nxt - 1) : c.end;
}
function setCheck(i, k, v) {  // 확인하기의 완료 기준: 기준 사진 시각(done_t, 카드 시작 ~ 다음 카드 전) 또는 기준 문장
  const c = S.data.cards[i], hi = (S.data.cards[i + 1]?.start ?? (S.data.duration || c.end + 1)) - 1;
  if (k === "done_t") { const t = Math.round(+v); if (!(t >= c.start && t <= Math.max(c.end, hi))) return toast(T(`${c.start}~${Math.max(c.end, hi)}초 안에서 골라 주세요.`, `Pick a time between ${c.start} and ${Math.max(c.end, hi)} s.`), edit()); c.done_t = t; }
  else { c.check = v.trim().slice(0, 80); S.undo = null; return saveNow(); }  // 글만 바뀌니 다시 그리지 않는다(바로 누른 단추가 먹게)
  changed();
}
function setObject(i, v) {
  const c = S.data.cards[i];
  c.object = v.trim(); c.look = "";  // 예전 생김새 설명은 새 이름과 맞지 않을 수 있다
  reframe(i, c.frame_t ?? c.rep);
}
async function reframe(i, t) {
  const c = S.data.cards[i];
  S.busy.set(c.n, T("장면을 바꾸는 중…", "Changing the frame…")); edit();
  await saveNow();
  const r = await fetch(`/api/runs/${S.run}/cards/${c.n}/frame?t=${t}`, { method: "POST" });
  S.busy.delete(c.n);
  if (r.ok) {
    const f = await r.json();
    Object.assign(c, { frame_t: f.frame_t, rep: f.rep, box: f.box, box_prompt: f.box_prompt, box_touches_hand: f.box_touches_hand, ill: f.ill, view: f.view, v: Date.now() });
  } else toast(T("장면을 바꾸지 못했어요. 다시 해 주세요.", "Could not change the frame. Please try again."));
  if (S.view === "edit") edit();
  saveNow();
}
/* 그림 카드(Muse Image): 교사가 카드마다 사진·그림 중 고른다 */
function setView(i, v) { S.data.cards[i].view = v; changed(); }
async function illustrateCard(i, quiet) {
  const c = S.data.cards[i];
  S.busy.set(c.n, T("그림으로 바꾸는 중…", "Drawing…")); if (S.view === "edit") edit();
  await saveNow();
  const r = await fetch(`/api/runs/${S.run}/cards/${c.n}/illustrate`, { method: "POST" });
  S.busy.delete(c.n);
  if (r.ok) { const f = await r.json(); Object.assign(c, { ill: f.ill, view: "ill", v: Date.now() }); }
  else if (!quiet) toast(T("그림을 만들지 못했어요. 다시 해 주세요.", "Could not make the drawing. Please try again."));
  if (S.view === "edit") edit();
  if (!quiet) saveNow();
  return r.ok;
}
function illustrateAll() {
  const n = S.data.cards.filter(c => !c.ill && !S.busy.has(c.n)).length;
  if (!n) return toast(T("모든 카드에 이미 그림이 있어요. 카드마다 '다시 그리기'로 바꿀 수 있어요.", "Every card already has a drawing. Use 'Redraw' on a card to replace one."));
  // 값이 드는 일이라 한 번 더 묻는다. 16장에 59초 걸린 실측(3장씩 동시에)으로 시간을 어림한다
  toast(T(`그림 ${n}장 · 약 $${(n * 0.01).toFixed(2)} · 약 ${Math.ceil(n * 3.7)}초`, `${n} drawings · about $${(n * 0.01).toFixed(2)} · about ${Math.ceil(n * 3.7)} s`), T("만들기", "Make"), illustrateMissing);
}
async function illustrateMissing() {
  const todo = S.data.cards.map((c, i) => [c, i]).filter(([c]) => !c.ill && !S.busy.has(c.n)).map(([, i]) => i);
  let done = 0, fail = 0;
  const worker = async () => { while (todo.length) { const i = todo.shift(); (await illustrateCard(i, true)) ? done++ : fail++; } };
  await Promise.all([worker(), worker(), worker()]);  // 3장씩 동시에
  await saveNow();
  toast(T(`그림 ${done}장을 만들었어요${fail ? ` (${fail}장 실패)` : ""}.`, `Made ${done} drawings${fail ? ` (${fail} failed)` : ""}.`));
}

async function addCard(i) {
  const cs = S.data.cards, prev = cs[i], next = cs[i + 1], dur = S.data.duration || Infinity;
  let start = prev.end + 1, end = next ? next.start - 1 : Math.min(dur - 1, start + 3);
  if (end - start < 1) {  // 붙어 있으면 앞 카드를 반으로 나눠 뒤쪽 절반을 새 카드로(시간이 겹치지 않게)
    if (prev.end - prev.start < 3) return toast(T("여기엔 카드를 넣을 시간이 없어요. 위 카드의 시간을 줄이고 넣어 주세요.", "No time left here. Shorten the card above first."));
    const mid = Math.floor((prev.start + prev.end) / 2);
    start = mid + 1; end = prev.end; prev.end = mid; prev.rep = Math.min(prev.rep, mid);
    if (prev.done_t != null && prev.done_t > mid) delete prev.done_t;
  }
  const n = Math.max(...cs.map(c => c.n)) + 1;
  cs.splice(i + 1, 0, { n, start, end, rep: start, ko: "", en: "", object: "", look: "", image: `cards/${pad(n)}.jpg`, box: null });
  S.strip.add(n);
  await reframe(i + 1, start + Math.floor((end - start) / 2));
  $(`#row${i + 1} textarea.say`)?.focus();
}

/* ③ 인쇄·태블릿 */
function segHtml() {
  return `<span class="seg">${[["ko", "한국어"], ["en", "English"], ["both", T("둘 다", "Both")]].map(([v, l]) =>
    `<button class="${lang === v ? "on" : ""}" onclick="setLang('${v}')">${l}</button>`).join("")}</span>`;
}
function use() {
  const cs = S.data.cards, nIss = (S.data.problems || []).length, pages = Math.ceil(cs.length / 6);
  const title = esc((ui === "en" && S.data.title_en) || S.data.title || "");
  let sheets = "";
  for (let p = 0; p < pages; p++)
    sheets += `<div class="sheet">${title ? `<div class="shead">${title} · ${p + 1}/${pages}</div>` : ""}${cs.slice(p * 6, p * 6 + 6).map((c, j) =>
      `<div class="pcard"><img src="${imgSrc(c)}" alt="${esc(c.ko)}"><div class="n">${p * 6 + j + 1}</div><div class="txt">${text(c)}</div></div>`).join("")}</div>`;
  // 교사용 기록지: 카드마다 한 줄, 날짜 칸에 그날 도움 단계를 손으로 적는다(서버에는 아무것도 남기지 않음)
  const record = `<div class="record"><div class="rhead"><b>${title || T("과제분석 기록지", "Task-analysis record")}</b><span>${T("이름", "Name")} ______________</span></div>
    <div class="rkey">${T("적는 법: ○ 혼자 · 1 글 · 2 그림 · 3 소리 · 4 움직임 · 5 손으로 도움", "Key: ○ on own · 1 text · 2 picture · 3 sound · 4 motion · 5 hands-on help")}</div>
    <table><thead><tr><th>#</th><th></th><th>${T("할 일", "Step")}</th>${"<th>/</th>".repeat(6)}</tr></thead>
    <tbody>${cs.map((c, i) => `<tr><td>${i + 1}</td><td><img src="${imgSrc(c)}" alt=""></td><td>${text(c)}</td>${"<td></td>".repeat(6)}</tr>`).join("")}</tbody></table></div>`;
  // 3번 화면의 중심은 '안경(눈높이) 카메라로 따라 하며 확인하기'. 인쇄·태블릿·보내기는 아래에 작게
  const first = cs[0];

function cardCanvas(c, n, img) {
  const W = 1080, IH = 608, cv = document.createElement("canvas"), g = cv.getContext("2d");
  const font = "-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
  const lines = [[lang === "en" ? c.en : c.ko, 64, 700, "#1c2b33"], ...(lang === "both" ? [[c.en, 40, 400, "#65788a"]] : [])];
  const wrap = (t, size, weight) => {  // 띄어쓰기 단위로 줄바꿈(한국어 낱말이 끊기지 않게)

    return out;

}

async function shareCards(btn) {
  btn.disabled = true;
  try {
    const cs = S.data.cards, name = (S.data.title || "StepCards").replace(/[\\/:*?"<>|]/g, "");
    const imgs = await Promise.all(cs.map(c => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = imgSrc(c); })));
    const cvs = cs.map((c, i) => cardCanvas(c, i + 1, imgs[i]));
    const blob = cv => new Promise(r => cv.toBlob(r, "image/jpeg", 0.88));
    const files = await Promise.all(cvs.map(async (cv, i) => new File([await blob(cv)], `${name}_${pad(i + 1)}.jpg`, { type: "image/jpeg" })));
    if (navigator.canShare?.({ files })) {
      try { return await navigator.share({ files, title: name }); }
      catch (e) { if (e?.name === "AbortError") return; }  // 공유창이 안 열리면(권한 등) 아래 내려받기로

}

const MP_MODEL = "https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite";
const OD = { emb: null, loading: null, index: null };
async function odLoad() {
  return OD.loading ??= (async () => {
    const { FilesetResolver, ImageEmbedder } = await import(`${MP}/vision_bundle.mjs`);
    const files = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
    OD.emb = await ImageEmbedder.createFromOptions(files, { baseOptions: { modelAssetPath: MP_MODEL }, runningMode: "IMAGE", l2Normalize: true });
  })();
}
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
async function odIndex() {  // 시범 사진 → (임베딩, 카드 번호, 카드 안 위치 0~1)
  await odLoad();
  if (OD.index?.run === S.run) return OD.index;
  if (S.data.stage === "compact") await fetch(`/api/runs/${S.run}/frames`, { method: "POST" });
  const cs = S.data.cards, items = [], t0 = performance.now();
  for (let t = 0; t <= (S.data.duration || cs.at(-1).end); t++) {
    const k = cs.findIndex(c => t >= c.start && t <= c.end);
    if (k < 0) continue;  // 카드 사이 빈 시간은 쓰지 않는다
    const img = await loadImg(`/runs/${S.run}/frames/f${pad(t + 1, 3)}.jpg`).catch(() => null);
    if (img) items.push({ e: OD.emb.embed(img).embeddings[0].floatEmbedding, k: k + 1, pos: (t - cs[k].start) / Math.max(1, cs[k].end - cs[k].start) });
  }
  return OD.index = { run: S.run, items, ms: Math.round(performance.now() - t0) };
}
function odGuess(video) {  // 지금 화면이 몇 번 카드와 가장 닮았는지(위 5개 투표)와 그 카드 안 위치
  const e = OD.emb.embed(video).embeddings[0].floatEmbedding;
  const top = OD.index.items.map(it => { let s = 0; for (let j = 0; j < e.length; j++) s += e[j] * it.e[j]; return [s, it]; }).sort((a, b) => b[0] - a[0]).slice(0, 5);
  const votes = {};
  for (const [s, it] of top) votes[it.k] = (votes[it.k] || 0) + s;
  const k = +Object.entries(votes).sort((a, b) => b[1] - a[1])[0][0], mine = top.filter(([, it]) => it.k === k);
  return { k, pos: mine.reduce((a, [, it]) => a + it.pos, 0) / mine.length, sim: top[0][0] };
}
async function odLoop() {
  pill(T("이 기기 모델 준비 중…", "Preparing on-device model…"));
  try { await odIndex(); } catch { pill(T("이 기기 모델을 불러오지 못했어요 · 이전·다음으로 넘겨요", "Could not load the on-device model · use Back and Next")); return; }
  const v = $("#cvid"), hist = [];
  C.odStats = { n: 0, ms: 0 };
  while (C.running && S.view === "coach" && C.where === "device") {
    if (v.readyState >= 2 && !C.checking) {
      const t0 = performance.now(), g = odGuess(v), ms = performance.now() - t0;
      C.odStats.n++; C.odStats.ms += ms;
      hist.push(g); if (hist.length > 8) hist.shift();
      const cur = S.idx + 1, n = S.data.cards.length, count = k => hist.filter(h => h.k === k).length;
      pill(T(`이 기기 · ${Math.round(ms)}ms`, `On device · ${Math.round(ms)} ms`));
      if (hist.length >= 6 && cur < n && count(cur + 1) >= 6) {  // 다음 단계 장면이 1초쯤 이어지면 넘긴다
        S.idx++; hist.length = 0; C.buf = []; $("#cagain").hidden = true; coachCard(); pill(T(`${S.idx + 1}번 카드로 넘겼어요 · 이 기기`, `Moved to card ${S.idx + 1} · on device`));
      } else if (hist.length >= 8 && hist.every(h => h.k > cur + 1) && C.againSaid !== S.idx) {  // 뒤 단계가 계속 보이면 '이 카드부터'
        $("#cagain").hidden = false; glassesSync(true); C.againSaid = S.idx; speak(false, true);
        setTimeout(() => { const a = $("#cagain"); if (a) a.hidden = true; }, 4000);
      } else if (cur === n && hist.length >= 8 && hist.filter(h => h.k === cur && h.pos > 0.8).length >= 6) { coachEnd(true); break; }
    }
    await new Promise(r => setTimeout(r, 150));
  }
}
async function coachLoop() {
  if (C.where === "device") return odLoop();
  while (C.running && S.view === "coach") {
    const cs = S.data.cards, cur = S.idx + 1;
    if (!C.manual && !C.checking && C.buf.length >= 2 && cur <= cs.length) {
      let d = null; const t0 = Date.now();  // 네트워크 오류도 '판단 못 함'으로 보고 계속 본다
      try { const r = await fetch(`/api/runs/${S.run}/coach`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cur, frames: C.buf.slice(), prev_seen: C.prev, local: C.local, live: C.live, ver: S.data.edited_at ?? null }) }); if (r.ok) d = await r.json();
        if (r.status === 401 || r.status === 429) { C.manual = true; pill(T("자동 넘김은 접속 키가 필요해요 · 이전·다음으로 넘겨요", "Auto-advance needs the access key · use Back and Next")); continue; } } catch { d = null; }
      clog("decision", { cur, decision: d?.decision || "none", target: d?.target ?? "", ms: Date.now() - t0 });
      if (!C.running || S.idx + 1 !== cur) continue;  // 그 사이 사람이 직접 넘겼으면 결과는 버린다
      if (!d) { pill(T("판단하지 못했어요 · 다시 보는 중", "No answer · watching again")); }
      else if (d.decision === "reload") {  // 선생님이 카드를 고쳤다: 새 카드를 받고, 보던 카드(번호 n)에서 이어 간다
        const n = cs[S.idx]?.n, r2 = await fetch(`/api/runs/${S.run}/cards`).catch(() => null);
        if (r2?.ok) { S.data = await r2.json(); const k = S.data.cards.findIndex(c => c.n === n); S.idx = k >= 0 ? k : Math.min(S.idx, S.data.cards.length - 1); C.buf = []; C.prev = 0; coachCard(true); pill(T("선생님이 고친 카드로 바꿨어요", "Updated to the teacher's latest cards")); }
      }
      else {
        C.prev = d.seen;
        liveCheck(d);
        C.fin = d.decision === "finished" ? (C.fin || 0) + 1 : 0;
        if (C.fin >= 2) { coachEnd(true); break; }  // 마지막 단계를 마쳤다는 판단이 두 번 연속
        const to = d.decision === "next" ? cur + 1 : d.decision === "jump" ? d.target : 0;
        if (Number.isInteger(to) && to >= 1 && to <= cs.length) {  // 없는 카드 번호는 무시
          S.idx = to - 1; clog("card", { cur, to, by: "auto" });
          C.buf = []; C.prev = 0; $("#cagain").hidden = true; coachCard(); pill(T(`${S.idx + 1}번 카드로 넘겼어요`, `Moved to card ${S.idx + 1}`));
        }
        else if (d.decision === "again") {
          $("#cagain").hidden = false; glassesSync(true); if (C.againSaid !== S.idx) { C.againSaid = S.idx; speak(false, true); } C.buf = []; clearTimeout(C.againTimer); C.againTimer = setTimeout(() => { const a = $("#cagain"); if (a) a.hidden = true; }, 4000);
          watching(d);
        } else watching(d);
      }
    }
    await new Promise(r => setTimeout(r, 1500));
  }
}
/* 실시간 확인: 따라 하기 판단(2~4초마다)에 지금 카드의 기준 사진을 같이 넣어, 결과가 기준과 다르면 막지 않고 알려 준다.
   '달라요'가 두 번 연속일 때만(한 번은 잘못 볼 수 있어서), 카드마다 한 번 말하고 도움을 한 칸 올린다 */
C.live = (() => { try { return localStorage.getItem("live") !== "off"; } catch { return true; } })();
function setLive(on) { C.live = on; try { localStorage.setItem("live", on ? "on" : "off"); } catch {} }
function liveCheck(d) {
  if (!d.state || C.checking) return;
  const box = $("#clive");
  if (d.state !== "different") { C.diffN = 0; if (d.state === "done" && box) box.hidden = true; return; }
  if (++C.diffN < 2 || C.diffFor === S.idx || !box) return;
  C.diffFor = S.idx; callMaker("auto");
  const c = S.data.cards[S.idx], hint = ui === "en" ? d.hint_en : d.hint_ko;
  box.innerHTML = `<img src="/api/runs/${S.run}/cards/${c.n}/after.jpg?t=${doneT(c)}" alt=""><div><b>${T("이렇게 되면 돼요", "It should look like this")}</b><span>${esc(hint)}</span></div>
    <button onclick="this.parentElement.hidden=true" aria-label="${T("닫기", "Close")}">${icon("x")}</button>`;
  box.hidden = false;
  if (C.voice && window.speechSynthesis) { speechSynthesis.cancel(); speechSynthesis.speak(utter(hint, ui === "en" ? "en-US" : "ko-KR")); }
  if (C.help) helpUp(true);

}
const IDLE_MIN = 5;
function coachPause() {  // 카메라와 판단만 멈춘다(카드·안경 맞추기는 그대로). '다시 시작'으로 이어서
  C.running = false; clearInterval(C.timer); clearInterval(C.helpTimer);
  C.stream?.getTracks().forEach(t => t.stop()); C.stream = null; C.lock?.release().catch(() => {}); C.lock = null;
  $(".coachv")?.insertAdjacentHTML("beforeend", `<div class="cstart" id="cpause"><div class="glyph">${icon("glasses")}</div>
    <div class="t">${T("잠시 멈췄어요", "Paused")}</div>
    <div class="d">${T(`${IDLE_MIN}분 동안 다음 카드로 넘어가지 않아서 카메라를 껐어요. 카메라가 꺼진 동안은 비용이 들지 않아요.`, `No step change for ${IDLE_MIN} minutes, so the camera is off and nothing is being spent.`)}</div>
    <button class="navb next" onclick="document.getElementById('cpause').remove();coachCamera()">${T("다시 시작", "Resume")}</button></div>`);
  pill(T("멈춤", "Paused"));
}
function stopCoach(keepSync) {  // keepSync: 끝 화면에서도 안경의 '처음으로'를 받는다
  C.running = false; clearInterval(C.timer); if (!keepSync) clearInterval(C.sync); clearInterval(C.helpTimer); C.started = false;
  window.speechSynthesis?.cancel(); C.lock?.release().catch(() => {}); C.lock = null; clearTimeout(C.againTimer);
  C.stream?.getTracks().forEach(t => t.stop()); C.stream = null;
}

function dotsHtml(n, idx) {  // 카드가 많으면 점이 넘쳐서 숫자만
  return n > 15 ? "" : `<div class="dots">${Array.from({ length: n }, (_, j) => `<i class="${j === idx ? "on" : ""}"></i>`).join("")}</div>`;
}
function flip(d) { stopVoice(); S.idx = Math.max(0, Math.min(S.data.cards.length - 1, S.idx + d)); tablet(); }
document.addEventListener("keydown", e => {
  if ($("#vbox")) { if (e.key === "Escape") closeVerify(); return; }
  if (S.view === "coach") { if ($("#csum")) return; if (e.key === "ArrowRight") coachFlip(1); if (e.key === "ArrowLeft") coachFlip(-1); if (e.key === "Escape") coachExit(); return; }
