<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StepCards</title>
<style>
  :root { --bg:#f7f6f2; --card:#fff; --ink:#1f1f1f; --muted:#6b6b6b; --line:#dedbd2; --accent:#e07a1f; --bad:#c0392b; --warn:#a67c00; --ok:#2e7d32; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--ink); word-break:keep-all; }
  header { display:flex; gap:12px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 12px 0 0; cursor:pointer; }
  nav button, .btn { border:1px solid var(--line); background:var(--card); padding:7px 12px; border-radius:8px; font-size:14px; cursor:pointer; }
  nav button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn:disabled { opacity:.5; cursor:default; }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  .muted { color:var(--muted); font-size:13px; }
  .banner { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
  .banner.bad { background:#fdecea; color:var(--bad); } .banner.warn { background:#fff6d6; color:var(--warn); } .banner.ok { background:#e8f5e9; color:var(--ok); }
  .banner ul { margin:6px 0 0; padding-left:18px; }
  /* 처음 화면 */
  .runs a { display:block; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:8px; color:inherit; text-decoration:none; }
  /* 진행판 */
  .ev { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .ev .stage { width:90px; flex:none; font-weight:600; }
  .ev ul { margin:4px 0 0; padding-left:18px; color:var(--bad); font-size:13px; }
  /* 편집 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative; }
  .card img { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; background:#ddd; }
  .num { position:absolute; top:8px; left:8px; background:var(--ink); color:#fff; border-radius:50%; width:30px; height:30px; display:grid; place-items:center; font-weight:700; }
  .card .body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; }
  .card textarea { width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; resize:vertical; }
  .card textarea.ko { font-size:17px; font-weight:600; }
  .card .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .card .row .btn { padding:4px 8px; font-size:13px; }
  .card input[type=number] { width:64px; padding:4px; border:1px solid var(--line); border-radius:6px; }
  /* 인쇄 */
  .print-grid { display:grid; grid-template-columns:1fr 1fr; gap:8mm; }
  .pcard { border:2px solid var(--ink); border-radius:10px; overflow:hidden; break-inside:avoid; position:relative; background:#fff; }
  .pcard img { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; }
  .pcard .txt { padding:8px 12px 10px; font-size:20px; font-weight:700; min-height:62px; }
  .pcard .en, .tab .en { display:block; font-size:.7em; font-weight:400; color:var(--muted); margin-top:2px; }
  .pagebreak { break-after:page; grid-column:1/-1; height:0; }
  @page { size:A4; margin:10mm; }
  @media print { header, .noprint { display:none !important; } main { padding:0; max-width:none; } body { background:#fff; } }
  /* 태블릿 */
  .tab { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .tab img { width:100%; max-width:960px; border-radius:16px; }
  .tab .txt { font-size:clamp(26px,4vw,44px); font-weight:700; text-align:center; }
  .tab .nav { display:flex; gap:16px; align-items:center; font-size:20px; }
  .tab .nav .btn { font-size:22px; padding:14px 28px; border-radius:14px; }
</style>
</head>
<body>
<header>
  <h1 onclick="go({})">StepCards</h1>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <label class="muted">문장
    <select id="lang" onchange="setLang(this.value)">
      <option value="ko">한국어</option><option value="en">English</option><option value="both">한국어+English</option>
    </select>
  </label>
</header>
<main id="main"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let state = { run: null, view: null, data: null, dirty: false, poll: null, idx: 0 };
let lang = (() => { try { return localStorage.getItem("lang") || "ko"; } catch { return "ko"; } })();
$("#lang").value = lang;

function setLang(v) { lang = v; try { localStorage.setItem("lang", v); } catch {} render(); }
function text(c) {
  if (lang === "en") return esc(c.en);
  if (lang === "both") return `${esc(c.ko)}<span class="en">${esc(c.en)}</span>`;
  return esc(c.ko);
}
function imgSrc(c) {
  const hl = c.box && !c.hl_off ? c.image.replace(".jpg", "_hl.jpg") : c.image;
  return `/runs/${state.run}/${hl}?v=${c.v || 0}`;
}
function go(p) { location.hash = new URLSearchParams(p).toString(); }
window.addEventListener("hashchange", route);

async function route() {
  clearInterval(state.poll);
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("run") !== state.run) { state.dirty = false; state.idx = 0; }
  state.run = p.get("run"); state.view = p.get("view") || "progress";
  if (state.run) {
    const r = await fetch(`/api/runs/${state.run}/cards`);
    if (r.ok && !state.dirty) state.data = await r.json();
    else if (!r.ok) state.data = null;
  }
  render();
}

function render() {
  const views = [["progress","진행판"],["edit","편집"],["print","인쇄"],["tablet","태블릿"]];
  $("#nav").innerHTML = state.run ? views.map(([v, l]) =>
    `<button class="${state.view === v ? "on" : ""}" onclick="go({run:'${state.run}',view:'${v}'})">${l}</button>`).join(" ") : "";
  if (!state.run) return home();
  if (state.view !== "progress" && !state.data) { state.view = "progress"; }
  ({ progress, edit, print: printView, tablet })[state.view]();
}

/* 처음 화면: 영상 올리기 + 지난 실행 */
async function home() {
  const runs = await (await fetch("/api/runs")).json();
  $("#main").innerHTML = `
    <h2>영상 올리기</h2>
    <p class="muted">손 동작이 보이는 1~5분 영상. 학생이 나오는 영상은 올리지 마세요.</p>
    <form id="up"><input type="file" name="file" accept="video/*" required> <button class="btn primary">카드 만들기</button></form>
    <h2>지난 실행</h2>
    <div class="runs">${runs.map(r => `<a href="#run=${r.id}&view=${r.done ? "edit" : "progress"}">${esc(r.video)} <span class="muted">${r.id} · ${r.done ? "완료" : "진행 중"}</span></a>`).join("") || '<p class="muted">없음</p>'}</div>`;
  $("#up").onsubmit = async e => {
    e.preventDefault();
    e.submitter.disabled = true; e.submitter.textContent = "올리는 중…";
    const r = await fetch("/api/upload", { method: "POST", body: new FormData(e.target) });
    const { id } = await r.json();
    go({ run: id, view: "progress" });
  };
}

/* 진행판 */
const STAGE = { start:"시작", extract:"사진 뽑기", split:"단계 나누기", highlight:"물건 강조", done:"완료" };
async function progress() {
  const draw = async () => {
    const p = await (await fetch(`/api/runs/${state.run}/progress`)).json();
    const ev = p.events || [];
    const done = ev.some(e => e.stage === "done");
    const cost = ev.reduce((s, e) => s + (e.cost || 0), 0);
    $("#main").innerHTML = `
      <h2>${esc(p.video || "")} ${done ? "" : '<span class="muted">진행 중…</span>'}</h2>
      <p class="muted">모델 비용 합계 약 $${cost.toFixed(3)}</p>
      ${done ? `<p><button class="btn primary" onclick="go({run:'${state.run}',view:'edit'})">카드 편집하기</button></p>` : ""}
      ${ev.map(e => `<div class="ev"><div class="stage">${STAGE[e.stage] || e.stage}</div><div>${esc(e.msg)}
        ${(e.problems || []).length ? `<div class="muted">검사에서 걸린 것 → 이유를 붙여 다시 요청</div><ul>${e.problems.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div></div>`).join("")}`;
    if (done) { clearInterval(state.poll); if (!state.data) { const r = await fetch(`/api/runs/${state.run}/cards`); if (r.ok) state.data = await r.json(); } }
  };
  await draw();
  state.poll = setInterval(draw, 1200);
}

/* 편집 */
function banner() {
  const d = state.data;
  const pr = d.problems || [], wr = d.warnings || [];
  return (pr.length ? `<div class="banner bad">사람 확인 필요<ul>${pr.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : `<div class="banner ok">검사 통과</div>`)
    + (wr.length ? `<div class="banner warn">참고<ul>${wr.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "");
}
function edit() {
  const cs = state.data.cards;
  $("#main").innerHTML = `
    <div class="row noprint" style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <button class="btn primary" id="save" ${state.dirty ? "" : "disabled"} onclick="save()">${state.dirty ? "저장하고 검사" : "저장됨"}</button>
      <span class="muted">카드 ${cs.length}장 · 문장을 고치거나 순서를 바꾼 뒤 저장하면 검사기가 다시 확인합니다.</span>
    </div>
    ${banner()}
    <div class="grid">${cs.map((c, i) => `
      <div class="card">
        <img src="${imgSrc(c)}" alt="" onerror="this.style.visibility='hidden'">
        <div class="num">${i + 1}</div>
        <div class="body">
          <textarea class="ko" rows="2" oninput="upd(${i},'ko',this.value)">${esc(c.ko)}</textarea>
          <textarea rows="1" oninput="upd(${i},'en',this.value)">${esc(c.en)}</textarea>
          <div class="row">
            <span class="muted">구간</span>
            <input type="number" min="0" value="${c.start}" onchange="setTime(${i},'start',this.value)"> <span class="muted">~</span>
            <input type="number" min="0" value="${c.end}" onchange="setTime(${i},'end',this.value)"> <span class="muted">초</span>
          </div>
          <div class="row">
            <span class="muted">손에 든 물건</span>
            <input type="text" value="${esc(c.object)}" oninput="upd(${i},'object',this.value)" placeholder="영어로, 예: glass cup" style="flex:1;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:6px">
            ${c.box ? "" : '<span class="muted">강조 없음</span>'}
          </div>
          <div class="row">
            <button class="btn" onclick="move(${i},-1)" ${i ? "" : "disabled"}>↑</button>
            <button class="btn" onclick="move(${i},1)" ${i < cs.length - 1 ? "" : "disabled"}>↓</button>
            <button class="btn" onclick="merge(${i})" ${i < cs.length - 1 ? "" : "disabled"}>아래와 합치기</button>
            <button class="btn" onclick="del(${i})">빼기</button>
            <button class="btn" onclick="addCard(${i})">아래에 추가</button>
            ${c.box ? `<label class="muted"><input type="checkbox" ${c.hl_off ? "" : "checked"} onchange="upd(${i},'hl_off',!this.checked,true)"> 강조</label>` : ""}
          </div>
          <div class="row">
            <span class="muted">사진</span>
            <input type="number" id="t${i}" min="${c.start}" max="${c.end}" value="${c.frame_t ?? c.rep}"> <span class="muted">초</span>
            <button class="btn" id="rf${i}" onclick="reframe(${i}, +$('#t${i}').value)">이 장면으로</button>
          </div>
        </div>
      </div>`).join("")}</div>`;
}
function markDirty(redraw) { state.dirty = true; const b = $("#save"); if (b) { b.disabled = false; b.textContent = "저장하고 검사"; } if (redraw) edit(); }
function upd(i, k, v, redraw) { state.data.cards[i][k] = v; markDirty(redraw); }
function move(i, d) { const cs = state.data.cards; [cs[i], cs[i + d]] = [cs[i + d], cs[i]]; markDirty(true); }
function del(i) { state.data.cards.splice(i, 1); markDirty(true); }
function setTime(i, k, v) {
  const c = state.data.cards[i];
  c[k] = Math.max(0, Math.round(+v));
  c.rep = Math.min(Math.max(c.rep, c.start), c.end);  // 대표 시각은 구간 안에 둔다
  markDirty(true);
}
async function addCard(i) {
  const cs = state.data.cards, prev = cs[i], next = cs[i + 1];
  const start = prev.end + 1;
  const end = Math.max(start, next ? next.start - 1 : Math.min(state.data.duration ?? start + 3, start + 3));
  const n = Math.max(...cs.map(c => c.n)) + 1;
  cs.splice(i + 1, 0, { n, start, end, rep: start, ko: "", en: "", object: "", look: "", image: `cards/${String(n).padStart(2, "0")}.jpg`, box: null });
  markDirty(true);
  await reframe(i + 1, start);
}
function merge(i) {
  const cs = state.data.cards, a = cs[i], b = cs[i + 1];
  a.start = Math.min(a.start, b.start); a.end = Math.max(a.end, b.end);
  cs.splice(i + 1, 1); markDirty(true);
}
async function save() {
  const r = await fetch(`/api/runs/${state.run}/cards`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cards: state.data.cards }) });
  state.data = await r.json(); state.dirty = false; edit();
}
async function reframe(i, t) {
  const c = state.data.cards[i];
  if (state.dirty) await save();
  const btn = $("#rf" + i); if (btn) { btn.disabled = true; btn.textContent = "찾는 중…"; }
  const r = await fetch(`/api/runs/${state.run}/cards/${c.n}/frame?t=${t}`, { method: "POST" });
  Object.assign(state.data.cards[i], await r.json(), { v: Date.now() });
  edit();
}

/* 인쇄: A4 한 장에 6장 */
function printView() {
  const cs = state.data.cards;
  $("#main").innerHTML = `
    <p class="noprint"><button class="btn primary" onclick="window.print()">인쇄</button> <span class="muted">A4 한 장에 카드 6장</span></p>
    <div class="print-grid">${cs.map((c, i) => `
      <div class="pcard"><img src="${imgSrc(c)}" alt=""><div class="num">${i + 1}</div><div class="txt">${text(c)}</div></div>
      ${(i + 1) % 6 === 0 && i < cs.length - 1 ? '<div class="pagebreak"></div>' : ""}`).join("")}</div>`;
}

/* 태블릿: 한 장씩 넘기기 */
function tablet() {
  const cs = state.data.cards;
  state.idx = Math.min(state.idx, cs.length - 1);
  const c = cs[state.idx];
  $("#main").innerHTML = `
    <div class="tab">
      <img src="${imgSrc(c)}" alt="">
      <div class="txt">${text(c)}</div>
      <div class="nav">
        <button class="btn" onclick="flip(-1)" ${state.idx ? "" : "disabled"}>◀ 이전</button>
        <span>${state.idx + 1} / ${cs.length}</span>
        <button class="btn" onclick="flip(1)" ${state.idx < cs.length - 1 ? "" : "disabled"}>다음 ▶</button>
      </div>
    </div>`;
}
function flip(d) { state.idx = Math.max(0, Math.min(state.data.cards.length - 1, state.idx + d)); tablet(); }
document.addEventListener("keydown", e => { if (state.view === "tablet" && state.data) { if (e.key === "ArrowRight") flip(1); if (e.key === "ArrowLeft") flip(-1); } });
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; });
document.addEventListener("touchend", e => { if (state.view === "tablet" && touchX !== null) { const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 60) flip(dx < 0 ? 1 : -1); } touchX = null; });
window.addEventListener("beforeunload", e => { if (state.dirty) e.preventDefault(); });

route();
</script>
</body>
</html>
