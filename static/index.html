<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>StepCards</title>
<style>
  :root {
    --bg:#f1f4f7; --paper:#fff; --raised:#f7f9fb; --ink:#1c2b33; --ink2:#344854; --muted:#65788a; --line:#dde3e9; --line2:#cbd2d9;
    --accent:#0064e0; --accent-h:#0052ba; --accent-soft:#e7f0fd; --accent-ink:#0050b5;
    --bad:#c4122f; --bad-soft:#fdecef; --ok:#0a7a35; --ok-soft:#e6f4eb; --warn:#8a5600; --warn-soft:#fff3d9;
    --dark:#0b1015; --dark2:#1a222a; --dark3:#2a343e;
    --r-s:10px; --r:16px; --r-l:24px;
    --sh-1:0 1px 2px rgba(28,43,51,.06), 0 1px 3px rgba(28,43,51,.05);
    --sh-2:0 4px 12px rgba(28,43,51,.08), 0 1px 3px rgba(28,43,51,.06);
    --sh-3:0 12px 32px rgba(28,43,51,.14);
    --focus:0 0 0 3px rgba(0,100,224,.35);
    --hh:64px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); word-break:keep-all; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.005em; }
  button { font:inherit; cursor:pointer; color:inherit; }
  :focus-visible { outline:none; box-shadow:var(--focus); }
  a { color:var(--accent); text-decoration:none; font-weight:600; } a:hover { text-decoration:underline; }
  .ico { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-4px; }

  /* 위쪽 막대 */
  header { display:flex; align-items:center; gap:20px; padding:0 24px; height:var(--hh); background:rgba(255,255,255,.92); backdrop-filter:saturate(1.8) blur(16px);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; cursor:pointer; letter-spacing:-.02em; flex:none; }
  .logo .mark { width:32px; height:32px; border-radius:9px; background:var(--accent); display:grid; place-items:center; }
  .logo .mark svg { width:20px; height:20px; }
  .steps { display:flex; align-items:center; gap:2px; margin:0 auto; background:var(--bg); padding:4px; border-radius:999px; }
  .step { display:flex; align-items:center; gap:8px; padding:7px 14px 7px 8px; border-radius:999px; border:none; background:none; color:var(--muted); font-size:14px; font-weight:600; transition:background .15s, color .15s; }
  .step .dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--ink2); font-size:12px; font-weight:700; }
  .step:hover:not(:disabled):not(.on) { color:var(--ink); }
  .step.on { background:var(--paper); color:var(--ink); box-shadow:var(--sh-1); } .step.on .dot { background:var(--accent); color:#fff; }
  .step.done .dot { background:var(--ok); color:#fff; }
  .step:disabled { opacity:.45; cursor:default; }
  .arrow { display:none; }
  main { max-width:1120px; margin:0 auto; padding:32px 24px 64px; }
  h2 { margin:0 0 6px; font-size:28px; line-height:1.25; font-weight:700; letter-spacing:-.025em; } h3 { margin:40px 0 14px; font-size:18px; font-weight:700; letter-spacing:-.015em; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:16px; max-width:680px; }
  .muted { color:var(--muted); font-size:14px; } .red { color:var(--bad); font-weight:600; }
  .eyebrow { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:4px 10px; border-radius:999px; margin-bottom:14px; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2); background:var(--paper); padding:8px 16px; border-radius:999px; font-size:14px; font-weight:600; color:var(--ink); transition:background .15s, border-color .15s; }
  .btn:hover:not(:disabled) { background:var(--raised); border-color:var(--muted); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover:not(:disabled) { background:var(--accent-h); border-color:var(--accent-h); }
  .btn.big { padding:14px 26px; font-size:16px; }
  .btn:disabled { opacity:.4; cursor:default; }
  .issue { display:flex; gap:8px; align-items:flex-start; padding:10px 14px; border-radius:var(--r-s); background:var(--bad-soft); color:var(--bad); font-size:14px; font-weight:500; margin:8px 0; }
  .issue::before { content:"!"; flex:none; width:18px; height:18px; border-radius:50%; background:var(--bad); color:#fff; font-size:12px; font-weight:800; display:grid; place-items:center; margin-top:1px; }

  /* 처음 화면 */
  .hero { display:grid; grid-template-columns:1.05fr 1fr; gap:32px; align-items:center; margin-bottom:8px; }
  .hero h2 { font-size:40px; letter-spacing:-.035em; }
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--line2); border-radius:var(--r-l); background:var(--paper); padding:48px 24px; text-align:center; cursor:pointer; transition:.15s; box-shadow:var(--sh-1); min-height:280px; }
  .drop:hover, .drop.over { border-color:var(--accent); background:var(--accent-soft); }
  .drop .big { font-size:18px; font-weight:700; }
  .drop .plus { width:64px; height:64px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; margin-bottom:8px; box-shadow:0 6px 16px rgba(0,100,224,.3); }
  .drop .plus svg { width:28px; height:28px; stroke-width:2.2; }
  .drop .btn { margin-top:10px; pointer-events:none; }
  .flow { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:40px 0 8px; }
  .flow div { background:var(--paper); border-radius:var(--r); padding:20px; box-shadow:var(--sh-1); }
  .flow .fi { width:40px; height:40px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin-bottom:12px; }
  .flow .fi .ico { width:22px; height:22px; }
  .flow strong { display:block; font-size:16px; margin-bottom:2px; }
  .uses { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .uses div { background:var(--paper); border-radius:var(--r); padding:16px; box-shadow:var(--sh-1); display:flex; flex-direction:column; gap:4px; }
  .uses div:first-child { background:var(--dark); color:#fff; } .uses div:first-child .muted { color:#a9b8c6; } .uses div:first-child .fi { background:var(--accent); color:#fff; }
  .uses .fi { width:36px; height:36px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin-bottom:6px; }
  .uses strong { font-size:15px; } .uses .muted { font-size:13px; }
  @media (max-width:1000px) { .uses { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) { .uses { grid-template-columns:1fr; } }
  .past { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .pastcard { background:var(--paper); border-radius:var(--r); overflow:hidden; color:inherit; font-weight:400; box-shadow:var(--sh-1); transition:box-shadow .15s, transform .15s; }
  .pastcard:hover { box-shadow:var(--sh-2); transform:translateY(-2px); text-decoration:none; }
  .pastcard img, .pastcard .ph { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--line); }
  .pt { padding:12px 16px 14px; display:flex; flex-direction:column; gap:2px; } .pt strong { font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 만드는 중 */
  .stages { display:grid; gap:0; margin:8px 0 24px; background:var(--paper); border-radius:var(--r); box-shadow:var(--sh-1); overflow:hidden; }
  .stage { display:flex; gap:16px; align-items:flex-start; padding:18px 20px; border-bottom:1px solid var(--line); }
  .stage:last-child { border-bottom:none; }
  .stage .ic { width:28px; height:28px; border-radius:50%; flex:none; border:2.5px solid var(--line); display:grid; place-items:center; font-size:14px; font-weight:700; }
  .stage.done .ic { background:var(--ok); border-color:var(--ok); color:#fff; } .stage.done .ic::after { content:"✓"; }
  .stage.now { background:var(--accent-soft); } .stage.now .ic { border-color:var(--accent); border-top-color:transparent; animation:spin .9s linear infinite; }
  .stage.wait { opacity:.5; }
  .stage strong { font-size:15px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .prog { height:6px; background:rgba(0,100,224,.15); border-radius:99px; overflow:hidden; margin:10px 0 4px; width:min(420px,100%); }
  .prog i { display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s; }
  .detail { font-size:14px; margin-top:8px; color:var(--warn); background:var(--warn-soft); padding:10px 12px; border-radius:var(--r-s); } .detail ul { margin:4px 0 0; padding-left:18px; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px; margin-bottom:24px; }
  .thumbs img { width:100%; border-radius:var(--r-s); aspect-ratio:16/9; object-fit:cover; box-shadow:var(--sh-1); }
  .log { margin-top:32px; font-size:13px; color:var(--muted); } .log summary { cursor:pointer; font-weight:600; }

  /* 확인·고치기 */
  .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:var(--hh); background:rgba(241,244,247,.92); backdrop-filter:blur(12px); padding:14px 0; z-index:5; margin-top:-14px; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:700; border:none; }
  .chip.ok { background:var(--ok-soft); color:var(--ok); } .chip.bad { background:var(--bad-soft); color:var(--bad); }
  .saved { color:var(--muted); font-size:13px; }
  .hint { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .list { display:flex; flex-direction:column; }
  .row { position:relative; display:grid; grid-template-columns:36px minmax(220px,340px) 1fr; gap:20px; background:var(--paper); border-radius:var(--r-l); padding:18px; align-items:start; box-shadow:var(--sh-1); transition:box-shadow .15s; }
  .row:hover { box-shadow:var(--sh-2); }
  .row.has-bad { box-shadow:0 0 0 2px var(--bad), var(--sh-1); }
  .n { width:32px; height:32px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px; }
  .pic { position:relative; border-radius:var(--r); overflow:hidden; background:var(--line); aspect-ratio:16/9; }
  .pic img { width:100%; height:100%; object-fit:cover; display:block; }
  .pic .busy { position:absolute; inset:0; background:rgba(255,255,255,.8); backdrop-filter:blur(2px); display:grid; place-items:center; font-weight:600; color:var(--accent-ink); }
  .picbar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .seg.mini button { padding:4px 12px; font-size:13px; }
  .linkbtn { display:inline-flex; align-items:center; gap:4px; background:none; border:none; color:var(--accent); padding:6px 2px; font-size:14px; font-weight:600; border-radius:8px; }
  .linkbtn:hover:not(:disabled) { color:var(--accent-h); }
  .linkbtn .ico { width:18px; height:18px; }
  textarea.say { width:100%; border:1.5px solid transparent; border-radius:var(--r-s); padding:6px 10px; font:inherit; font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.35; resize:none; background:transparent; color:var(--ink); overflow:hidden; transition:background .15s, border-color .15s; }
  textarea.say:hover { background:var(--raised); }
  textarea.say:focus { outline:none; border-color:var(--accent); background:#fff; box-shadow:var(--focus); }
  textarea.say.en { font-size:15px; font-weight:500; color:var(--muted); letter-spacing:0; }
  textarea.say::placeholder { color:#a9b5c0; }
  .meta { color:var(--muted); font-size:13px; padding:4px 10px; }
  .row .issue { margin:8px 10px 0; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; padding:0 10px; }
  .actions .btn { padding:6px 12px; font-size:13px; }
  .more { margin:12px 10px 0; padding:14px 16px; border-radius:var(--r); background:var(--raised); border:1px solid var(--line); display:grid; gap:12px; font-size:14px; }
  .more label { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .more input { padding:7px 10px; border:1px solid var(--line2); border-radius:var(--r-s); font:inherit; background:#fff; color:var(--ink); }
  .more input:focus { outline:none; border-color:var(--accent); box-shadow:var(--focus); }
  .more input[type=number] { width:80px; } .more input[type=checkbox] { accent-color:var(--accent); width:18px; height:18px; }
  .strip { grid-column:1/-1; display:flex; gap:8px; overflow-x:auto; padding:6px 0 8px; scrollbar-width:thin; }
  .strip button { flex:none; border:3px solid transparent; border-radius:12px; padding:0; background:none; position:relative; transition:border-color .15s; }
  .strip button:hover { border-color:var(--line2); }
  .strip button.cur { border-color:var(--accent); }
  .strip img { width:132px; display:block; border-radius:9px; }
  .strip span { position:absolute; bottom:5px; right:6px; background:rgba(11,16,21,.7); color:#fff; font-size:11px; font-weight:600; padding:1px 6px; border-radius:6px; }
  .between { display:flex; justify-content:center; align-items:center; gap:8px; padding:8px 0; flex-wrap:wrap; opacity:0; transition:opacity .15s; }
  .between:hover, .between:focus-within, .between.gap { opacity:1; }
  .between .btn { padding:5px 14px; font-size:13px; background:var(--paper); border-color:var(--line); color:var(--ink2); }
  .between.gap .note { color:var(--warn); background:var(--warn-soft); padding:4px 12px; border-radius:999px; font-size:13px; font-weight:600; }
  .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; display:flex; gap:16px; align-items:center; z-index:30; font-size:14px; box-shadow:var(--sh-3); animation:up .2s ease-out; }
  .toast button { background:none; border:none; color:#7fb6ff; font-weight:700; }
  @keyframes up { from { opacity:0; transform:translate(-50%,8px); } }

  /* 인쇄·태블릿 */
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:16px 0 24px; }
  .choice { display:flex; flex-direction:column; align-items:flex-start; gap:4px; background:var(--paper); border:none; border-radius:var(--r-l); padding:22px; text-align:left; color:var(--ink); box-shadow:var(--sh-1); transition:box-shadow .15s, transform .15s; }
  .choice:hover { box-shadow:var(--sh-2); transform:translateY(-2px); }
  .choice .ci { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); margin-bottom:10px; }
  .choice .ci .ico { width:24px; height:24px; }
  .choice.feat { background:var(--dark); color:#fff; } .choice.feat .ci { background:var(--accent); color:#fff; } .choice.feat .d { color:#a9b8c6; }
  .choice .t { font-size:18px; font-weight:700; letter-spacing:-.015em; } .choice .d { color:var(--muted); font-size:14px; }
  .glassrow { display:flex; align-items:center; gap:14px; background:var(--paper); border-radius:var(--r); padding:14px 18px; box-shadow:var(--sh-1); margin:-8px 0 20px; }
  .glassrow .ci { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--dark); color:#fff; flex:none; }
  .glassrow > div { flex:1; display:flex; flex-direction:column; } .glassrow a:hover { text-decoration:none; }
  .langrow { display:flex; align-items:center; gap:12px; }
  .seg { display:inline-flex; gap:2px; padding:3px; border-radius:999px; background:var(--bg); }
  .seg button { border:none; background:none; padding:6px 14px; font-size:13px; font-weight:600; color:var(--muted); border-radius:999px; transition:background .15s, color .15s; }
  .seg button:hover:not(.on) { color:var(--ink); }
  .seg button.on { background:var(--paper); color:var(--ink); box-shadow:var(--sh-1); }
  .picbar .seg, .langrow .seg { background:var(--bg); }
  .sheet { background:#fff; width:100%; max-width:794px; aspect-ratio:210/297; margin:0 auto 28px; box-shadow:var(--sh-2); border-radius:6px; padding:4%; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,minmax(0,1fr)); gap:3%; }
  .pcard { border:2px solid var(--ink); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; position:relative; min-height:0; }
  .pcard img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
  .pcard .txt { padding:6px 10px; font-size:clamp(12px,2.2vw,19px); font-weight:700; }
  .pcard .n { position:absolute; top:6px; left:6px; width:28px; height:28px; font-size:13px; }
  .pcard .en, .tab .en { display:block; font-size:.72em; font-weight:400; opacity:.75; }
  @page { size:A4; margin:0; }
  @media print {
    header, .noprint { display:none !important; } main { padding:0; max-width:none; } body { background:#fff; }
    .sheet { box-shadow:none; border-radius:0; margin:0; max-width:none; width:210mm; height:297mm; aspect-ratio:auto; padding:12mm; gap:6mm; break-after:page; }
    .pcard .txt { font-size:18px; }
  }
  body.tabmode header { display:none; } body.tabmode main { padding:0; max-width:none; }
  .tab { position:fixed; inset:0; background:var(--dark); color:#fff; display:flex; flex-direction:column; user-select:none; }
  .tab .imgwrap { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; padding:72px 24px 8px; }
  .tab .imgwrap img { max-width:100%; max-height:100%; border-radius:var(--r-l); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .tab .zone { position:absolute; top:0; bottom:0; width:50%; } .tab .zone.l { left:0; } .tab .zone.r { right:0; }
  .tab .txt { font-size:clamp(28px,4.5vw,52px); font-weight:800; letter-spacing:-.025em; line-height:1.25; text-align:center; padding:10px 24px 4px; }
  .tab .bar { display:flex; align-items:center; justify-content:space-between; padding:16px 24px 28px; gap:16px; }
  .tab .navb { background:var(--dark3); color:#fff; border:none; border-radius:999px; padding:18px 34px; font-size:20px; font-weight:700; min-width:150px; transition:background .15s; }
  .tab .navb:hover:not(:disabled) { background:#38444f; }
  .tab .navb.next { background:var(--accent); } .tab .navb.next:hover:not(:disabled) { background:var(--accent-h); }
  .tab .navb:disabled { opacity:.25; cursor:default; }
  .tab .mid { text-align:center; color:#8d9bab; font-weight:600; font-size:14px; }
  .dots { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:6px; }
  .dots i { width:8px; height:8px; border-radius:99px; background:var(--dark3); transition:width .2s; } .dots i.on { background:#fff; width:22px; }
  .tab .exit { position:absolute; top:16px; right:16px; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); backdrop-filter:blur(12px); color:#fff; border:none; border-radius:999px; padding:9px 16px; font-weight:600; font-size:14px; z-index:3; }
  .tab .exit:hover { background:rgba(255,255,255,.2); }

  .choices.three { grid-template-columns:repeat(3,1fr); }
  .coachv .cam { position:absolute; top:16px; left:16px; width:240px; border-radius:var(--r); overflow:hidden; background:#000; box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.5); z-index:3; }
  .coachv .cam video { width:100%; display:block; min-height:135px; }
  .coachv .pill { position:absolute; left:8px; top:8px; display:flex; align-items:center; gap:6px; background:rgba(11,16,21,.7); backdrop-filter:blur(8px); font-size:12px; font-weight:600; padding:3px 10px 3px 8px; border-radius:99px; }
  .coachv .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:#ff4d5e; }
  .againtag { position:absolute; top:18px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:10px 22px; border-radius:99px; font-weight:800; font-size:19px; z-index:3; box-shadow:0 8px 24px rgba(0,100,224,.45); }
  .coachv .exit { z-index:5; }
  .coachv .voice { right:auto; left:272px; } .coachv #ctxt { cursor:pointer; }
  .coachv .cstart ~ .voice { z-index:5; }
  .cstart { position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 0%, #16212c 0%, var(--dark) 60%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:4; text-align:center; padding:24px; }
  .cstart .glyph { width:72px; height:72px; border-radius:22px; background:var(--accent); display:grid; place-items:center; box-shadow:0 12px 32px rgba(0,100,224,.4); }
  .cstart .glyph .ico { width:36px; height:36px; color:#fff; stroke-width:1.7; }
  .cstart .t { font-size:34px; font-weight:800; letter-spacing:-.03em; } .cstart .d { color:#a9b8c6; max-width:540px; }
  .cstart .seg { background:var(--dark2); } .cstart .seg button { color:#a9b8c6; } .cstart .seg button.on { background:var(--accent); color:#fff; box-shadow:none; }

<body>
<header>
  <span class="logo" onclick="go({})"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="13" height="15" rx="2.5"/><path d="M4 7v11a3 3 0 0 0 3 3h9"/><path d="m10.5 10.5 2 2 4-4"/></svg></span><span>StepCards</span></span>
  <nav class="steps" id="steps"></nav>

  <span class="seg" id="uiseg"></span>
</header>
<main id="main"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
// 선 아이콘(24px 격자). 이모지는 기기마다 모양이 달라서 쓰지 않는다
const IC = { plus:'<path d="M12 5v14M5 12h14"/>', video:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10 5-3v10l-5-3"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/>', print:'<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6H7z"/>',
  tablet:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M11 18h2"/>', glasses:'<rect x="2.5" y="9.5" width="8" height="6.5" rx="3"/><rect x="13.5" y="9.5" width="8" height="6.5" rx="3"/><path d="M10.5 12c1-.9 2-.9 3 0M2.5 11 1.8 8.5M21.5 11l.7-2.5"/>',
  draw:'<path d="M12 3 13.6 8.4 19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6z"/><path d="M19 16v4M17 18h4"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  sound:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>', mute:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/>' };
const icon = n => `<svg class="ico" viewBox="0 0 24 24">${IC[n]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => `${Math.floor(t / 60)}:${String(Math.round(t) % 60).padStart(2, "0")}`;
const pad = (n, w = 2) => String(n).padStart(w, "0");
const S = { run: null, view: "home", data: null, idx: 0, poll: null, busy: new Map(), open: new Set(), strip: new Set(),
            saveTimer: null, saving: Promise.resolve(), saveState: "saved" };
let lang = (() => { try { return localStorage.getItem("lang") || "ko"; } catch { return "ko"; } })();  // 카드 글자
let ui = (() => {  // 화면 글자: 주소의 ?ui= → 저장된 값 → 브라우저 언어
  const q = new URLSearchParams(location.search).get("ui");
  if (q === "ko" || q === "en") return q;
  try { return localStorage.getItem("ui") || (navigator.language.startsWith("ko") ? "ko" : "en"); } catch { return "ko"; }
})();
const T = (ko, en) => ui === "en" ? en : ko;
function setUi(v) { ui = v; try { localStorage.setItem("ui", v); } catch {} document.documentElement.lang = v; route(); }

function go(p) { location.hash = p.run ? new URLSearchParams(p).toString() : ""; }
window.addEventListener("hashchange", route);

async function route() {
  clearInterval(S.poll);
  stopCoach();
  const p = new URLSearchParams(location.hash.slice(1));
  const run = p.get("run");
  if (run !== S.run) { S.run = run; S.data = null; S.idx = 0; S.open.clear(); S.strip.clear(); }
  S.view = run ? (p.get("view") || "making") : "home";
  if (run && !S.data) { const r = await fetch(`/api/runs/${run}/cards`); if (r.ok) S.data = await r.json(); }
  if (["edit", "use", "tablet", "coach"].includes(S.view) && !S.data) S.view = "making";
  document.body.classList.toggle("tabmode", S.view === "tablet" || S.view === "coach");
  document.documentElement.lang = ui;
  $("#uiseg").innerHTML = [["ko", "한국어"], ["en", "English"]].map(([v, l]) => `<button class="${ui === v ? "on" : ""}" onclick="setUi('${v}')">${l}</button>`).join("");
  header();
  ({ home, making, edit, use, tablet, coach })[S.view]();
}

/* 위쪽 1·2·3 단계 표시 */
function header() {
  const done = !!S.data, cur = ["tablet", "coach"].includes(S.view) ? "use" : S.view === "home" ? "making" : S.view;
  const items = [["making", T("영상 넣기", "Add video")], ["edit", T("카드 확인·고치기", "Check & edit")], ["use", T("인쇄·태블릿", "Print · Tablet · Coach")]];
  $("#steps").innerHTML = items.map(([v, l], i) => {
    const ok = (v === "making" && done) || (v === "edit" && done && cur === "use" && !(S.data.problems || []).length);
    const off = !S.run || (v !== "making" && !done);
    return `${i ? '<span class="arrow">›</span>' : ""}<button class="step ${cur === v ? "on" : ""} ${ok ? "done" : ""}" ${off && cur !== v ? "disabled" : ""}
      onclick="${S.run ? `go({run:S.run,view:'${v}'})` : ""}"><span class="dot">${ok ? "✓" : i + 1}</span>${l}</button>`;
  }).join("");
}

function imgSrc(c) {
  if (c.view === "ill" && c.ill) return `/runs/${S.run}/${c.ill}?v=${c.v || 0}`;
  const f = c.box && !c.hl_off ? c.image.replace(".jpg", "_hl.jpg") : c.image;
  return `/runs/${S.run}/${f}?v=${c.v || 0}`;
}
function text(c) {
  if (lang === "en") return esc(c.en);
  if (lang === "both") return `${esc(c.ko)}<span class="en">${esc(c.en)}</span>`;
  return esc(c.ko);
}
function setLang(v) { lang = v; try { localStorage.setItem("lang", v); } catch {} ({ use, tablet })[S.view]?.(); }
function toast(msg, label, act) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span>${esc(msg)}</span>${label ? `<button>${esc(label)}</button>` : ""}`;
  if (label) t.querySelector("button").onclick = () => { t.remove(); act(); };
  document.body.append(t);
  setTimeout(() => t.remove(), 6000);
}

/* ① 처음 화면 */
async function home() {
  const runs = await (await fetch("/api/runs")).json();
  $("#main").innerHTML = `
    <div class="hero"><div>
    <span class="eyebrow">${T("Meta 모델로 만들어요", "Built with Meta models")}</span>
    <h2>${T("영상 하나로 따라 하기 카드 만들기", "Turn one demonstration video into step cards")}</h2>
    <p class="sub">${T("손으로 하는 일을 한 번 보여 주는 영상을 넣으면, 동작마다 사진 한 장과 짧은 문장이 붙은 카드가 만들어져요.",
      "Add a video of someone doing a hands-on task once. You get one card per action, each with a photo and a short sentence.")}</p>
    </div>
    <label class="drop" id="drop">
      <input type="file" accept="video/*" id="file" hidden>
      <div class="plus">${icon("plus")}</div>
      <div class="big">${T("영상을 여기에 끌어다 놓거나, 눌러서 고르세요", "Drop a video here, or click to choose one")}</div>
      <div class="muted">${T("1~5분 · 손과 물건이 잘 보이게 · 학생이 나오는 영상은 넣지 마세요", "1–5 minutes · hands and objects clearly visible · no videos of students")}</div>
      <span class="btn primary">${T("영상 고르기", "Choose a video")}</span>
    </label></div>
    <div class="flow">
      <div><span class="fi">${icon("video")}</span><strong>${T("1. 영상 넣기", "1. Add video")}</strong><span class="muted">${T("몇 분 뒤 카드가 나와요.", "Cards are ready in a few minutes.")}</span></div>
      <div><span class="fi">${icon("check")}</span><strong>${T("2. 확인·고치기", "2. Check & edit")}</strong><span class="muted">${T("문장을 누르면 바로 고쳐지고, 저장은 저절로 돼요.", "Click a sentence to edit it. Saving is automatic.")}</span></div>
      <div><span class="fi">${icon("glasses")}</span><strong>${T("3. 인쇄·태블릿", "3. Use")}</strong><span class="muted">${T("A4에 6장씩 뽑거나, 한 장씩 넘겨 보거나, 카메라로 따라 해요.", "Print six per A4 page, flip through on a tablet, or follow along with the camera.")}</span></div>
    </div>
    <h3>${T("이런 곳에 써요", "Where it helps")}</h3>
    <div class="uses">${[
      ["check", T("특수교육 직무 훈련", "Special-education job training"), T("음료 만들기, 빨래, 포장을 한 동작씩. 교사가 확인한 카드로 따라 해요.", "Drinks, laundry, packing — one action at a time, from cards the teacher checked.")],
      ["glasses", T("신입 직원 교육", "New staff training"), T("숙련자가 한 번 해 보이면 매장 방식 그대로. 한국어·영어 카드로 이주 노동자도.", "A senior shows it once; new staff follow the store's own way, in Korean or English.")],
      ["video", T("크리에이터 따라 하기", "Follow-along for creators"), T("요리·공예 영상을 올린 사람이 따라 하기 판도 함께 내요.", "Creators publish a step-by-step version of their own video.")],
      ["tablet", T("조립·설치 안내", "Assembly and setup"), T("처음 하는 조립을 지금 몇 번째인지 맞춰 가며.", "First-time assembly, with the current step tracked.")],
      ["draw", T("가족 손기술 남기기", "Family know-how"), T("부모님 요리법을 한 번 찍어 카드로 남겨요.", "Film a parent's recipe once and keep it as cards.")],
    ].map(([i, t, d]) => `<div><span class="fi">${icon(i)}</span><strong>${t}</strong><span class="muted">${d}</span></div>`).join("")}</div>
    ${runs.length ? `<h3>${T("지난 카드 묶음", "Previous card sets")}</h3><div class="past">${runs.map(r => `
      <a class="pastcard" href="#run=${r.id}&view=${r.done ? "edit" : "making"}">
        ${r.thumb ? `<img src="/runs/${r.id}/${r.thumb}" alt="">` : '<div class="ph"></div>'}
        <div class="pt"><strong>${esc(r.video)}</strong>
        <span class="muted">${r.done ? `${T(`카드 ${r.count}장`, `${r.count} cards`)}${r.issues ? ` · <span class="red">${T(`확인할 곳 ${r.issues}`, `${r.issues} to check`)}</span>` : T(" · 확인 끝", " · all checks passed")}` : T("만드는 중", "in progress")}</span></div>
      </a>`).join("")}</div>` : ""}`;
  const drop = $("#drop"), file = $("#file");
  file.onchange = () => file.files[0] && upload(file.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) upload(f); };
}
async function upload(f) {
  if (!f.type.startsWith("video/")) return toast(T("영상 파일만 넣을 수 있어요.", "Only video files can be added."));
  $("#drop").innerHTML = `<div class="big">${T("영상을 올리는 중…", "Uploading…")}</div>`;
  const fd = new FormData(); fd.append("file", f);
  const r = await fetch("/api/upload", { method: "POST", body: fd });
  if (!r.ok) { toast(T("올리지 못했어요. 다시 해 주세요.", "Upload failed. Please try again.")); return home(); }
  go({ run: (await r.json()).id, view: "making" });
}

/* ① 만드는 중 */
async function making() {
  const draw = async () => {
    const wasOpen = $("details.log")?.open;
    const p = await (await fetch(`/api/runs/${S.run}/progress`)).json();
    const ev = p.events || [];
    const has = s => ev.some(e => e.stage === s);
    const splits = ev.filter(e => e.stage === "split" && e.n !== undefined);
    const hl = ev.filter(e => e.stage === "highlight" && e.i);
    const total = hl.at(-1)?.total || splits.at(-1)?.n || 0;
    const err = ev.find(e => e.stage === "error"), done = has("done");
    const st = (ok, now) => ok ? "done" : now ? "now" : "wait";
    const s1 = st(has("extract"), !err && !has("extract"));
    const listenEv = ev.find(e => e.stage === "listen");
    const sL = st(!!listenEv, !err && has("extract") && !listenEv);
    const s2 = st(has("highlight") || done, !err && !!listenEv && !has("highlight"));
    const s3 = st(done, !err && has("highlight") && !done);
    const retried = splits.slice(0, -1);
    const last = splits.at(-1);
    $("#main").innerHTML = `
      <h2>${done ? T("카드가 다 만들어졌어요", "Your cards are ready") : err ? T("만들다가 멈췄어요", "Stopped with an error") : T("카드를 만들고 있어요", "Making your cards")}</h2>
      <p class="sub">${esc(p.video || "")}${done || err ? "" : T(" · 몇 분 걸려요. 이 창을 닫아도 계속 만들어져요.", " · This takes a few minutes. It keeps going if you close this window.")}</p>
      ${err ? `<div class="issue">${esc(err.msg)}</div>` : ""}
      ${done ? `<p><button class="btn primary big" onclick="openEdit()">${T("카드 확인하러 가기 →", "Check the cards →")}</button></p>` : ""}
      <div class="stages">
        <div class="stage ${s1}"><span class="ic"></span><div><strong>${T("영상에서 1초마다 사진 뽑기", "Take a frame every second")}</strong></div></div>
        <div class="stage ${sL}"><span class="ic"></span><div><strong>${T("영상 속 말 받아쓰기", "Transcribe what was said (Muse Voice Transcribe)")}</strong>
          ${listenEv ? `<div class="muted">${listenEv.n ? T(`말 ${listenEv.n}구간 받아씀 · 양과 재료 이름을 문장에 넣을 때 써요`, `${listenEv.n} speech turns · used for amounts and names in the sentences`) : T("영상에 말소리가 없음", "No speech in this video")}</div>` : ""}</div></div>
        <div class="stage ${s2}"><span class="ic"></span><div><strong>${T("동작마다 단계를 나누고 문장 쓰기", "Split into one-action steps and write sentences (Muse Spark)")}</strong>
          ${last ? `<div class="muted">${T(`단계 ${last.n}개`, `${last.n} steps`)} · ${last.problems.length ? T("고칠 곳이 남아 확인이 필요해요", "some issues remain for a person to check") : T("규칙 검사 통과", "passed the rule check")}</div>` : ""}
          ${retried.length ? `<div class="detail">${T("규칙 검사에서 걸린 곳이 있어서, 이유를 알려 주고 다시 만들게 했어요.", "The rule check found a problem, so the model was told why and asked to try again.")}<ul>${retried.flatMap(s => s.problems).map(x => `<li>${esc(problemText(x, true))}</li>`).join("")}</ul></div>` : ""}</div></div>
        <div class="stage ${s3}"><span class="ic"></span><div><strong>${T("카드마다 사진을 고르고, 손에 든 물건에 테두리 그리기", "Pick a photo per card and outline the object in hand (SAM 3.1)")}</strong>
          ${total && !done ? `<div class="prog"><i style="width:${hl.length / total * 100}%"></i></div><div class="muted">${hl.length} / ${total}</div>` : ""}</div></div>
      </div>
      ${hl.length ? `<div class="thumbs">${hl.map(e => `<img src="/runs/${S.run}/cards/${pad(e.i)}.jpg" alt="">`).join("")}</div>` : ""}
      <details class="log" ${wasOpen ? "open" : ""}><summary>${T("자세한 기록", "Detailed log")}</summary>${ev.map(e => `<div>${esc(e.msg)}</div>`).join("")}
        <div>${T("모델 비용 합계 약", "Model cost, about")} $${ev.reduce((s, e) => s + (e.cost || 0), 0).toFixed(3)}</div></details>`;
    if (done || err) clearInterval(S.poll);
  };
  await draw();
  S.poll = setInterval(draw, 1200);
}
async function openEdit() {
  S.data = await (await fetch(`/api/runs/${S.run}/cards`)).json();
  go({ run: S.run, view: "edit" });
}

/* ② 확인·고치기 */
// 검사기 문장(한국어)을 쉬운 말로. [모양, 한국어, 영어]
const FRIENDLY = [
  [/겹칩니다/, "앞 카드와 시간이 겹쳐요. '시간·물건 고치기'에서 시작이나 끝을 바꿔 주세요.", "Overlaps another card in time. Change the start or end under 'Edit time & object'."],
  [/문장이 비어/, "문장을 써 주세요.", "Write a sentence."],
  [/한국어 문장이 깁니다/, "문장이 길어요. 25자 안으로 줄여 주세요.", "The Korean sentence is too long. Keep it within 25 characters."],
  [/세요'로 끝나야/, "문장 끝을 '~세요'로 맞춰 주세요.", "End the Korean sentence with '~세요' (a polite instruction)."],
  [/동작이 둘/, "한 카드에는 동작 하나만 넣어요. 아래 '+ 여기에 카드 넣기'로 나눠 주세요.", "One action per card. Split it with '+ Add a card here' below."],
  [/대표 시각/, "고른 장면이 이 카드 시간 밖에 있어요. '다른 장면 고르기'로 다시 골라 주세요.", "The chosen photo is outside this card's time. Use 'Choose another frame'."],
  [/영상\(/, "시간이 영상 길이를 벗어났거나 끝이 시작보다 빨라요.", "The time is outside the video, or the end comes before the start."],
  [/영어 문장이 깁니다/, "영어 문장이 길어요.", "The English sentence is too long."],
  [/항목이 없습니다/, "빠진 내용이 있어요.", "Something is missing."],
  [/맞춤법/, m => `맞춤법: ${m.match(/\('(.+)' → '(.+)'\)/).slice(1).join(" → ")} 로 고쳐 주세요.`,
             m => `Korean spelling: change ${m.match(/\('(.+)' → '(.+)'\)/).slice(1).join(" → ")}.`],
];
function problemText(m, withStep) {
  const hit = FRIENDLY.find(([re]) => re.test(m));
  if (!hit) return m;
  const f = ui === "en" ? hit[2] : hit[1], txt = typeof f === "function" ? f(m) : f;
  const k = m.match(/^(\d+)(?:·(\d+))?단계/);
  return withStep && k ? `${T(`${k[2] ? k[1] + "·" + k[2] : k[1]}단계: `, `Step ${k[2] ? k[1] + "–" + k[2] : k[1]}: `)}${txt}` : txt;
}
function issues() {
  const per = {}, global = [], gaps = {};
  for (const m of S.data.problems || []) {
    const k = m.match(/^(\d+)(?:·(\d+))?단계/);
    const f = problemText(m);
    if (!k) { global.push(f); continue; }
    const i = +(k[2] || k[1]) - 1;
    (per[i] = per[i] || []).push(f);
  }
  for (const w of S.data.warnings || []) {

function stripHtml(c, i) {

function between(i, gaps) {

function autosize(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

/* 고친 내용은 저절로 저장하고, 저장할 때마다 서버가 규칙 검사를 다시 한다 */
function setSave(s) { S.saveState = s; const el = $("#saved"); if (el) el.textContent = saveText(); }
function scheduleSave(ms = 700) { clearTimeout(S.saveTimer); setSave("dirty"); S.saveTimer = setTimeout(saveNow, ms); }
function saveNow() {
  clearTimeout(S.saveTimer);
  const cards = JSON.parse(JSON.stringify(S.data.cards));
  S.saving = S.saving.then(async () => {
    setSave("saving");
    const r = await fetch(`/api/runs/${S.run}/cards`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cards }) });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    Object.assign(S.data, { problems: d.problems, warnings: d.warnings, status: d.status });
    setSave("saved");
    if (S.view === "edit") updateIssues();
  }).catch(() => setSave("error"));
  return S.saving;
}
function updateIssues() {
  const { per, global, gaps } = issues();
  $("#chip").innerHTML = chipHtml(Object.keys(per).length + global.length);
  $("#global").innerHTML = global.map(g => `<div class="issue">${esc(g)}</div>`).join("");
  S.data.cards.forEach((c, i) => {
    const iss = per[i] || [];
    $("#row" + i)?.classList.toggle("has-bad", iss.length > 0);
    const box = $("#iss" + i); if (box) box.innerHTML = iss.map(x => `<div class="issue">${esc(x)}</div>`).join("");
    const bar = $("#gap" + i); if (bar) bar.outerHTML = between(i, gaps);
  });

}
window.addEventListener("beforeunload", e => { if (S.saveState !== "saved") e.preventDefault(); });

function changed() { edit(); saveNow(); }
function typed(i, k, el) { S.data.cards[i][k] = el.value; autosize(el); scheduleSave(); }
function snapshot() { return JSON.parse(JSON.stringify(S.data.cards)); }
function undoable(msg, before) { toast(msg, T("되돌리기", "Undo"), () => { S.data.cards = before; changed(); }); }
function move(i, d) { const cs = S.data.cards; [cs[i], cs[i + d]] = [cs[i + d], cs[i]]; changed(); }
function del(i) { const before = snapshot(); S.data.cards.splice(i, 1); changed(); undoable(T("카드를 뺐어요.", "Card removed."), before); }
function merge(i) {
  const before = snapshot(), cs = S.data.cards, a = cs[i], b = cs[i + 1];
  a.start = Math.min(a.start, b.start); a.end = Math.max(a.end, b.end);
  if (!a.ko.trim()) a.ko = b.ko;
  cs.splice(i + 1, 1); changed(); undoable(T("두 카드를 하나로 합쳤어요.", "Cards merged."), before);
}
function setTime(i, k, v) {
  const c = S.data.cards[i];
  c[k] = Math.max(0, Math.round(+v));
  c.rep = Math.min(Math.max(c.rep, c.start), c.end);  // 고른 장면은 카드 시간 안에 둔다
  changed();
}
function setHl(i, on) { S.data.cards[i].hl_off = !on; changed(); }
function setObject(i, v) {
  const c = S.data.cards[i];

async function reframe(i, t) {
  const c = S.data.cards[i];
  S.busy.set(c.n, T("장면을 바꾸는 중…", "Changing the frame…")); edit();
  await saveNow();
  const r = await fetch(`/api/runs/${S.run}/cards/${c.n}/frame?t=${t}`, { method: "POST" });
  S.busy.delete(c.n);
  if (r.ok) {
    const f = await r.json();
    Object.assign(c, { frame_t: f.frame_t, rep: f.rep, box: f.box, box_prompt: f.box_prompt, box_touches_hand: f.box_touches_hand, ill: f.ill, view: f.view, v: Date.now() });
  } else toast(T("장면을 바꾸지 못했어요. 다시 해 주세요.", "Could not change the frame. Please try again."));
  if (S.view === "edit") edit();
  saveNow();
}

function setView(i, v) { S.data.cards[i].view = v; changed(); }
async function illustrateCard(i, quiet) {
  const c = S.data.cards[i];
  S.busy.set(c.n, T("그림으로 바꾸는 중…", "Drawing…")); if (S.view === "edit") edit();
  await saveNow();
  const r = await fetch(`/api/runs/${S.run}/cards/${c.n}/illustrate`, { method: "POST" });
  S.busy.delete(c.n);
  if (r.ok) { const f = await r.json(); Object.assign(c, { ill: f.ill, view: "ill", v: Date.now() }); }
  else if (!quiet) toast(T("그림을 만들지 못했어요. 다시 해 주세요.", "Could not make the drawing. Please try again."));
  if (S.view === "edit") edit();
  if (!quiet) saveNow();
  return r.ok;

async function illustrateAll() {
  const todo = S.data.cards.map((c, i) => [c, i]).filter(([c]) => !c.ill && !S.busy.has(c.n)).map(([, i]) => i);
  let done = 0, fail = 0;
  const worker = async () => { while (todo.length) { const i = todo.shift(); (await illustrateCard(i, true)) ? done++ : fail++; } };
  await Promise.all([worker(), worker(), worker()]);  // 3장씩 동시에
  await saveNow();
  toast(T(`그림 ${done}장을 만들었어요${fail ? ` (${fail}장 실패)` : ""}.`, `Made ${done} drawings${fail ? ` (${fail} failed)` : ""}.`));
}

async function addCard(i) {
  const cs = S.data.cards, prev = cs[i], next = cs[i + 1], dur = S.data.duration || Infinity;
  const start = prev.end + 1;
  const end = Math.max(start, next ? next.start - 1 : Math.min(dur - 1, start + 3));
  const n = Math.max(...cs.map(c => c.n)) + 1;
  cs.splice(i + 1, 0, { n, start, end, rep: start, ko: "", en: "", object: "", look: "", image: `cards/${pad(n)}.jpg`, box: null });
  S.strip.add(n);
  await reframe(i + 1, start + Math.floor((end - start) / 2));
  $(`#row${i + 1} textarea.say`)?.focus();
}

}
function coachWhere(local) {
  C.local = local;
  $("#cwhere").querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === +local));
  $("#cwhered").hidden = false;
  $("#cwhered").innerHTML = local
    ? T("공개 가중치 모델이 이 맥에서 판단해요. 카메라 사진이 맥 밖으로 나가지 않아요. 물건 확인(SAM)은 건너뛰어요.", "An open-weight model decides on this Mac. Camera frames never leave it. The object check (SAM) is skipped.")
    : T("Muse Spark가 단계를 보고, SAM 3.1이 손에 든 물건을 한 번 더 확인해요.", "Muse Spark reads the step and SAM 3.1 double-checks the object in hand.");
}
// 카드 문장 소리로 읽기: 휴대폰 스피커나 블루투스로 이어진 안경 스피커로 나온다. 시작 단추를 누르기 전엔 읽지 않는다(브라우저가 막음)
C.voice = (() => { try { return localStorage.getItem("voice") !== "off"; } catch { return true; } })();
function setVoice(on) {
  C.voice = on; try { localStorage.setItem("voice", on ? "on" : "off"); } catch {}
  const b = $("#cvoice"); if (b) b.innerHTML = `${icon(on ? "sound" : "mute")}${on ? T("소리 켬", "Sound on") : T("소리 끔", "Sound off")}`;
  if (!on) speechSynthesis.cancel(); else if (C.started) speak(true);
}
function speak(force, again) {
  if (!window.speechSynthesis || !(C.voice || force) || !C.started) return;
  const c = S.data.cards[S.idx], parts = [];
  if (again) parts.push([T("이 카드부터 해요.", "Start with this card."), ui === "en" ? "en-US" : "ko-KR"]);
  if (lang !== "en") parts.push([c.ko, "ko-KR"]);
  if (lang !== "ko") parts.push([c.en, "en-US"]);
  speechSynthesis.cancel();
  for (const [t, l] of parts) { const u = new SpeechSynthesisUtterance(t); u.lang = l; u.rate = 0.9; speechSynthesis.speak(u); }
}
// 안경 화면(/glasses)에 지금 카드를 알린다
function glassesSync(again) {
  fetch(`/api/runs/${S.run}/now`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ i: S.idx, again: !!again, by: "coach" }) })
    .then(r => r.json()).then(d => { C.v = d.v; }).catch(() => {});
}
function coachCard() {
  const cs = S.data.cards, c = cs[S.idx];
  glassesSync(false);
  speak();
  $("#cimg").src = imgSrc(c);
  $("#ctxt").innerHTML = text(c);
  $("#cmid").innerHTML = `<div class="dots">${cs.map((_, j) => `<i class="${j === S.idx ? "on" : ""}"></i>`).join("")}</div>${S.idx + 1} / ${cs.length}`;
  $("#cprev").disabled = !S.idx;
  $("#cnext").disabled = S.idx === cs.length - 1;
}
function coachFlip(d) { S.idx = Math.max(0, Math.min(S.data.cards.length - 1, S.idx + d)); C.buf = []; C.prev = 0; $("#cagain").hidden = true; coachCard(); }
function pill(t) { const el = $("#cpill"); if (el) el.textContent = t; }
async function coachCamera() {
  try {
    C.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 1280 }, audio: false });
    $("#cvid").srcObject = C.stream; await $("#cvid").play(); coachStart();
  } catch { pill(T("카메라를 켤 수 없어요", "Camera unavailable")); toast(T("카메라 사용을 허락해 주세요.", "Please allow camera access.")); }
}
function coachFile(f) {
  if (!f) return;
  const v = $("#cvid"); v.src = URL.createObjectURL(f); v.play(); coachStart();
  v.onended = () => { C.running = false; pill(T("영상이 끝났어요", "Video ended")); };
}
function coachStart() {
  $("#cstart").hidden = true; C.buf = []; C.running = true; pill(T("지켜보는 중", "Watching"));
  C.started = true; speak();
  navigator.wakeLock?.request("screen").then(l => { C.lock = l; }).catch(() => {});  // 휴대폰 화면이 꺼지지 않게
  const v = $("#cvid"), cv = document.createElement("canvas");
  C.timer = setInterval(() => {  // 1초에 한 장, 최근 4장만 둔다
    if (v.readyState < 2) return;
    cv.width = 480; cv.height = Math.round(480 * v.videoHeight / v.videoWidth);
    cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
    C.buf.push(cv.toDataURL("image/jpeg", 0.7)); if (C.buf.length > 4) C.buf.shift();
  }, 1000);
  coachLoop();
}
async function coachLoop() {
  while (C.running && S.view === "coach") {
    const cs = S.data.cards, cur = S.idx + 1;
    if (C.buf.length >= 2 && cur < cs.length) {
      const r = await fetch(`/api/runs/${S.run}/coach`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cur, frames: C.buf.slice(), prev_seen: C.prev, local: C.local }) });
      if (!C.running || S.idx + 1 !== cur) continue;  // 그 사이 사람이 직접 넘겼으면 결과는 버린다
      if (!r.ok) { pill(T("판단하지 못했어요 · 다시 보는 중", "No answer · watching again")); }
      else {
        const d = await r.json();
        C.prev = d.seen;
        if (d.decision === "next" || d.decision === "jump") {
          S.idx = d.decision === "next" ? S.idx + 1 : d.target - 1;
          C.buf = []; C.prev = 0; $("#cagain").hidden = true; coachCard(); pill(T(`${S.idx + 1}번 카드로 넘겼어요`, `Moved to card ${S.idx + 1}`));
        }
        else if (d.decision === "again") {
          $("#cagain").hidden = false; glassesSync(true); speak(false, true); clearTimeout(C.againTimer); C.againTimer = setTimeout(() => { const a = $("#cagain"); if (a) a.hidden = true; }, 4000);
          pill(T(`지켜보는 중 · ${d.latency}초${C.local ? " · 이 맥" : ""}`, `Watching · ${d.latency} s${C.local ? " · this Mac" : ""}`));
        } else pill(T(`지켜보는 중 · ${d.latency}초${C.local ? " · 이 맥" : ""}`, `Watching · ${d.latency} s${C.local ? " · this Mac" : ""}`));
      }
    } else if (cur === cs.length) pill(T("마지막 카드예요", "Last card"));
    await new Promise(r => setTimeout(r, 1500));
  }
}
function stopCoach() {
  C.running = false; clearInterval(C.timer); clearInterval(C.sync); C.started = false;
  window.speechSynthesis?.cancel(); C.lock?.release().catch(() => {}); C.lock = null; clearTimeout(C.againTimer);
  C.stream?.getTracks().forEach(t => t.stop()); C.stream = null;
}

function flip(d) { S.idx = Math.max(0, Math.min(S.data.cards.length - 1, S.idx + d)); tablet(); }
document.addEventListener("keydown", e => {
  if (S.view === "coach") { if (e.key === "ArrowRight") coachFlip(1); if (e.key === "ArrowLeft") coachFlip(-1); if (e.key === "Escape") go({ run: S.run, view: "use" }); return; }
  if (S.view !== "tablet") return;
  if (e.key === "ArrowRight" || e.key === " ") flip(1);
  if (e.key === "ArrowLeft") flip(-1);
  if (e.key === "Escape") go({ run: S.run, view: "use" });
});
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; });
document.addEventListener("touchend", e => {
  if (S.view === "tablet" && touchX !== null) { const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 60) flip(dx < 0 ? 1 : -1); }
  touchX = null;
});

route();
</script>
</body>
</html>
