<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StepCards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230064e0'/%3E%3Cpath d='m7 12.5 3 3 7-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Meta Ray-Ban Display: 600x600, 빛을 더하는 화면이라 검은색은 투명하게 보인다 → 바탕은 검정, 글과 단추만 밝게 */
  * { box-sizing:border-box; }
  /* 값은 Meta Ray-Ban Display UI 툴킷(theme·text-styles·ButtonLayout)에서: 본문 #fff, 보조 #CFD3D9, 강조 #2694FE, 단추 88px·#30333A, 비활성 0.5 */
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family:"Noto Sans KR","Noto Sans",-apple-system,"Apple SD Gothic Neo",sans-serif; word-break:keep-all; overflow:hidden; }
  main { height:100%; max-width:600px; margin:0 auto; display:flex; flex-direction:column; align-items:center; padding:20px 24px 18px; gap:12px; }
  .top { display:flex; align-items:center; gap:10px; width:100%; font-size:24px; line-height:32px; font-weight:700; color:#CFD3D9; }
  .hl { display:flex; gap:6px; } .hl b { width:14px; height:14px; border-radius:50%; border:2px solid #7d8794; } .hl b.on { background:#CFD3D9; border-color:#CFD3D9; }  /* 시안: 도움 4단계 점(켜진 만큼 채움) */
  .dots { display:flex; gap:5px; flex:1; } .dots i { height:6px; flex:1; border-radius:3px; background:#30333A; } .dots i.done { background:#7d8794; } .dots i.on { background:#fff; }
  .pic { width:100%; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .pic img, .pic video { max-width:100%; max-height:100%; border-radius:18px; }
  .pic .lit { filter:brightness(.62) saturate(.9); }  /* 사진·움직임은 밝은 바탕이 렌즈에서 눈부시다: 낮춘다(그림은 서버가 이미 어둡게) */
  .pic video { width:100%; }
  .say { font-size:clamp(26px,6vw,38px); font-weight:800; line-height:1.25; text-align:center; letter-spacing:-.02em; min-height:1.25em; }
  .say small { display:block; font-size:28px; line-height:36px; font-weight:600; color:#CFD3D9; letter-spacing:0; margin-top:2px; }
  .again { position:absolute; top:58px; left:50%; transform:translateX(-50%); background:#2694FE; padding:8px 20px; border-radius:99px; font-size:22px; font-weight:800; white-space:nowrap; }
  .bar { display:flex; gap:12px; width:100%; }
  .bar button { flex:1; min-height:88px; font:inherit; font-size:28px; font-weight:700; color:#fff; background:#30333A; border:4px solid transparent; border-radius:9999px; transform:scale(.94); transition:transform .1s; }
  .bar button:focus { outline:none; border-color:#fff; background:#2694FE; box-shadow:0 0 0 4px rgba(255,255,255,.35); transform:scale(1); }  /* 초점은 색과 크기로 */
  .bar button:disabled { opacity:.5; }
  .xb { flex:none; width:64px; height:48px; font:inherit; font-size:24px; font-weight:700; color:#fff; background:#30333A; border:3px solid transparent; border-radius:9999px; }
  .xb:focus { outline:none; border-color:#fff; background:#2694FE; }  /* 나가기: ↑ 로 온다 */
  .msg { margin:auto; font-size:32px; line-height:40px; font-weight:700; color:#fff; text-align:center; }
  .ask { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; justify-content:center; gap:24px; padding:24px; }
  [hidden] { display:none !important; }
  /* 연결 상태(11-02 검토: 짝 코드가 없거나 연결이 끊기면 아무 표시 없이 옛 카드에 머물렀다). 작은 글씨 금지(24px 이상) */
  .net { position:fixed; left:50%; top:40px; transform:translateX(-50%); background:#30333A; color:#fff; font-size:24px; font-weight:700; padding:4px 16px; border-radius:99px; white-space:nowrap; z-index:9; }
</style>
</head>
<body>
<main id="m"><div class="msg" id="msg">…</div></main>
<div class="net" id="net" hidden></div>
<script>
// 안경 화면: 따라 하기 화면이 고른 카드를 그대로 보여 준다. 초점 이동(상하좌우)+선택(Enter)만으로 조작
const run = (r => r && /^[0-9a-f]{12}$/.test(r) ? r : "")(new URLSearchParams(location.search).get("run"));  // 카드 묶음 id 꼴만(주소로 태그를 심지 못하게)
const solo = !new URLSearchParams(location.search).get("s");  // 휴대폰 QR 없이(안경 첫 화면에서) 열었다: 휴대폰 카메라 확인이 없다
const pair = new URLSearchParams(location.search).get("s") || "g" + Math.random().toString(36).slice(2, 10);  // 혼자 열어도 자기 자리: 안 그러면 묶음마다 한 자리를 같이 써서, 앞사람이 끝낸 상태(다 했어요)나 남의 카드에서 시작했다(11-04 검수)  // 따라 하기 화면의 짝 코드(같은 카드 묶음을 여러 명이 써도 따로)
const lang = new URLSearchParams(location.search).get("lang") || (() => { try { return localStorage.getItem("lang") || "en"; } catch { return "en"; } })();  // 안경 브라우저는 교사 설정을 모르니 주소로 받는다
const M = new URLSearchParams(location.search).get("m") === "en" ? "en" : "ko";  // 한 언어 더(lang=x)일 때 위 줄 언어
const K = lang === "en" || (lang === "x" && M === "en");
document.documentElement.lang = K ? "en" : "ko";
let cards = [], cur = { i: -1, v: -1 }, arch = false, xOk = false, alone = false, noDone = false;  // alone: 혼자 하기(막혔어요) · noDone: '됐어요' 판단 끔  // arch: 보관된 묶음(영상이 없어 움직임·확인이 없다)
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = c => lang === "x" ? `${esc(c[M])}${xOk && c.x ? `<small>${esc(c.x)}</small>` : ""}` : lang === "en" ? esc(c.en) : lang === "both" ? `${esc(c.ko)}<small>${esc(c.en)}</small>` : esc(c.ko);

function draw(again) {
  const c = cards[cur.i], n = cards.length, had = document.activeElement?.id;
  if (cur.fin) {  // 끝 화면에서도 안경만으로 처음부터 다시 할 수 있게
    document.getElementById("m").innerHTML = `<div class="msg" style="font-size:44px;line-height:56px">✓<br>${K ? "All steps done" : "다 했어요"}</div>
      <div class="bar"><button id="x" onclick="act(leave)">${K ? "Card list" : "카드 목록"}</button><button id="f" onclick="act(restart)">${K ? "Start over ↺" : "처음으로 ↺"}</button></div>`;
    if (shown !== "fin") { shown = "fin"; lockUntil = Date.now() + 1000; setTimeout(() => document.getElementById("f")?.focus(), 1000); }  // 빨리 여러 번 집어도 바로 처음으로 가지 않게
    else document.getElementById("f").focus();
    return;
  }
  document.getElementById("m").innerHTML = `
    <div class="top"><button id="x" class="xb" onclick="act(leave)" aria-label="${K ? "Exit to card list" : "카드 목록으로 나가기"}">✕</button><span>${cur.i + 1} / ${n}</span>${n > 12 ? "" : `<div class="dots">${cards.map((_, j) => `<i class="${j === cur.i ? "on" : j < cur.i ? "done" : ""}"></i>`).join("")}</div>`}${n > 12 ? '<span style="flex:1"></span>' : ""}<span class="hl" aria-label="${K ? "Help level" : "도움 단계"} ${cur.lv || 1}">${[1, 2, 3, 4].map(l => `<b class="${l <= (cur.lv || 1) ? "on" : ""}"></b>`).join("")}</span></div>
    ${cur.ack && Date.now() / 1000 - cur.ack < 20 ? `<div class="again">${K ? "Help is on the way" : "도와주러 오고 있어요"}</div>`
      : again ? `<div class="again">${K ? "Start with this card" : "이 카드부터 해요"}</div>` : ""}
    <div class="pic">${cur.lv === 1 ? `<div class="msg">${K ? "Need help? Press Help" : "도움이 필요하면 '도움'을 눌러요"}</div>` : (cur.lv === 4 || (!cur.lv && c.view === "clip")) && !arch ? `<video src="/api/runs/${run}/clip/${c.n}.mp4?g=1&t=${c.frame_t ?? c.rep}" class="lit" autoplay muted loop playsinline></video>`
      : `<img ${c.view === "ill" ? "" : 'class="lit"'} src="/api/runs/${run}/glass/${cur.i}.jpg?v=${cards[cur.i].v || 0}" alt="${esc(K ? c.en : c.ko)}">`}</div>
    <div class="say">${say(c)}</div>
    <div class="bar"><button id="b" onclick="act(() => flip(-1))" ${cur.i ? "" : "disabled"}>${K ? "◀ Back" : "◀ 이전"}</button>
      ${(cur.lv || 1) < (arch ? 3 : 4) ? `<button id="h" onclick="act(help)">${K ? "Help" : "도움"}</button>`
        : alone ? `<button id="h" onclick="act(markStuck)" ${marked.has(c.n) ? "disabled" : ""}>${marked.has(c.n) ? (K ? "Sent" : "알렸어요") : (K ? "Stuck" : "막혔어요")}</button>`
        : `<button id="h" onclick="act(callMaker)" ${cur.call ? "disabled" : ""}>${cur.call ? (K ? "Called" : "불렀어요") : (K ? "Call" : "도와줘요")}</button>`}
      ${arch || noDone || solo ? "" : `<button id="v" onclick="act(check)">${K ? "Check" : "확인"}</button>`}
      ${cur.i < n - 1 ? `<button id="f" onclick="act(() => flip(1))">${K ? "Next ▶" : "다음 ▶"}</button>` : `<button id="f" onclick="act(finish)">${K ? "Done ✓" : "다 했어요 ✓"}</button>`}</div>`;
  if (shown !== `${cur.i}|${cur.fin}`) { shown = `${cur.i}|${cur.fin}`; lockUntil = Date.now() + 600; }
  const keep = document.getElementById(had);
  (keep && !keep.disabled ? keep : [document.getElementById("f"), document.getElementById("b")].find(b => !b.disabled))?.focus();
}
let shown = "", lockUntil = 0;
const act = fn => { if (Date.now() >= lockUntil) fn(); };  // 한 번 누르면 한 번만: 화면이 바뀐 직후의 겹친 입력은 버린다
// 시스템 '뒤로'(손가락 동작)는 바로 끄지 않고 한 번 묻는다. 기록은 하나만 쌓는다(최대 5개 제한)
history.replaceState({ base: 1 }, ""); history.pushState({ guard: 1 }, "");
addEventListener("popstate", () => {
  const box = document.createElement("div"); box.className = "ask";
  box.innerHTML = `<div class="msg" style="margin:0">${K ? "Stop for now?" : "그만할까요?"}</div><div class="bar">
    <button id="stay">${K ? "Keep going" : "계속하기"}</button><button id="quit">${K ? "Stop" : "그만하기"}</button></div>`;
  document.body.append(box);
  box.querySelector("#stay").onclick = () => { box.remove(); history.pushState({ guard: 1 }, ""); draw(false); };
  box.querySelector("#quit").onclick = () => history.back();
  box.querySelector("#stay").focus();
});
// 초점이 화면 밖으로 나가면(시뮬레이터 단추 등) 화살표·Enter로 다시 데려온다. ←→ 는 이전·다음 단추로 초점만 옮긴다
document.addEventListener("keydown", e => {  // ←→ 는 단추 줄을 차례로, ↑ 는 나가기(✕), ↓ 는 다시 단추 줄로. 초점이 밖에 있으면 '다음'으로 데려온다
  const ask = document.querySelector(".ask");
  if (ask) { if (["ArrowLeft", "ArrowRight"].includes(e.key)) { const s = ask.querySelector("#stay"), q = ask.querySelector("#quit"); (document.activeElement === s ? q : s).focus(); e.preventDefault(); } return; }  // "그만할까요?": 좌우로 계속하기·그만하기
  const row = ["b", "h", "v", "f"].map(id => document.getElementById(id)).filter(x => x && !x.disabled), x = document.getElementById("x");
  if (!row.length || !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"].includes(e.key)) return;
  const a = document.activeElement, k = row.indexOf(a), home = row.at(-1);
  let to = null;
  if (e.key === "ArrowUp" && x && a !== x) to = x;
  else if (e.key === "ArrowDown" && a === x) to = home;
  else if (k >= 0 && e.key === "ArrowLeft") to = row[Math.max(0, k - 1)];
  else if (k >= 0 && e.key === "ArrowRight") to = row[Math.min(row.length - 1, k + 1)];
  else if (k < 0 && a !== x) to = home;
  if (to) { to.focus(); e.preventDefault(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isTrusted && !e.defaultPrevented) {  /* 위에서 초점만 되찾은 Enter 는 누르지 않는다(한 번에 다음 카드로 넘어갔다) */ const a = document.activeElement; if (a && a.tagName === "BUTTON" && !a.disabled) { e.preventDefault(); a.click(); } } });  // 시뮬레이터 선택 단추(스크립트 Enter)는 브라우저가 눌러 주지 않는다
function leave() { location.href = `/?ui=${K ? "en" : "ko"}`; }  // 안경 첫 화면(카드 목록)으로
// 확인: 안경에는 카메라가 없어 따라 하기 화면(휴대폰)이 찍어서 확인하고, 결과 한 줄을 돌려준다
let shownRes = undefined, pending = 0;
async function check() {
  pending = Date.now();
  await send({ i: cur.i, by: "glasses", lv: cur.lv || 0, vreq: Date.now() % 1e9 });
  overlay("📷", K ? "Hold still, the phone is taking a photo" : "휴대폰 카메라로 찍어요. 잠깐 그대로", 9000);
}
function overlay(head, text, ms) {
  document.getElementById("ov")?.remove();
  const o = document.createElement("div"); o.id = "ov"; o.className = "ask";
  o.innerHTML = `<div class="msg" style="margin:0;font-size:44px">${head}</div><div class="msg" style="margin:0">${esc(text)}</div>`;
  document.body.append(o); setTimeout(() => o.remove(), ms);
}
async function finish() { await send({ i: cur.i, by: "glasses", fin: true }); }
async function restart() { await send({ i: 0, by: "glasses", lv: cur.lv ? 1 : 0 }); }
async function send(body) {
  const r = await fetch(`/api/runs/${run}/now`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, s: pair, base: cur.v }) });
  if (r.ok) { cur = await r.json(); draw(false); }
}
const marked = new Set();
async function markStuck() {  // 혼자 하기: 카드 번호만 만든 사람에게(키 없이)
  const c = cards[cur.i]; if (!c || marked.has(c.n)) return;
  const r = await fetch(`/api/runs/${run}/mark`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ n: c.n }) }).catch(() => null);
  if (r?.ok) marked.add(c.n);
  draw();
}
async function callMaker() {  // 도움을 다 봐도 안 되면 사람을 부른다(카드 번호만 간다)
  const r = await fetch(`/api/runs/${run}/call`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ s: pair, call: true, why: "glasses" }) });
  if (r.ok) { cur = await r.json(); draw(false); }
}
async function help() {  // 도움 단계 한 칸 올리기(따라 하기 화면이 받아서 그림·소리·움직임을 더 보여 준다)
  const r = await fetch(`/api/runs/${run}/now`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ i: cur.i, lv: Math.max(2, (cur.lv || 0) + 1), by: "glasses", s: pair, base: cur.v }) });  // 사진이 보이는 상태에서 처음 누르면 글만 남던 것(11-04 검수): 그림부터  // base: 마지막으로 본 상태. 그사이 휴대폰이 카드를 넘겼으면 서버가 이 값을 버린다
  if (r.ok) { cur = await r.json(); draw(false); }
}
async function flip(d) {
  const i = Math.max(0, Math.min(cards.length - 1, cur.i + d));
  const r = await fetch(`/api/runs/${run}/now`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ i, by: "glasses", lv: cur.lv ? 1 : 0, s: pair, base: cur.v }) });
  if (r.ok) { cur = await r.json(); draw(false); }
}
let fails = 0;
function net(text) { const e = document.getElementById("net"); e.textContent = text || ""; e.hidden = !text; }
async function poll() {
  try {
    const r = await fetch(`/api/runs/${run}/now?s=${pair}`); if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    fails = 0; net("");  // 연결 코드 없이 열면(안경 첫 화면에서) 안경만으로 넘기는 모드: 경고 대신 '확인'만 뺀다(11-04 사용자)
    if (shownRes === undefined) shownRes = d.vres ? d.vres.id : null;  // 열 때 남아 있던 옛 결과는 띄우지 않는다
    if (pending && Date.now() - pending > 9000) {  // 휴대폰이 답하지 않으면(따라 하기 화면이 안 열려 있음)
      pending = 0;
      overlay("!", K ? "Open Coach mode on the phone to check" : "휴대폰에서 따라 하기 화면을 열어 두면 확인할 수 있어요", 5000);
    }
    if (d.vres && d.vres.id !== shownRes) {  // 확인 결과
      shownRes = d.vres.id; pending = 0;
      const head = { done: "✓", not_yet: "…", different: "↺", unclear: "?", error: "!" }[d.vres.result] || "?";
      const word = { done: K ? "Done" : "됐어요", not_yet: K ? "Not yet" : "아직이에요", different: K ? "Different" : "달라요", unclear: K ? "Can't see well" : "잘 안 보여요", error: "" }[d.vres.result] || "";
      overlay(head, [word, K ? d.vres.en : d.vres.ko].filter(Boolean).join(" · "), 5000);
    }
    if (d.v !== cur.v) {  // 교사가 사진·그림·움직임을 바꿨을 수 있다(처음 한 번은 이미 받았다)
      if (cur.v !== -1) { const x = await (await fetch(`/api/runs/${run}/cards`)).json(); cards = x.cards; arch = x.stage === "archived"; xOk = !!x.extra?.ok; alone = x.mode === "alone"; noDone = !!x.no_done; }
      if (!cards.length) { document.getElementById("m").innerHTML = `<div class="msg" id="msg">${K ? "No card set" : "카드 묶음이 없어요"}</div>`; cur = d; }
      else {  // 카드가 지워졌으면 마지막 카드로. 그리다 실패하면 cur를 되돌려 다음 확인 때 다시 그린다
        const was = cur; cur = { ...d, i: Math.max(0, Math.min(cards.length - 1, d.i | 0)) };
        try { draw(d.again); } catch (e) { cur = was; throw e; }
      }
    }
  } catch { if (++fails >= 5) net(K ? "Connection lost · retrying" : "연결 끊김 · 다시 잇는 중"); }  // 약 3.5초 연속 실패부터
  setTimeout(poll, 700);
}
(async () => {
  const r = run && await fetch(`/api/runs/${run}/cards`);
  if (!r || !r.ok) { document.getElementById("msg").textContent = K ? "No card set" : "카드 묶음이 없어요"; return; }
  const x = await r.json(); cards = x.cards; arch = x.stage === "archived"; xOk = !!x.extra?.ok; alone = x.mode === "alone"; noDone = !!x.no_done;
  poll();
})();
</script>
</body>
</html>
